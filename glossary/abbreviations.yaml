# ראשי תיבות and קיצורים in the printed sources → how a reader says them.
#
# Used by scripts/ocr-match.py to line up the OCR (which keeps the
# abbreviations) with the voicenote (where the speaker reads them out).
# Keys are written without prefix letters: "בבחי'", "ובחי'" and "לבחי'"
# all match "בחי'". The first expansion is the usual one; list others the
# speaker uses. Abbreviations missing here still match when the spoken
# words fit their letters (בחי' → בחינת, ע"י → על ידי), so add an entry
# only when that rule fails.

