# Recurring Whisper mis-hearings → correct form.
#
# Applied by scripts/apply-fixes.py (run automatically by transcribe.py):
#   <audio>.raw.txt  (untouched Whisper output)  →  <audio>.fixed.txt
#
#   auto:   replaced automatically. Only for forms that are never a real word
#           in these shiurim. Matching is whole-word; a leading Hebrew prefix
#           (ו ה ב כ ל מ ש ד) is kept: "וזרנפין" → "וזעיר אנפין".
#   review: real Hebrew words that are *usually* a mis-hearing here
#           (סכל, הדת, אורח ...). Never replaced — the script lists every
#           hit with context so the cleanup pass decides case by case.
#
# Grow this file! When cleaning a transcript turns up a mis-hearing you have
# seen before, add it here so the next lesson starts cleaner.
# A discourse can add its own list in discourses/<NNN-slug>/whisper-fixes.yaml
# (same format; merged after this one).

auto:
  # --- אין סוף / ספירות / פרצופים ---
  "אורן סוף": "אור אין סוף"
  "מוכין": "מוחין"
  "זרן פין": "זעיר אנפין"
