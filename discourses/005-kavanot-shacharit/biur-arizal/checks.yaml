# The independent check's main findings (check.md, 2026-11-13), for the review copy (--review).
# Each paragraph in `places` gets a mark; the findings print at the end. The explanation's own
# sentences are not changed by this file. When a finding is settled, remove it or set `settled:`.

intro: >-
  אחרי שנכתב החלק הראשון בדקו אותו שני בודקים שלא ראו את הכתיבה, מול המקורות. אלה ממצאיהם העיקריים. הם לא
  הוכנסו לביאור, שכן הם נוגעים בתוכן, וכל אחד ממתין להכרעה. הפירוט המלא בקובץ הבדיקה.

findings:
  - id: 1
    title: 'חיבור העשיה ליצירה: ראש בראש, אבל לא "אלא אל ראשה"'
    places: ['מבוא.10']
    body: >-
      "ראש בראש" נכון כסדר התפילה (פע"ח שער התפילה: "צריך לייחד תחלה ראש היצירה עם ראש העשייה"). אבל השלילה
      ("אין מחברים אותה אל תחתית היצירה") סותרת את תיאור העלייה עצמה: "ע"י קרבן התמיד עולים פנימיות ג"ר דעשיה
      ונעשים חיצוניות אל ג"ת דיצירה" (שער הכוונות, דרושי תפלת השחר ג').
    evidence: 'שער הכוונות, דרושי תפלת השחר ג׳; פרי עץ חיים, שער התפילה'
  - id: 2
    title: 'מניין ח"י הברכות בשתי המהדורות'
    places: ['1.13']
    body: >-
      בשער הברכות שבפרי עץ חיים שני המניינים זה לצד זה: "מן ענ"י עד ברכת התורה" ו"מן הנותן לשכוי עד סוף ברכת
      התורה", ובראש הפרק "עשרים ברכות של שחר". הביאור מייחס לשער הברכות מניין אחד בלבד, והחשבון (ג' לפניהן ועוד
      י"ח) אינו מתיישב עם "עשרים".
    evidence: 'פרי עץ חיים, שער הברכות'
  - id: 3
    title: 'המעשה מתקן את העליונות שבעולם שתחתיו רק בחיצוניות'
    places: ['מבוא.19', '1.19']
    body: >-
      בשער הכוונות שבע העליונות נתקנות "בבחי' חיצוניות בלבד", ופנימיותן נתקנת במעשה הבא: של העשיה בתש"י, של
      היצירה בתש"ר. "נתקנות ממילא" בלי הסייג הזה מקצר יותר מדי.
    evidence: 'שער הכוונות, דרושי תפלת השחר ג׳'
  - id: 4
    title: 'פרי עץ חיים, שער התפילה, הפרק האחרון: המעשים עושים מוחין גם לפנימיות'
    places: ['מבוא.17', 'מבוא.21']
    body: >-
      שם: "ע"י יפנה וברכותיה נעשים מוחין דנפש דעשיה, פנימי ומקיף דנשמות", והמעתיק מעיר שזה סותר את תחילת השער
      ("אינו עולה רק חיצוניות העולמות"). הכלל "המעשה מתקן את החיצוניות, והעלייה אינה במעשה" צריך להזכיר שיש שם
      שיטה אחרת. וגם "פנימיות" משמשת בשני מובנים (של הספירות, ושל הנשמות) בלי ציון.
    evidence: 'פרי עץ חיים, שער התפילה, ד״ה ונבאר כוונה אחרת בענין עליית העולמות בחול'
  - id: 5
    title: 'שמועה אחת מכמה, שהרח"ו עצמו אומר שיש בהן הפכים'
    places: ['מבוא.22']
    body: >-
      הקטע "בכל תפילתינו... עד ביאת המשיח" הוא אחת מכמה שמועות שהרח"ו כותב עליהן "יש בהם דברים הפכים, ואיני
      זוכר תירוצם". לגבי ימות החול הן מסכימות; לגבי שבת ויום טוב, לא.
    evidence: 'פרי עץ חיים, שער התפילה, ד״ה וצריך עתה לבאר'
  - id: 6
    title: 'הטלית הקטן: הקטע המובא מדלג על השורה שלפניו'
    places: ['2.2', '2.5']
    body: >-
      לפני הקטע המובא נאמר "ציצית קטן הוא בחיצו' היצירה ולא בפנימיות", וזה הפך מה שבסעיף 2.2 ("כנגד פנימיותן").
      "מתיישב" מיישב רק את עשיה מול יצירה.
    evidence: 'שער הכוונות, דרושי הציצית, דרוש ו׳'
  - id: 7
    title: 'ארבע הציציות: ז"א נותן רק את המילויים'
    places: ['2.14', '2.15']
    body: >-
      ארבע האותיות הפשוטות היו של הנוקבא מתחילה ("לא היה לה בתחי' רק הוי"ה א' פשו'"); מה שז"א נותן הוא
      המילויים. והקטע אומר יותר: הציציות הן ה' גבורות מן הבינה, הקשרים נגזרים מחמש אותיות המילוי, ולארבעת
      המילויים ארבע משמעויות (נפש למ"ן, נשמות הגרים, רוח, נשמה).
    evidence: 'שער הכוונות, דרושי הציצית, דרוש א׳'
  - id: 8
    title: '"גדלות" בשני מובנים'
    places: ['2.4', '2.6', '2.21']
    body: >-
      הטלית הגדול הוא "גדלות" בדרושים א' ו-ו' ובפרי עץ חיים, ו"כנגד יניקה, ואין טלית ג' כנגד הגדלות" בדרוש ה'.
      הביאור אינו אומר שה"גדלות" הראשונה אינה גדלות המוחין של התפילין.
    evidence: 'שער הכוונות, דרושי הציצית, דרושים א׳, ה׳, ו׳'
  - id: 9
    title: 'הסתירה שבדרוש: שתיים, ואחת מהן מיושבת'
    places: ['3.18']
    body: >-
      הדרוש מעלה תחילה סתירה לביאור ברכת אבות של חול ומיישב אותה (הנקודה לבדה פנים בפנים, ט' הספירות אחור
      באחור), ורק אחר כך את ראש השנה, שנשאר בצ"ע. הביאור מדלג על הראשונה, וסופו עלול להיקרא כתשובה על השנייה.
    evidence: 'שער הכוונות, דרושי התפילין, דרוש ה׳'
