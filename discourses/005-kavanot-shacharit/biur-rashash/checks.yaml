# The independent check's open findings (check.md, 2026-11-15), for the review copy (--review).
# The errors it found were corrected in the explanation; these are readings that stay open.

intro: >-
  אחרי שנכתבו המבוא והסעיפים 1–4 בדק אותם בודק שלא ראה את הכתיבה, מול המקורות. הטעויות שמצא תוקנו. אלה
  הנקודות שנשארו פתוחות, והן ממתינות להכרעה.

findings:
  - id: 1
    title: 'הטלית הקטן: פנימיות ובחיצוניות'
    places: ['2.3']
    body: >-
      בלקוטים (ט"ז ע"א) נאמר "נראה" שגם הטלית הקטן בחיצוניות, בלי הכרעה. הצירוף ששני הלשונות עולים יחד, כי הקטן
      הוא הפנימיות שבחיצוניות (כ"ד ע"ב), הוא קריאת הביאור.
    evidence: 'נהר שלום, דף ט״ז ע״א; דף כ״ד ע״ב'
  - id: 2
    title: '"נמות" בפנימיות העשיה'
    places: ['מבוא.12']
    body: >-
      בנוסח: "ופנימיות דעשיה הנק' נמות". הביאור קורא נפשות, כמו שבהמשך: "הרוחין" ביצירה, "הנשמות" בבריאה.
    evidence: 'נהר שלום, דף י״ב ע״א'
  - id: 3
    title: 'מסגרת אחרת בהקדמת הברכה'
    places: ['מבוא.14']
    body: >-
      בהקדמת הברכה: "המצות מעשיות הם וברכותיהם הם בחיצוניות דפנימיות", בחלוקה שבין ברכות המצוות לברכות הנהנין.
      הביאור מביא רק את החלוקה שבין המעשה לדיבור.
    evidence: 'נהר שלום, דף כ׳ ע״ב'
