  to: '"אבל ירידתן משם" (משם — מן המלכות, כמבואר להלן משער הגלגולים): כאן מיישב אדמו"ר הזקן בין הערה ב'' להערה ג''. לפי הערה ב'', הנר"ן מתלבשים בצלם כדי לקיים תורה ומצוות בגוף החומרי, ובזה מבררים ניצוצות משבירת הכלים. זו התעוררות מלמטה המעוררת גילוי אלוקות מלמעלה, ויחוד שניהם הוא פדיית גלות השכינה (וכבר הובא בהערה א'' שהתורה והמצוות ניתנו "לברר ולצרף", כדוגמת הצדקה).'
- from: 'בהערה ג'' מעץ חיים פן אחר לגמרי. גם שם הנפש, הרוח והנשמה מתלבשים בלבושים — הצלם, יצר הטוב ויצר הרע, וכל ערימת המדרגות שהוזכרה לעיל — אבל ההערה באה לעניין התפילה: הנר"ן מתבררים על ידי התפילות בעלייתם מן הקליפות, וזה מה שאדמו"ר הזקן מביא מעץ חיים. בירור הנר"ן בתפילות הוא עצמו האתערותא דלתתא, התעוררות מים נוקבים בנוקבא דז"א — שהיא בחינת השכינה, שאף היא נפלה אל הקליפות.'
  to: 'הערה ג'' באה מפן אחר, לעניין התפילה: הנר"ן "מתבררים ע"י התפלות" בעלייתם מן הקליפות. זו האתערותא דלתתא, התעוררות מ"ן בנוקבא דז"א, שהיא בחינת השכינה, שאף היא נפלה אל הקליפות.'
- from: הלבושים שהנפש, הרוח והנשמה מתלבשים בהם הם הצלם, של הנפש האלוקית וגם של הנפש הבהמית, המחוברת לעולם. הם מתבררים בבחירה — כאמור, במצוות, בבחירה ב"סור מרע ועשה טוב" בכל היום כולו. אבל בעבודת התפילה, שבה עוסקת הערה ג', אין המדובר בבירור הלבושים, אלא בנר"ן עצמם, המתבררים בעלייתם מן הקליפות. זו האתערותא דלתתא, המעוררת גילוי אלוקות מלמעלה; ובתפילה זהו הגילוי האלוקי שיש לאדם.
  to: 'הלבושים, הצלם של הנפש האלוקית ושל הנפש הבהמית המחוברת לעולם, מתבררים בבחירה שבמצוות בכל היום כולו: "סור מרע ועשה טוב". בתפילה אין המדובר בלבושים, אלא בנר"ן עצמם, העולים מן הקליפות; ובתפילה הגילוי האלוקי שיש לאדם.'
- from: 'יש כאן אפוא שני בירורים. האחד — הנר"ן מתלבשים בגוף כדי לקיים מצוות, וזהו הבירור שבאדם, בנפש, לצרף את הבריות. השני — הבירור שנעשה בתפילה: עליית הנר"ן מן הקליפות. ועל הירידה אומר אדמו"ר הזקן שהיא "לקיים תומ"צ מעשיות ולא תפלה לבדה דרבנן היא, דוגמת גלות השכינה, ואינו אלא לברר ולתקן הלבושים שלהם בעצמם": הירידה לקיים מצוות מעשיות היא "דוגמת גלות השכינה", ואינה אלא לבירור הלבושים. מה שאין כן התפילה: תכליתה עליית הנר"ן עצמם, ולא בירור הלבושים.'
  to: 'נמצאו שני בירורים: בירור הלבושים, בירידת הנר"ן לגוף כדי לקיים מצוות; ובירור הנר"ן עצמם, בעלייתם מן הקליפות בתפילה. על הירידה אומר אדמו"ר הזקן שהיא "לקיים תומ"צ מעשיות ולא תפלה לבדה", והיא "דוגמת גלות השכינה": כשם שהשכינה יורדת לברר ניצוצות (הערה ב''), כך יורדת הנשמה — "ואינו אלא לברר ולתקן הלבושים שלהם בעצמם".'
- from: 'נמצא שירידת הנר"ן להתלבש בלבושים, ולקיים בהם תורה ומצוות מעשיות, היא כדי לתקן את הלבושים עצמם ולברר את הטוב והרע שבהם. ואין זה סותר את מה שהתורה והמצוות מתקנות ניצוצות שנפלו בעולם: אלה הניצוצות השייכים לאדם, שמהם לבושיו, מקליפת נוגה, כמבואר בהערה א''. ואת זה אין אחר יכול לעשות בשבילו. מה שאין כן עליית הנר"ן מן הקליפות בעבודת התפילה — היא נעשית גם בידי אחרים.'
  to: 'ואין זה סותר את מה שהתורה והמצוות מתקנות ניצוצות שנפלו בעולם: אלה הניצוצות השייכים לו, שבקליפת נוגה, ומהם לבושיו (הערה א'').'
- from: אין כאן אפוא שתי דרכים מקבילות לבירור הלבושים. הלבושים, הכלים שבהם האדם מקיים תורה ומצוות כל ימי חייו, מתבררים בתורה ובמצוות המעשיות; והתפילה מעלה את הנר"ן עצמם כמ"ן. ובהמשך המאמר מוסיף אדמו"ר הזקן ש"קרוב לומר" שהתיקון מבפנים הוא במצוות שבדיבור, כמו התפילה, והתיקון מבחוץ במצוות המעשיות.
  to: 'אין כאן, אם כן, שתי דרכים מקבילות לבירור הלבושים: הלבושים, הכלים שבהם מקיים האדם תורה ומצוות כל ימיו, מתבררים במצוות המעשיות. ובהמשך מוסיף אדמו"ר הזקן על תיקון הלבושים: "וקרוב לומר שמבפנים הוא ע"י מצות שבדבור ומבחוץ ע"י מצות מעשיות" — והתפילה בכלל המצוות שבדיבור (הערה ו'').'
- from: 'וממשיך: "ומשום הכי הוא חיוב יותר על הנפש רוח נשמה לברר ולתקן לבושיהם שאי אפשר על ידי אחרים", מה שאין כן "להעלות הנר"ן מהקליפות למ"ן לנוקבא דז"א, שנעשה על ידי אחרים", ו"כפי גודל אותה המצוה או זריזות כו'' ומעלה אותה עד הנקבה העליונה כו''".'
  to: ''
- from: העלאת מ"ן אל הנקבה העליונה, שהיא סוד בירור הניצוצות — בתפילה, וגם במצווה — שווה בכולנו, והיא נעשית גם בידי אחרים. אבל את לבושיו הפרטיים האדם מתקן דווקא בתורה ובמצוות המעשיות, ואין אחר יכול לתקנם בשבילו. לכן התפילה לבדה אינה תכלית הירידה לגוף — "דרבנן היא" — אלא המצוות המעשיות שמן התורה; "ומשום הכי הוא חיוב יותר", שאת הלבושים אי אפשר לתקן בידי אחרים.
  to: '"ומשום הכי הוא חיוב יותר": את הלבושים אין אחר יכול לתקן במקום האדם. אבל "להעלות הנר"נ מהקליפות למ"נ" — סוד בירור הניצוצות, בתפילה וגם במצווה — הוא דבר "שנעשה ע"י אחרים", ובזה כולם שווים. ומכאן הדיוק "ולא תפלה לבדה, דרבנן היא": תכלית הירידה לגוף אינה התפילה, שהיא מדרבנן, אלא המצוות המעשיות שמן התורה.'
- from: כלומר, גם במצווה, כפי גודלה וכפי הזריזות שבה, האדם מעלה נשמה מן הקליפות "עד הנקבה העליונה", המלכות — וזו העלייה הנעשית בידי אחרים. וכן כתב בעץ חיים, כמובא בהערה ד', שהבירור הוא "כפי גודל התפלה או המצוה".
  to: '"וכפי גודל אותה המצוה או זריזות": גם במצווה, כפי גודלה והזריזות שבה, מעלה האדם נשמה מן הקליפות "עד הנקבה העליונה", המלכות — וזו עלייתה בידי אחרים. וכן בעץ חיים: "כפי גודל התפלה או המצוה" (הערה ד'').'
- from: 'ובשער הגלגולים מבואר הסדר כולו. הנשמה היוצאת מן הקליפות צריכה "בתחלה לבא בעבור במעי של המלכות נקבה העליונה", להיטהר שם, "ואח"כ יורדות בגוף בעה"ז" — וזוהי "ירידתן משם". היציאה מן הקליפות היא "על ידי תפלותיהם של ישראל", או על ידי "יחוד שמייחד האיש הצדיק", או "ע"י איזו מצוה שיעשה האדם" — כלומר, בידי אחרים. ואילו את מצוותיו האדם משלים בעצמו: "האדם צריך שיקיים כל התרי"ג מצות. ואם חסר אחת מהם, עדיין נפשו חסירה", ועל מצווה שלא קיים — "צריך בהכרח שיחזור להתגלגל פעמים רבות, עד שישלים את כלם". נמצא שתיקון הלבושים הוא דווקא בתורה ובמצוות המעשיות, ואי אפשר בידי אחרים; ועליית הנר"ן מן הקליפות היא בתפילה, ונעשית גם בידי אחרים.'
  to: 'בשער הגלגולים מבואר הסדר: הנשמה היוצאת מן הקליפות באה תחילה "בעבור במעי של המלכות נקבה העליונה", להיטהר שם, "ואח"כ יורדות בגוף בעה"ז" — זוהי "ירידתן משם". יציאתה מן הקליפות היא "על ידי תפלותיהם של ישראל", ביחוד של צדיק או במצווה שעושה אדם — בידי אחרים. אבל את מצוותיו משלים האדם בעצמו: "ואם חסר אחת מהם, עדיין נפשו חסירה", ומצווה שבידו לקיים ולא קיימה — "צריך בהכרח שיחזור להתגלגל" עד שישלים. נמצא: הלבושים מתוקנים במצוות המעשיות, בידי האדם עצמו; והנר"ן עולים מן הקליפות בתפילה, ואף במצווה, גם בידי אחרים.'
