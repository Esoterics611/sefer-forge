style:
- from: '"אבל ירידתן משם לעוה"ז בגוף החומרי" וכולי. אדמו"ר הזקן כאן מיישב בין שתי ההערות הקודמות בעץ חיים. בהערה שתיים מביא שהנפש רוח נשמה מתלבשים בלבושים שהם בחינת הצלם, כדי לקיים תורה ומצוות בגוף החומרי, ועל ידי זה הם מבררים את הניצוצות שנפלו בשבירת הכלים. וזו התעוררות מלמטה שמעוררת גילוי אלוקות מלמעלה, ושיש את הייחוד של שניהם — זה בחינת פדיית גלות השכינה: שהשכינה נפלה, הניצוצות נפלו בעולם הזה, על ידי התורה ומצוות שעל ידי בן אדם. ואמרנו שהבירור של הניצוצות פה על ידי התורה ומצוות — הם לא ניתנו תורה ומצוות אלא כדי לצרף בהם את הבריות. כשאנחנו — נתנו את הדוגמה קודם עם הצדקה — זה הבירור שבאמת נעשה על ידי תורה ומצוות, וזה מברר את גלות השכינה בכלל.'
  to: '"אבל ירידתן משם לעוה"ז בגוף החומרי" וכו''. כאן מיישב אדמו"ר הזקן בין שתי ההערות הקודמות מעץ חיים. בהערה ב'' מובא שהנפש, הרוח והנשמה מתלבשים בלבושים, בחינת הצלם, כדי לקיים בגוף החומרי את התורה והמצוות, ובזה הם מבררים את הניצוצות שנפלו בשבירת הכלים. זו התעוררות מלמטה המעוררת גילוי אלוקות מלמעלה, ויחוד שניהם הוא בחינת פדיית גלות השכינה — שהשכינה נפלה, והניצוצות נפלו בעולם הזה — על ידי התורה והמצוות שעושה האדם. כאמור, בירור הניצוצות הוא בתורה ובמצוות, שלא ניתנו אלא לצרף בהן את הבריות; וכדוגמת הצדקה שהובאה בהערה א'', זהו הבירור הנעשה בתורה ובמצוות, והוא מברר את גלות השכינה בכלל.'
- from: בהערה שלוש בעץ חיים מביא פן שני לגמרי, שהנפש רוח נשמה מתלבשים בלבושים, שזה הצלם, שזה יצר טוב ויצר הרע וכל הערימה של דרגות שאמרנו קודם. אבל הוא בא פה בשביל עניין התפילה, ושהנפש רוח ונשמה מתבררים על ידי התפילות בעלייתן מהקליפות — זה מה שאדמו"ר הזקן מביא מהעץ חיים. ושהנפש רוח נשמה מתבררים על ידי התפילות — זה עצמו הוא האתערותא דלתתא, התעוררות מים נוקבים בנוקבא דז"א, שהנוקבא דז"א, שגם מבחינת השכינה, נפלה על הקליפות.
  to: 'בהערה ג'' מעץ חיים פן אחר לגמרי. גם שם הנפש, הרוח והנשמה מתלבשים בלבושים — הצלם, יצר הטוב ויצר הרע, וכל ערימת המדרגות שהוזכרה לעיל — אבל ההערה באה לעניין התפילה: הנר"ן מתבררים על ידי התפילות בעלייתם מן הקליפות, וזה מה שאדמו"ר הזקן מביא מעץ חיים. בירור הנר"ן בתפילות הוא עצמו האתערותא דלתתא, התעוררות מים נוקבים בנוקבא דז"א — שהיא בחינת השכינה, שאף היא נפלה אל הקליפות.'
