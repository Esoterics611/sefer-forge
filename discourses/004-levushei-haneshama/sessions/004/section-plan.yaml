style:
- from: בהערה הקודמת הביא העץ חיים שהמצוות מצרפות את הצלם, ומה שמחבר את החומר והצורה, שזה הנפש, רוח, נשמה והגוף.
  to: בהערה הקודמת הביא עץ חיים שהמצוות מצרפות את הצלם, המחבר את החומר והצורה, שהם הנפש, הרוח והנשמה, והגוף.
- from: בהערה שלוש העץ חיים הביא מהזוהר שכל משך הגלות הוא בירור של ניצוצות שנפלו בקליפות. שכמו שהאדם מברר את הניצוצות ששייכים לבירור הלבושים — שאמרנו שזה הצלם שלו, אמרנו שזה התודעה והאישיות של האדם — שעל ידי שהוא בוחר ב"סור מרע ועשה טוב" בפועל ממש, בכל רגע, נשאר רושם בזה, בצלם. והבירור הזה באדם, על ידי עשיית המצוות ולימוד התורה, זה מה שמברר את הניצוצים, שזה התהליך שהאדם עצמו בא ללמוד בעולם הזה, על ידי הניסיונות ועל ידי הבירור של הלבושים של מחשבה, דיבור ומעשה, שהם באמת, אמרנו לפני זה, הלבושים של הנפש, רוח ונשמה.
  to: 'בהערה ג'' הביא עץ חיים מן הזוהר שכל משך הגלות הוא בירור של ניצוצות שנפלו בקליפות. האדם מברר את הניצוצות השייכים לבירור לבושיו, שהם, כאמור, הצלם שלו, התודעה והאישיות: בכל פעם שהוא בוחר ב"סור מרע ועשה טוב" בפועל ממש, נשאר רושם בצלם. והבירור הזה, בעשיית המצוות ובלימוד התורה, הוא המברר את הניצוצות. זהו התהליך שהאדם בא ללמוד בעולם הזה: בניסיונות ובבירור לבושי המחשבה, הדיבור והמעשה, שהם, כאמור לעיל, לבושי הנפש, הרוח והנשמה.'
- from: 'עכשיו מביאים שעל דרך זה בעולם כולו: שהעולם הוא אדם גדול, הוא אדם אחד, והאדם הוא עולם קטן. ולכן יבוא משיח מתי שיסתיים הגלות, שהשכינה יורדת לגלות לברר ניצוצות, על דרך מה שהנפש, רוח ונשמה יורדים לגוף כדי לברר את הלבושים שלהם על ידי הניסיונות, שזה על ידי ההעלם וההסתר של העולם, שרק על ידי זה יש בחירה חופשית, ופה נכנסים התורה והמצוות. אז ככה זה בכללות העולם: שגם בכללות העולם יש צלם מסוים, שיש לבושים לנפש הכללית של העולם. וזה מה שנקרא, "הם אדם אחד".'
  to: 'ועל דרך זה בעולם כולו: העולם הוא אדם גדול, אדם אחד, והאדם הוא עולם קטן. ולכן יבוא משיח כשתסתיים הגלות: השכינה יורדת לגלות לברר ניצוצות, כשם שהנפש, הרוח והנשמה יורדות לגוף לברר את לבושיהן בניסיונות, כלומר בהעלם ובהסתר של העולם, שרק בהם יש בחירה חופשית, וכאן נכנסות התורה והמצוות. כך בכללות העולם: גם לו יש צלם מסוים, לבושים לנפש הכללית של העולם. וזה מה שנקרא, "הם אדם אחד".'
- from: ומה זה אומר ש"המלכים"? זה מדבר על האורות דתוהו. שהאורות דתוהו, שהם השורש של כל הכיסופים של העולם הזה, וכל מה שהעבודה בעולם הזה היא לברר את הניצוצות האלה. ואמרנו שבעולם הפרטי זה על ידי הבחירה בטוב, "וסור מרע ועשה טוב"; ככה גם באדם הכללי, בכללות האנושות, שההיסטוריה האנושית מתקדמת לברר את הנפש הכללית.
  to: 'ומה פירוש "המלכים"? אלה האורות דתוהו, שהם השורש של כל הכיסופים שבעולם הזה, וכל העבודה בעולם הזה היא לברר את הניצוצות האלה. בעולם הפרטי, כאמור, הבירור הוא בבחירה בטוב, "וסור מרע ועשה טוב"; וכך גם באדם הכללי, בכללות האנושות: ההיסטוריה האנושית מתקדמת לברר את הנפש הכללית.'
- from: 'ופה אומרים: "שבכל פעם שיש תפילה, אנחנו מעלים על ידי תפילתנו ניצוצות הקדושה, שזה הכל בבחינת מים נוקבים". אז פה מביא שלא רק על ידי המצוות, אלא גם על ידי התפילה יש אותו תהליך של העלאת מ"ן. ועוד הוא אומר שבאופן כללי בעולם, איזה תפילות שמבררות את הניצוצות הכלליות בעולם, עד שיבוא המשיח.'
  to: 'וכאן נאמר: "שבכל פעם שיש תפילה, אנחנו מעלים על ידי תפילתנו ניצוצות הקדושה, שזה הכל בבחינת מים נוקבים". כאן מובא שלא רק במצוות, אלא גם בתפילה, יש אותו תהליך של העלאת מ"ן. ועוד הוא אומר שבכללות העולם יש תפילות המבררות את הניצוצות הכלליים שבעולם, עד שיבוא המשיח.'
- from: 'כמו שהוא אומר: "כאשר יתבררו ויעלו גם הניצוצין אשר ברגליו" — בדרגות הכי תחתונות — "אז יושלם להתתקן כל אדם הזה, אז יבא משיח".'
  to: 'וכלשונו: "כאשר יתבררו ויעלו גם הניצוצין אשר ברגליו" — בדרגות התחתונות ביותר — "אז יושלם להתתקן כל אדם הזה, אז יבא משיח".'
- from: 'והאנושות הולכת ומתפתחת מהכלל עד לפרטי פרטים, וכמו שרואים שיש התקדמות כבר באנושות של ימות המשיח. וההתקדמות היא עד שיש את הבירור וההתקדמות בתודעה האנושית, כמו שיש בתודעה הפרטית, שאדם מתקדם לגילוי משיח שבו, שזה גילוי רוח הקודש: אדם משלים את כל מעשיו וקידש את עצמו, אז נחה עליו השכינה.'
  to: 'והאנושות הולכת ומתפתחת מן הכלל עד לפרטי פרטים, וכבר רואים באנושות התקדמות של ימות המשיח. ההתקדמות היא עד הבירור וההתקדמות בתודעה האנושית, כמו בתודעה הפרטית, שבה אדם מתקדם לגילוי משיח שבו, הוא גילוי רוח הקודש: כשאדם משלים את כל מעשיו ומקדש את עצמו, נחה עליו השכינה.'
- from: על כל פנים, הערה שלוש פה מוסיפה לנו בשם העץ חיים שהתפילה היא בעצם מה שמבררת את הניצוצות, והיא מבחינת העלאת מ"ן. צריכים גם לבאר מה זה בחינת העלאת מ"ן, המים נוקבים, שזה אמרנו התעוררות מלמטה.
  to: 'הערה ג'' מוסיפה אפוא בשם עץ חיים שהתפילה היא המבררת את הניצוצות, והיא בחינת העלאת מ"ן. ויש לבאר מהי העלאת מ"ן, המים נוקבים: היא, כאמור, ההתעוררות מלמטה.'
- from: 'שההתעוררות מלמטה, הדרך של לתקן את הלבושים, היא על ידי שהלבושים — אמרנו — מבחינת האישיות והתודעה, והאדם מגיע לאיזשהו ניסיון בחיים, והוא בוחר עכשיו בטוב. זה שהוא בחר בטוב: הוא עושה מצווה ואומר: אני לא רוצה לתת צדקה, אבל אני אתן צדקה בגלל שהתורה מחייבת אותי, ואני עושה את זה בשביל המצווה של הצדקה, לעשות נחת רוח להשם, ואני מוסיף בזה מצוות "ואהבת לרעך כמוך", מוסיף בזה התבוננות וצער על הצער של העני שמקבל את הצדקה, ותפילה לעזור לו. וכל האורות האלה, כל הטוב הזה, שבן אדם הולך ומגדל במחשבה, דיבור ומעשה שלו במצווה הזאתי, משאיר רושם בעולם, מברר את הלבושים, הוא עושה אותו בן אדם שלו הרגלים יותר טובים — ואמרנו שזה נכנס קצת גם לדרגה הביולוגית של גוף האדם, נספג שמה — וזה, כל זה נקרא התעוררות מלמטה.'
  to: 'ההתעוררות מלמטה, הדרך לתקן את הלבושים, שהם, כאמור, האישיות והתודעה, היא כך: האדם מגיע לניסיון כלשהו בחיים, ובוחר בטוב. בחירתו בטוב: הוא עושה מצווה ואומר: איני רוצה לתת צדקה, אבל אתן צדקה כי התורה מחייבת אותי; אני עושה זאת לשם מצוות הצדקה, לעשות נחת רוח לה''; ואני מוסיף בזה מצוות "ואהבת לרעך כמוך", התבוננות וצער על צערו של העני המקבל את הצדקה, ותפילה לעזור לו. וכל האורות האלה, כל הטוב הזה שאדם הולך ומגדל במחשבה, בדיבור ובמעשה שלו במצווה זו, משאירים רושם בעולם ומבררים את הלבושים, ועושים אותו אדם בעל הרגלים טובים יותר; וכאמור, זה נכנס במקצת גם לדרגה הביולוגית של גוף האדם ונספג בה. כל זה נקרא התעוררות מלמטה.'
- from: ההתעוררות של המים נוקבים — ההתעוררות בזיווג של הנקבה לפני שהיא מקבלת את הזכר. פה הנקבה זה ההתעוררות של העולם הזה, בחינת הנקבה שמקבלת מהקדוש ברוך הוא. הקדוש ברוך הוא משפיע על זה, הוא הזכר, והזיווג של הזכר והנקבה בעולם הזה זה הייחוד האלוקי, שהגילוי שלו פה הוא בניסים ונפלאות ובגילוי שכינה, שזה התכלית שלו. לכן אומרים שבגלות הנקבה התחתונה היא לא מקבלת, או אין בה שום התעוררות, זכר לא משפיע פה, אין גילוי אלוקות, וזה הגלות של השכינה. והתיקון של השכינה זה ההתעוררות מלמטה.
  to: 'ההתעוררות של המים נוקבים היא ההתעוררות בזיווג של הנקבה קודם שהיא מקבלת את הזכר. כאן הנקבה היא ההתעוררות של העולם הזה, בחינת הנקבה המקבלת מן הקדוש ברוך הוא; הקדוש ברוך הוא, המשפיע, הוא הזכר. והזיווג של הזכר והנקבה בעולם הזה הוא הייחוד האלוקי, שגילויו כאן הוא בניסים ונפלאות ובגילוי שכינה, וזו תכליתו. לכן אומרים שבגלות הנקבה התחתונה אינה מקבלת, או שאין בה שום התעוררות: הזכר אינו משפיע כאן, ואין גילוי אלוקות, וזו גלות השכינה. ותיקון השכינה הוא ההתעוררות מלמטה.'
- from: 'עכשיו, ההתעוררות מלמטה, קודם זה אמרנו על ידי המצוות. הקטע, ההערה השלישית של העץ חיים, אומר לנו שזה גם נעשה על ידי התפילה. המכנה המשותף בכולם — ונראה את זה גם להמשך — זה של ההתעוררות של מים נוקבים, שזה ההתעוררות מלמטה, או על ידי התפילה או על ידי מעשי המצוות, הן באדם הפרטי ובין בעולם הכללי. הם ממשיכים, מקביל להם מלמעלה, גם כן המשכת מים דכורין, מים זכרים של השפעה אלוקית, לפי ערך ההתעוררות מלמטה: שזה או של קבלת התפילה, או שעל ידי המצווה נמשך גילוי אלוקי פה למטה, שמברר את העולם כולו ואת האדם.'
  to: 'את ההתעוררות מלמטה הזכרנו קודם במצוות; ההערה השלישית, מעץ חיים, מלמדת שהיא נעשית גם בתפילה. המכנה המשותף לכולן, וכך נראה גם בהמשך, הוא ההתעוררות של מים נוקבים, ההתעוררות מלמטה, בין בתפילה ובין במעשי המצוות, בין באדם הפרטי ובין בעולם הכללי. והן ממשיכות כנגדן מלמעלה מים דכורין, מים זכרים של השפעה אלוקית, לפי ערך ההתעוררות מלמטה: בקבלת התפילה, או בגילוי האלוקי הנמשך כאן למטה על ידי המצווה, המברר את העולם כולו ואת האדם.'
- from: 'למרות שבזמן הגלות לא רואים את זה, כי זה מבטל את הבחירה החופשית, אבל בתפילה דווקא כן רואים את זה, כי בתפילה — בקבלת התפילה, וגם בהארה האלוקית שמגלה הנשמה על ידי הזדככות הלבושים. ולכן גם הגאולה קשורה לבני האדם שמגיעים לתודעה, שבהם בתפילה באמת מאירה הנשמה על ידי התשובה. ולכן עושים תשובה, מייד הם נגאלים, שבני האדם מזככים את הלבושים. וזה במקביל גם בעולם הכללי וגם באדם הפרטי: שמצד העולם, כבר עולם מוכן לגאולה; מצד האדם הפרטי, כשהוא מברר את הלבושים שלו, עד שההתעוררות הזאת, היא התעוררות מלמטה, מעוררת התעוררות של גילוי הנשמה שלמעלה, שדוחפת אותו עוד יותר ללימוד התורה ומצוות, וצדקה ושמחה, והכל מתוך שמחה גדולה. וזה משפיע על חלקו בעולם, עד שבאמת יוצאת השכינה מהגלות, עושה את ההתעוררות מלמטה, וממשיכה את המשכה מלמעלה, עד שיש גילוי אלוקות בכל העולם בביאת משיח צדקנו.'
  to: 'בזמן הגלות אין רואים זאת, כי הדבר מבטל את הבחירה החופשית; אבל בתפילה דווקא רואים זאת: בקבלת התפילה, וגם בהארה האלוקית שהנשמה מגלה בהזדככות הלבושים. ולכן גם הגאולה קשורה לבני אדם המגיעים לתודעה שבה, בתפילה, הנשמה מאירה באמת על ידי התשובה; ולכן כשעושים תשובה, מיד נגאלים, שבני האדם מזככים את הלבושים. וכך במקביל בעולם הכללי ובאדם הפרטי: מצד העולם, העולם כבר מוכן לגאולה; ומצד האדם הפרטי, כשהוא מברר את לבושיו, ההתעוררות הזאת, ההתעוררות מלמטה, מעוררת התעוררות של גילוי הנשמה שלמעלה, הדוחפת אותו עוד יותר ללימוד התורה ולמצוות, לצדקה ולשמחה, והכל מתוך שמחה גדולה. וזה משפיע על חלקו בעולם, עד שבאמת יוצאת השכינה מן הגלות, עושה את ההתעוררות מלמטה וממשיכה את ההמשכה מלמעלה, עד שיש גילוי אלוקות בכל העולם בביאת משיח צדקנו.'
teaching:
- from: בהערה הקודמת הביא עץ חיים שהמצוות מצרפות את הצלם, המחבר את החומר והצורה, שהם הנפש, הרוח והנשמה, והגוף.
  to: ''
- from: 'בהערה ג'' הביא עץ חיים מן הזוהר שכל משך הגלות הוא בירור של ניצוצות שנפלו בקליפות. האדם מברר את הניצוצות השייכים לבירור לבושיו, שהם, כאמור, הצלם שלו, התודעה והאישיות: בכל פעם שהוא בוחר ב"סור מרע ועשה טוב" בפועל ממש, נשאר רושם בצלם. והבירור הזה, בעשיית המצוות ובלימוד התורה, הוא המברר את הניצוצות. זהו התהליך שהאדם בא ללמוד בעולם הזה: בניסיונות ובבירור לבושי המחשבה, הדיבור והמעשה, שהם, כאמור לעיל, לבושי הנפש, הרוח והנשמה.'
  to: '"כד יסתיים גלותא": עץ חיים מביא מן הזוהר שכל הגלות היא בירור הניצוצות שנפלו בקליפות. כך באדם: בכל בחירה של "סור מרע ועשה טוב" נשאר רושם בצלם (הערה א''), ובתורה ובמצוות הוא מברר את הניצוצות השייכים ללבושיו, המחשבה, הדיבור והמעשה. זה התהליך שהאדם בא ללמוד בעולם הזה, בניסיונות.'
- from: 'ועל דרך זה בעולם כולו: העולם הוא אדם גדול, אדם אחד, והאדם הוא עולם קטן. ולכן יבוא משיח כשתסתיים הגלות: השכינה יורדת לגלות לברר ניצוצות, כשם שהנפש, הרוח והנשמה יורדות לגוף לברר את לבושיהן בניסיונות, כלומר בהעלם ובהסתר של העולם, שרק בהם יש בחירה חופשית, וכאן נכנסות התורה והמצוות. כך בכללות העולם: גם לו יש צלם מסוים, לבושים לנפש הכללית של העולם. וזה מה שנקרא, "הם אדם אחד".'
  to: '"הם אדם א''": העולם אדם גדול, אדם אחד, והאדם עולם קטן (הערה א''). השכינה יורדת לגלות לברר ניצוצות, כנר"ן היורדות לגוף לברר את לבושיהן, ובסוף הגלות יבוא משיח. הבירור הוא בניסיונות, בהעלם ובהסתר שבעולם, שבהם בלבד יש בחירה, ובהם התורה והמצוות. ולעולם כולו יש צלם, לבושי הנפש הכללית.'
- from: 'ומה פירוש "המלכים"? אלה האורות דתוהו, שהם השורש של כל הכיסופים שבעולם הזה, וכל העבודה בעולם הזה היא לברר את הניצוצות האלה. בעולם הפרטי, כאמור, הבירור הוא בבחירה בטוב, "וסור מרע ועשה טוב"; וכך גם באדם הכללי, בכללות האנושות: ההיסטוריה האנושית מתקדמת לברר את הנפש הכללית.'
  to: '"המלכים" הם האורות דתוהו, שורש כל הכיסופים שבעולם הזה, וכל העבודה בעולם היא לברר את ניצוצותיהם: היחיד, בבחירה בטוב; והאדם הכללי, האנושות, בהיסטוריה המתקדמת לברר את הנפש הכללית.'
- from: 'וכאן נאמר: "שבכל פעם שיש תפילה, אנחנו מעלים על ידי תפילתנו ניצוצות הקדושה, שזה הכל בבחינת מים נוקבים". כאן מובא שלא רק במצוות, אלא גם בתפילה, יש אותו תהליך של העלאת מ"ן. ועוד הוא אומר שבכללות העולם יש תפילות המבררות את הניצוצות הכלליים שבעולם, עד שיבוא המשיח.'
  to: '"אנו מעלין ע"י תפלתינו ניצוצות הקדושה שבו בבחי'' מ"נ": לא במצוות בלבד, גם בתפילה נעשה אותו בירור, וזו העלאת מ"ן. וזו כוונת ההגהה, "שנר"נ מתבררים ע"י התפלות". ובכללות העולם, התפילות מבררות את ניצוצותיו הכלליים, עד ביאת המשיח.'
- from: 'וכלשונו: "כאשר יתבררו ויעלו גם הניצוצין אשר ברגליו" — בדרגות התחתונות ביותר — "אז יושלם להתתקן כל אדם הזה, אז יבא משיח".'
  to: '"וכאשר יתבררו ויעלו גם הניצוצין אשר ברגליו": גם הניצוצות שבדרגות התחתונות ביותר; ובכך יושלם תיקון האדם הכללי, ויבוא משיח.'
- from: 'והאנושות הולכת ומתפתחת מן הכלל עד לפרטי פרטים, וכבר רואים באנושות התקדמות של ימות המשיח. ההתקדמות היא עד הבירור וההתקדמות בתודעה האנושית, כמו בתודעה הפרטית, שבה אדם מתקדם לגילוי משיח שבו, הוא גילוי רוח הקודש: כשאדם משלים את כל מעשיו ומקדש את עצמו, נחה עליו השכינה.'
  to: 'האנושות מתפתחת מן הכלל אל הפרט, וכבר נראית בה התקדמות של ימות המשיח, בירור התודעה האנושית; כמו בתודעת היחיד, המתקדם אל גילוי משיח שבו, רוח הקודש: כשאדם משלים את מעשיו ומקדש את עצמו, נחה עליו השכינה.'
- from: 'הערה ג'' מוסיפה אפוא בשם עץ חיים שהתפילה היא המבררת את הניצוצות, והיא בחינת העלאת מ"ן. ויש לבאר מהי העלאת מ"ן, המים נוקבים: היא, כאמור, ההתעוררות מלמטה.'
  to: העלאת מ"ן, המים נוקבים, היא ההתעוררות מלמטה.
- from: 'ההתעוררות מלמטה, הדרך לתקן את הלבושים, שהם, כאמור, האישיות והתודעה, היא כך: האדם מגיע לניסיון כלשהו בחיים, ובוחר בטוב. בחירתו בטוב: הוא עושה מצווה ואומר: איני רוצה לתת צדקה, אבל אתן צדקה כי התורה מחייבת אותי; אני עושה זאת לשם מצוות הצדקה, לעשות נחת רוח לה''; ואני מוסיף בזה מצוות "ואהבת לרעך כמוך", התבוננות וצער על צערו של העני המקבל את הצדקה, ותפילה לעזור לו. וכל האורות האלה, כל הטוב הזה שאדם הולך ומגדל במחשבה, בדיבור ובמעשה שלו במצווה זו, משאירים רושם בעולם ומבררים את הלבושים, ועושים אותו אדם בעל הרגלים טובים יותר; וכאמור, זה נכנס במקצת גם לדרגה הביולוגית של גוף האדם ונספג בה. כל זה נקרא התעוררות מלמטה.'
  to: ההתעוררות מלמטה מתקנת את הלבושים, האישיות והתודעה, בבחירה בטוב בעת ניסיון. כגון מי שאינו רוצה לתת צדקה ונותן, כי התורה מחייבת, לשם המצווה ולנחת רוח לה'; ומוסיף "ואהבת לרעך כמוך", התבוננות וצער על צערו של העני, ותפילה לעזרתו. הטוב שהוא מגדל כך במחשבה, בדיבור ובמעשה משאיר רושם בעולם, מברר את הלבושים, מקנה הרגלים טובים, ונספג אף בדרגה הביולוגית של הגוף. זו ההתעוררות מלמטה.
- from: 'ההתעוררות של המים נוקבים היא ההתעוררות בזיווג של הנקבה קודם שהיא מקבלת את הזכר. כאן הנקבה היא ההתעוררות של העולם הזה, בחינת הנקבה המקבלת מן הקדוש ברוך הוא; הקדוש ברוך הוא, המשפיע, הוא הזכר. והזיווג של הזכר והנקבה בעולם הזה הוא הייחוד האלוקי, שגילויו כאן הוא בניסים ונפלאות ובגילוי שכינה, וזו תכליתו. לכן אומרים שבגלות הנקבה התחתונה אינה מקבלת, או שאין בה שום התעוררות: הזכר אינו משפיע כאן, ואין גילוי אלוקות, וזו גלות השכינה. ותיקון השכינה הוא ההתעוררות מלמטה.'
  to: 'מ"ן הם התעוררות הנקבה בזיווג, לפני שהיא מקבלת מן הזכר. כאן הנקבה היא העולם הזה המתעורר ומקבל, והזכר, המשפיע, הוא הקדוש ברוך הוא; זיווגם הוא הייחוד האלוקי, ותכליתו גילוי בעולם: ניסים ונפלאות וגילוי שכינה. בגלות אין בנקבה התחתונה התעוררות והיא אינה מקבלת; הזכר אינו משפיע ואין גילוי אלוקות: זו גלות השכינה, ותיקונה ההתעוררות מלמטה.'
- from: 'את ההתעוררות מלמטה הזכרנו קודם במצוות; ההערה השלישית, מעץ חיים, מלמדת שהיא נעשית גם בתפילה. המכנה המשותף לכולן, וכך נראה גם בהמשך, הוא ההתעוררות של מים נוקבים, ההתעוררות מלמטה, בין בתפילה ובין במעשי המצוות, בין באדם הפרטי ובין בעולם הכללי. והן ממשיכות כנגדן מלמעלה מים דכורין, מים זכרים של השפעה אלוקית, לפי ערך ההתעוררות מלמטה: בקבלת התפילה, או בגילוי האלוקי הנמשך כאן למטה על ידי המצווה, המברר את העולם כולו ואת האדם.'
  to: 'המכנה המשותף, כפי שיתבאר גם להלן, הוא ההתעוררות מלמטה, בתפילה ובמצוות, ביחיד ובעולם כולו; וכנגדה נמשכים מלמעלה, לפי ערכה, מים דכורין, השפעה אלוקית: קבלת התפילה, או גילוי אלוקי הנמשך במצווה ומברר את העולם ואת האדם.'
- from: 'בזמן הגלות אין רואים זאת, כי הדבר מבטל את הבחירה החופשית; אבל בתפילה דווקא רואים זאת: בקבלת התפילה, וגם בהארה האלוקית שהנשמה מגלה בהזדככות הלבושים. ולכן גם הגאולה קשורה לבני אדם המגיעים לתודעה שבה, בתפילה, הנשמה מאירה באמת על ידי התשובה; ולכן כשעושים תשובה, מיד נגאלים, שבני האדם מזככים את הלבושים. וכך במקביל בעולם הכללי ובאדם הפרטי: מצד העולם, העולם כבר מוכן לגאולה; ומצד האדם הפרטי, כשהוא מברר את לבושיו, ההתעוררות הזאת, ההתעוררות מלמטה, מעוררת התעוררות של גילוי הנשמה שלמעלה, הדוחפת אותו עוד יותר ללימוד התורה ולמצוות, לצדקה ולשמחה, והכל מתוך שמחה גדולה. וזה משפיע על חלקו בעולם, עד שבאמת יוצאת השכינה מן הגלות, עושה את ההתעוררות מלמטה וממשיכה את ההמשכה מלמעלה, עד שיש גילוי אלוקות בכל העולם בביאת משיח צדקנו.'
  to: 'בגלות הדבר נסתר, שאם לא כן בטלה הבחירה; אבל בתפילה הוא נראה: בקבלתה, ובהארה שהנשמה מגלה בלבושים המזדככים. לכן הגאולה תלויה בבני אדם שיגיעו לתודעה שבה הנשמה מאירה בתפילה, בתשובה; וכשעושים תשובה, מיד נגאלים, שהרי הלבושים מזדככים. העולם כבר מוכן לגאולה; והאדם המברר את לבושיו, התעוררותו מלמטה מעוררת מלמעלה גילוי של הנשמה, הדוחף אותו עוד לתורה, למצוות, לצדקה ולשמחה. וזה משפיע על חלקו בעולם, עד שהשכינה יוצאת מן הגלות ויש גילוי אלוקות בכל העולם, בביאת משיח צדקנו.'
