  to: 'וכך הנשמה יורדת לגוף בזמן התיקונים: בהתחברותה אליו ובתיקונו היא מבררת את הניצוצות שנפלו בשבירת הכלים, ומתקנת את העולם כולו (כיצד — יתבאר להלן).'
