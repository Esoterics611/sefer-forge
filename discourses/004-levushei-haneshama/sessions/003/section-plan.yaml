style:
- from: 'שתיים: עץ חיים, שער כ"ו, פרק א''. כאן מבאר יותר מה שהזכרנו קודם, שהגוף האמיתי הוא הבחינה, קליפת נוגה, שנקראת כתנות עור, שכלול מטוב ורע. זה היה באופן כללי, מסביר לך בכללות העולמות מה זה עניין. לא ביארנו שקליפת נוגה — כמובן שמסביב למימד של הקדושה יש מימד הקליפות. הקליפה מסתירה את הפרי עד שהפרי מוכן, ואז מסירים את הקליפה. המשל לא בדיוק דומה לנמשל: הקליפות יש חיות מצד עצמם, וצריכים לברר אותן, ואין כאן מקום להאריך בזה. אבל על כל פנים, יש שלוש קליפות הטמאות, יש קליפת נוגה, שהיא בין הטוב והרע, והממוצע בין הטוב — היא כלול בטוב ורע, והיא ממוצע, והיא מתחברת גם לצד הקדושה, שהוא כולו טוב, וגם לצד הטומאה, ששם הוא כולו רע. יש להסביר בין טוב ורע פה זה רצון להשפיע, רצון לקבל, כמו בשיטות של בעל הסולם, אבל קח את העניינים כפי שהם.'
  to: 'עץ חיים, שער כ"ו, פרק א'', מרחיב את מה שהזכרנו בהערה א'': שהגוף האמיתי הוא מקליפת נוגה, הנקראת כתנות עור, והוא כלול מטוב ורע. שם התבאר העניין באופן כללי, בכללות העולמות. ומהי קליפת נוגה? מסביב לקדושה יש קליפות. הקליפה מסתירה את הפרי עד שהוא מוכן, ואז מסירים אותה — אלא שהמשל אינו דומה לגמרי לנמשל: לקליפות יש חיות מצד עצמן, וצריך לברר אותן, ואין כאן מקום להאריך. יש שלוש קליפות טמאות, ויש קליפת נוגה, הממוצעת: היא כלולה מטוב ורע, ומתחברת גם לצד הקדושה, שכולו טוב, וגם לצד הטומאה, שכולו רע. (אפשר להסביר את הטוב והרע כאן כרצון להשפיע ורצון לקבל, כשיטת בעל הסולם, אבל נלמד את הדברים כפשוטם.)'
- from: על כל פנים, מה שהוא דיבר בקליפת נוגה, זה נשמע בעולמות. פה, בחלק השני שהוא מביא מהעץ, שהאלטער רבי, שאדמו"ר הזקן מביא מהעץ חיים, הוא שהלבוש הזה שאנחנו מדברים עליו, שהוא מה שהתורה ומצוות מתקנים, הוא בעצמו הצלם, שהצלם הזה הוא מה שנקרא יצר הטוב ויצר הרע.
  to: אבל כאן, בקטע השני שאדמו"ר הזקן מביא מעץ חיים, מבואר שהלבוש שהתורה והמצוות מתקנות הוא הצלם שבאדם עצמו.
- from: 'אז הוא אומר: כלל, הצורה הוא עיקר. קודם כל יש לנו צורה והחומר, נכון? שכל הגוף האדם זה חומר, ויש משהו שמחזיק אותו, כמו שכתוב, החי נושא את עצמו. הצלם של האדם — זה מה שהחלק הקודם של העץ חיים מביא — הוא נקרא גוף האדם האמיתי. ומה זה הצורה הזאתי? צורה זה, גם בלשון יצר, זה היצירה של האדם, זה העניין של הציור של האדם, שזה הנפש של האדם באמת, מה שנקרא כל הדרגות שבין הדנ"א של האדם והאינסטינקטים שלו, והמבנים הנפשיים שנקראים הסייקי, והמבנים של הסייקי שנקראים קומפלקסים, ועד שהקומפלקסים האלה מתאחדים באישיות של האדם — כל הדרגה הזאת, זה שם נקרא צלם.'
  to: 'הוא אומר: כלל — הצורה היא העיקר. יש צורה ויש חומר: כל גוף האדם הוא חומר, ויש מה שמחזיק אותו, כמאמר חז"ל: החי נושא את עצמו. צלם האדם הוא שנקרא, בקטע הקודם של עץ חיים, גוף האדם האמיתי. הצורה — וגם בלשון יצר — היא יצירתו של האדם, ציורו: נפשו האמיתית. כל המדרגות שבין הדנ"א והאינסטינקטים, דרך המבנים הנפשיים והתסביכים, ועד שהם מתאחדים באישיות — כל זה נקרא שם צלם.'
- from: מה זה צלם? אמרנו שגם צלם זה עניין של מבנה. והצלם הזה, יש פה מבנה שגם עולם הפסיכולוגיה מסביר, ובמבנה הזה יש את האור ואת החושך — ממש יצר טוב ויצר רע, שזה שהם שני צלמים. "והם המלאכים שבאדם עצמו, ואינו האדם עצמו".
  to: 'צלם, כאמור, הוא מבנה — מבנה שגם הפסיכולוגיה מתארת, ויש בו אור וחושך: יצר טוב ויצר רע, שני הצלמים. "והם המלאכים שבאדם עצמו, ואינו האדם עצמו".'
- from: 'שזה כל העולם שגם, גם הפסיכולוגיה של יונג, קרל גוסטב יונג, נכנס לזה: שיש כוחות רוחניים שהם מתגלים בתוך הדמיונות ובתוך המחשבות של האדם. ואיפה? זה בתוך הצלם של האדם, וזה מה שמתקשר גם בין העולם הרוחני והעולם הגשמי. שהאדם מתייחס בעולם הגשמי, אבל אם יש לו מחשבות, המחשבות עצמו באות מהדיבור של המלאכים. קטע הוא שהמחשבות של האדם מהדיבור של המלאכים, מחשבות של מלאכים מהדיבור של המלאכים שמעליהם, עד שעולה מהר חורב, בת קול שיוצאת מהר חורב, שזה הדיבור להכל, אבל על דרך השתלשלות, מדרגה אחרי מדרגה, נבראים הרבה ממוצעים, וכל הממוצעים האלה נמצאים עד עולם המחשבה של האדם. אז תחשבו שאנחנו עצמנו — הסולם מוצב ארצה וראשו מגיע השמימה, מלאכים עולים ויורדים — וזה אנחנו.'
  to: 'לכאן נכנסת גם הפסיכולוגיה של קרל גוסטב יונג: כוחות רוחניים מתגלים בדמיונות ובמחשבות של האדם. מקומם בצלם, והוא המקשר בין העולם הרוחני לעולם הגשמי. האדם פונה אל העולם הגשמי, אבל מחשבותיו באות מדיבור המלאכים, ומחשבות המלאכים מדיבור המלאכים שמעליהם, עד בת הקול היוצאת מהר חורב, שהיא הדיבור לכל; ובהשתלשלות, מדרגה אחר מדרגה, נבראים ממוצעים רבים, עד עולם המחשבה של האדם. הסולם מוצב ארצה וראשו מגיע השמימה, ומלאכים עולים ויורדים בו — וזה אנחנו עצמנו.'
- from: 'פה מסביר לנו יפה איך שזה: "ואינו האדם עצמו" — זה לא אתה, זה לא האדם עצמו. איפה נמצא פה? הוא אומר: "זה הבל דגרמי המתלבש תוך כלי שהוא הגוף". קודם כל הוא מביא — המילים האלה באמת זה עניינים רוחניים שמדברים על המדרגות שדיברתי קודם — אבל באמת החיבור שבין הנפש והגוף, הוא באמת אומר: דרך ההבל שבעצמות. ובאמת בתוך כל התאים — ויש הרבה מחקרים שמראים איך שהתאים והמצבים הביולוגיים באדם משפיעים על התודעה של האדם, והתודעה של האדם משפיעה על הגוף — וכל אלה נרשמים באוויר גן עדן וכו'', שנמצא מסביבנו בכל העולם, באדם הקולקטיבי, כמו שהסברנו קודם.'
  to: 'הצלם, אם כן, אינו אתה עצמך. ועל מקומו הוא אומר: "זה הבל דגרמי המתלבש תוך כלי שהוא הגוף". המילים האלה מדברות על המדרגות הרוחניות שתיארנו, אבל הן גם אומרות שהנפש מתחברת לגוף דרך ההבל שבעצמות. ואכן, מחקרים רבים מראים כיצד התאים והמצבים הביולוגיים משפיעים על התודעה, והתודעה על הגוף. וכל אלה נרשמים באוויר גן עדן וכו'', הנמצא סביבנו בכל העולם, ובאדם הקולקטיבי, כפי שביארנו בהערה א''.'
- from: '"לכן נקרא צלם, כי הוא דבר ממוצע בין הצורה והחומר". והצלם הזה, עם כל הדרגות שבו, זה לא רק האישיות, זה כל כך הרבה, זה כל המבנה — איך אומרים סטאק? זה כל הסטאק, ובעברית: הערימה, מהגוף ועד הנפש.'
  to: '"לכן נקרא צלם, כי הוא דבר ממוצע בין הצורה והחומר". הצלם, על כל דרגותיו, אינו רק האישיות: הוא כל המבנה, כל הרבדים, מהגוף ועד הנפש.'
- from: 'זאת אומרת "שהצורה אינה צריכה תיקון כלל, ולא הוצרכה להתלבש בצלם וחומר, רק להמשיך בהם אור לתקנם". עכשיו, פה הוא מביא: "כי זה טעם ירידת הנשמה בעולם הזה, לתקן, לברר דוגמת גלות השכינה, לברר ניצוצין שנפלו, כנודע". אז פה הוא אומר דווקא, כי כל המצוות — הם לא באו לתקן את הצורה, כלומר, הצורה שהיא הנשמה. פה כשאומר הצורה באמת זה הנפש, רוח, נשמה. אבל זה גם המבנה של הצלם, שהמבנה, בוא נקרא לזה אפילו הפסיכולוגי, הקוגניטיבי, ועד התודעתי שלנו, הוא באמת לא צריך את התיקון. התיקון הוא בשביל להמשיך בהם עוד אור, שעל ידי הלבושים האלה אנחנו ממשיכים אור. זאת אומרת שהנשמה היא אלוקית, ויש בה אור אין סוף, וכשהיא מאירה בתוך הלבושים האלה שאמרנו, על ידי תורה ומצוות, היא מתקנת אותם. אבל זה מה שאמרנו בפעם שעברה.'
  to: '"שהצורה אינה צריכה תיקון כלל, ולא הוצרכה להתלבש בצלם וחומר, רק להמשיך בהם אור לתקנם". והוא מביא: "כי זה טעם ירידת הנשמה בעולם הזה, לתקן, לברר דוגמת גלות השכינה, לברר ניצוצין שנפלו, כנודע". המצוות לא באו לתקן את הצורה, שהיא הנר"ן — נפש, רוח, נשמה. וגם בצלם, התיקון אינו בא לשנות את המבנה — הנפשי, הקוגניטיבי והתודעתי — אלא להמשיך בו עוד אור: על ידי הלבושים האלה אנו ממשיכים אור. הנשמה אלוקית, ויש בה אור אין סוף, וכשהיא מאירה בלבושים על ידי תורה ומצוות, היא מתקנת אותם, כפי שנתבאר בפעם הקודמת.'
- from: 'ועכשיו, מה נתווסף על ידי התיקון הזה? פה אומר: "דוגמת גלות השכינה לברר ניצוצים שנפלו כנודע". השכינה לא ירדה לגלות בטעות, חס ושלום. הגלות השכינה היה כדי שהעולמות התחתונים, ששם היא נפלה, יתבררו, כי השכינה היא כוח אלוקי אין סופי. כשהוא לא מתגלה בגלות, ועל ידי זה הגלות ממשיכה, והאנושות עושה את הבירור הזה בין טוב ורע בכוח עצמם. כי ברגע שהשכינה מתגלה, חופש הבחירה נעלם.'
  to: ומה מוסיף התיקון הזה? "דוגמת גלות השכינה לברר ניצוצים שנפלו כנודע". השכינה לא ירדה לגלות בטעות, חס ושלום; היא ירדה כדי שהעולמות התחתונים, שאליהם נפלה, יתבררו. השכינה היא כוח אלוקי אין סופי, וכשהיא מתגלה, חופש הבחירה נעלם; לכן בגלות היא נסתרת, והאנושות עושה את הבירור בין טוב לרע בכוח עצמה.
- from: אז בזמן של התיקונים, עד שהאנושות והאדם הפרטי, עדיין עוסקים בתיקונים — זה עניין של בדיוק ככה הנשמה שיורדת לגוף. הנשמה לא צריכה תיקון. הנשמה, על ידי זה שהיא מתחברת בתיקון של הגוף, היא מבררת את הניצוצות — ואז נראה עוד מעט איך זה — וזה מתקן את כל העולם כולו. כמו שהשכינה יורדת לתקן, לברר ניצוצים שנפלו, והנשמה בדיוק באותה צורה יורדת לתקן את הגוף — לתקן, סליחה, ניצוצות שנפלו בשבירת הכלים.
  to: 'וכך בדיוק הנשמה היורדת לגוף, כל זמן שהאנושות והאדם הפרטי עוסקים בתיקונים: כשם שהשכינה יורדת לברר ניצוצים שנפלו, כך יורדת הנשמה, שאינה צריכה תיקון, ובהתחברותה לגוף ולתיקונו היא מבררת את הניצוצות שנפלו בשבירת הכלים — ולהלן נראה כיצד — ומתקנת את העולם כולו.'
- from: וכשכל הניצוצות האלה יתבררו, זו הגאולה האמיתית והשלמה. מה זה עניין של בירור הניצוצות? זה הבירור של כל האנושות, שגם ההתקדמות המדעית והטכנולוגית והחברתית, וגם הרוחנית והמוסרית, על ידי כל העליות והירידות, מגיעים לבירור, שהבירור הוא גם שכלי, הוא גם רוחני, והוא גם גשמי בהתנהלות של העולם. והסיום, כשהאנושות הגיעה לשיא שהיא אמורה לתקן מלכתחילה, אז מתגלה השכינה. ככה כשאדם מגיע למידות הטובות, שורה עליו שכינה, רוח הקודש, והנשמה מתגלה בתוך הלבושים.
  to: 'וכשיתבררו כל הניצוצות, זו הגאולה האמיתית והשלמה. בירור הניצוצות הוא בירורה של האנושות כולה: ההתקדמות המדעית, הטכנולוגית והחברתית, הרוחנית והמוסרית, דרך כל העליות והירידות; והבירור הוא שכלי, רוחני וגם גשמי, בהתנהלות העולם. וכשהאנושות תגיע לשיא שהיא נועדה לו מלכתחילה, תתגלה השכינה. וכך גם באדם: כשהוא מגיע למידות הטובות, שורה עליו שכינה, רוח הקודש, והנשמה מתגלה בתוך הלבושים.'
teaching:
- from: 'עץ חיים, שער כ"ו, פרק א'', מרחיב את מה שהזכרנו בהערה א'': שהגוף האמיתי הוא מקליפת נוגה, הנקראת כתנות עור, והוא כלול מטוב ורע. שם התבאר העניין באופן כללי, בכללות העולמות. ומהי קליפת נוגה? מסביב לקדושה יש קליפות. הקליפה מסתירה את הפרי עד שהוא מוכן, ואז מסירים אותה — אלא שהמשל אינו דומה לגמרי לנמשל: לקליפות יש חיות מצד עצמן, וצריך לברר אותן, ואין כאן מקום להאריך. יש שלוש קליפות טמאות, ויש קליפת נוגה, הממוצעת: היא כלולה מטוב ורע, ומתחברת גם לצד הקדושה, שכולו טוב, וגם לצד הטומאה, שכולו רע. (אפשר להסביר את הטוב והרע כאן כרצון להשפיע ורצון לקבל, כשיטת בעל הסולם, אבל נלמד את הדברים כפשוטם.)'
  to: 'עץ חיים כאן מרחיב את הנאמר בהערה א'' על הגוף האמיתי שמקליפת נוגה. קליפה מסתירה את הפרי עד שיבשיל, אבל לקליפות יש חיות משלהן, וצריך לבררן. שלוש הקליפות הטמאות כולן רע; קליפת נוגה ממוצעת: כלולה מטוב ורע, ומתחברת גם לקדושה וגם לטומאה.'
- from: אבל כאן, בקטע השני שאדמו"ר הזקן מביא מעץ חיים, מבואר שהלבוש שהתורה והמצוות מתקנות הוא הצלם שבאדם עצמו.
  to: ''
- from: 'הוא אומר: כלל — הצורה היא העיקר. יש צורה ויש חומר: כל גוף האדם הוא חומר, ויש מה שמחזיק אותו, כמאמר חז"ל: החי נושא את עצמו. צלם האדם הוא שנקרא, בקטע הקודם של עץ חיים, גוף האדם האמיתי. הצורה — וגם בלשון יצר — היא יצירתו של האדם, ציורו: נפשו האמיתית. כל המדרגות שבין הדנ"א והאינסטינקטים, דרך המבנים הנפשיים והתסביכים, ועד שהם מתאחדים באישיות — כל זה נקרא שם צלם.'
  to: 'שם נאמרו הדברים בכללות העולמות; כאן מבואר שהלבוש שהתורה והמצוות מתקנות הוא הצלם שבאדם עצמו. "כלל העולה כי הצורה הוא העיקר": הגוף הוא חומר, והצורה — מלשון יצירה וציור — היא נפשו של האדם, המחזיקה אותו (כמאמר חז"ל: החי נושא את עצמו). והצלם, "לבוש הצורה", הוא שנקרא בהערה א'' "הגוף האמיתי": כל המדרגות שבין הדנ"א והאינסטינקטים, דרך המבנים הנפשיים והתסביכים, ועד האישיות.'
- from: 'צלם, כאמור, הוא מבנה — מבנה שגם הפסיכולוגיה מתארת, ויש בו אור וחושך: יצר טוב ויצר רע, שני הצלמים. "והם המלאכים שבאדם עצמו, ואינו האדם עצמו".'
  to: '"והצלם הזה הוא יצה"ט ויצה"ר": מבנה שגם הפסיכולוגיה מתארת, ובו אור וחושך; והם "המלאכים שבאדם עצמו".'
- from: 'לכאן נכנסת גם הפסיכולוגיה של קרל גוסטב יונג: כוחות רוחניים מתגלים בדמיונות ובמחשבות של האדם. מקומם בצלם, והוא המקשר בין העולם הרוחני לעולם הגשמי. האדם פונה אל העולם הגשמי, אבל מחשבותיו באות מדיבור המלאכים, ומחשבות המלאכים מדיבור המלאכים שמעליהם, עד בת הקול היוצאת מהר חורב, שהיא הדיבור לכל; ובהשתלשלות, מדרגה אחר מדרגה, נבראים ממוצעים רבים, עד עולם המחשבה של האדם. הסולם מוצב ארצה וראשו מגיע השמימה, ומלאכים עולים ויורדים בו — וזה אנחנו עצמנו.'
  to: 'כאן נוגעת גם הפסיכולוגיה של קרל גוסטב יונג: כוחות רוחניים מתגלים בדמיון ובמחשבה, ומקומם בצלם, המקשר בין הרוחני לגשמי. מחשבות האדם באות מדיבור המלאכים, ומחשבותיהם מדיבור המלאכים שמעליהם, עד בת הקול היוצאת מהר חורב, הדיבור לכל; ובהשתלשלות נבראים ממוצעים רבים עד עולם המחשבה של האדם. האדם הוא הסולם המוצב ארצה וראשו מגיע השמימה, ומלאכים עולים ויורדים בו.'
- from: 'הצלם, אם כן, אינו אתה עצמך. ועל מקומו הוא אומר: "זה הבל דגרמי המתלבש תוך כלי שהוא הגוף". המילים האלה מדברות על המדרגות הרוחניות שתיארנו, אבל הן גם אומרות שהנפש מתחברת לגוף דרך ההבל שבעצמות. ואכן, מחקרים רבים מראים כיצד התאים והמצבים הביולוגיים משפיעים על התודעה, והתודעה על הגוף. וכל אלה נרשמים באוויר גן עדן וכו'', הנמצא סביבנו בכל העולם, ובאדם הקולקטיבי, כפי שביארנו בהערה א''.'
  to: הצלם אינו האדם עצמו; הוא "הבל דגרמי המתלבש תוך הכלי שהוא הגוף". הדברים רוחניים, אבל הם מלמדים גם שהנפש מתחברת לגוף דרך ההבל שבעצמות; ומחקרים רבים מראים כיצד מצבי הגוף משפיעים על התודעה, והתודעה על הגוף (הערה א'). וכל אלה נרשמים באוויר גן עדן וכו', סביבנו, ובאדם הקולקטיבי.
- from: '"לכן נקרא צלם, כי הוא דבר ממוצע בין הצורה והחומר". הצלם, על כל דרגותיו, אינו רק האישיות: הוא כל המבנה, כל הרבדים, מהגוף ועד הנפש.'
  to: '"דבר ממוצע בין הצורה והחומר": הצלם אינו האישיות בלבד, אלא כל המבנה, מהגוף ועד הנפש.'
