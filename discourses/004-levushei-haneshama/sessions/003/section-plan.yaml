  to: 'הצורה, הנר"ן, "א"צ תיקון כלל", ולא התלבשה בצלם ובחומר אלא "להמשיך בהם אור לתקנם"; המצוות באות "לצרף ולברר הצלם והחומר". וגם בצלם, התיקון אינו משנה את המבנה הנפשי אלא ממשיך בו אור: הנשמה, שיש בה אור אין סוף, מאירה בלבושים על ידי תורה ומצוות ומתקנת אותם.'
