style:
- from: 'שתיים: עץ חיים, שער כ"ו, פרק א''. כאן מבאר יותר מה שהזכרנו קודם, שהגוף האמיתי הוא הבחינה, קליפת נוגה, שנקראת כתנות עור, שכלול מטוב ורע. זה היה באופן כללי, מסביר לך בכללות העולמות מה זה עניין. לא ביארנו שקליפת נוגה — כמובן שמסביב למימד של הקדושה יש מימד הקליפות. הקליפה מסתירה את הפרי עד שהפרי מוכן, ואז מסירים את הקליפה. המשל לא בדיוק דומה לנמשל: הקליפות יש חיות מצד עצמם, וצריכים לברר אותן, ואין כאן מקום להאריך בזה. אבל על כל פנים, יש שלוש קליפות הטמאות, יש קליפת נוגה, שהיא בין הטוב והרע, והממוצע בין הטוב — היא כלול בטוב ורע, והיא ממוצע, והיא מתחברת גם לצד הקדושה, שהוא כולו טוב, וגם לצד הטומאה, ששם הוא כולו רע. יש להסביר בין טוב ורע פה זה רצון להשפיע, רצון לקבל, כמו בשיטות של בעל הסולם, אבל קח את העניינים כפי שהם.'
  to: 'עץ חיים, שער כ"ו, פרק א'', מבאר ביתר הרחבה את מה שהזכרנו קודם: שהגוף האמיתי הוא בחינת קליפת נוגה, הנקראת כתנות עור, והוא כלול מטוב ורע. שם התבאר העניין באופן כללי, בכללות העולמות. לא ביארנו את עניין קליפת נוגה: כמובן, מסביב למימד הקדושה יש מימד הקליפות. הקליפה מסתירה את הפרי עד שהוא מוכן, ואז מסירים אותה. המשל אינו דומה לגמרי לנמשל: לקליפות יש חיות מצד עצמן, וצריך לברר אותן, ואין כאן מקום להאריך בזה. יש שלוש הקליפות הטמאות, ויש קליפת נוגה, שהיא ממוצע בין הטוב והרע: היא כלולה מטוב ורע, ומתחברת גם לצד הקדושה, שכולו טוב, וגם לצד הטומאה, שכולו רע. את הטוב והרע כאן יש להסביר כרצון להשפיע ורצון לקבל, כמו בשיטות של בעל הסולם, אבל יש לקחת את העניינים כפי שהם.'
- from: על כל פנים, מה שהוא דיבר בקליפת נוגה, זה נשמע בעולמות. פה, בחלק השני שהוא מביא מהעץ, שהאלטער רבי, שאדמו"ר הזקן מביא מהעץ חיים, הוא שהלבוש הזה שאנחנו מדברים עליו, שהוא מה שהתורה ומצוות מתקנים, הוא בעצמו הצלם, שהצלם הזה הוא מה שנקרא יצר הטוב ויצר הרע.
  to: מה שדיבר שם על קליפת נוגה נשמע כעניין שבעולמות. כאן, בחלק השני שהאלטער רבי, אדמו"ר הזקן, מביא מעץ חיים, מבואר שהלבוש שאנו עוסקים בו, שאותו מתקנות התורה והמצוות, הוא עצמו הצלם, והצלם הזה נקרא יצר הטוב ויצר הרע.
- from: 'אז הוא אומר: כלל, הצורה הוא עיקר. קודם כל יש לנו צורה והחומר, נכון? שכל הגוף האדם זה חומר, ויש משהו שמחזיק אותו, כמו שכתוב, החי נושא את עצמו. הצורה עצמה של האדם — זה מה שהחלק הקודם של העץ חיים מביא — היא נקראת גוף האדם האמיתי. ומה זה הצורה הזאתי? צורה זה, גם בלשון יצר, זה היצירה של האדם, זה העניין של הציור של האדם, שזה הנפש של האדם באמת, מה שנקרא כל הדרגות שבין הדנ"א של האדם והאינסטינקטים שלו, והמבנים הנפשיים שנקראים הסייקי, והמבנים של הסייקי שנקראים קומפלקסים, ועד שהקומפלקסים האלה מתאחדים באישיות של האדם — כל הדרגה הזאת, זה שם נקרא צלם.'
  to: 'הוא אומר: כלל, הצורה הוא עיקר. יש צורה ויש חומר: כל גוף האדם הוא חומר, ויש משהו שמחזיק אותו, כמו שכתוב: החי נושא את עצמו. צורת האדם עצמה — כפי שמביא החלק הקודם של עץ חיים — נקראת גוף האדם האמיתי. הצורה הזאת היא, גם בלשון יצר, יצירתו של האדם, ציורו של האדם, שהיא נפשו: כל הדרגות שבין הדנ"א של האדם והאינסטינקטים שלו, המבנים הנפשיים הנקראים הסייקי, מבני הסייקי הנקראים קומפלקסים, ועד שהקומפלקסים האלה מתאחדים באישיות האדם — כל הדרגה הזאת נקראת שם צלם.'
- from: מה זה צלם? אמרנו שגם צלם זה עניין של מבנה. והצלם הזה, יש פה מבנה שגם עולם הפסיכולוגיה מסביר, ובמבנה הזה יש את האור ואת החושך — ממש יצר טוב ויצר רע, שזה שהם שני צלמים. "והם המלאכים שבאדם עצמו, ואינו האדם עצמו".
  to: גם הצלם, כאמור, הוא עניין של מבנה. בצלם הזה יש מבנה שגם עולם הפסיכולוגיה מסביר, ובמבנה הזה יש את האור ואת החושך — ממש יצר טוב ויצר רע, שהם שני צלמים. "והם המלאכים שבאדם עצמו, ואינו האדם עצמו".
- from: 'שזה כל העולם שגם, גם הפסיכולוגיה של יונג, קרל גוסטב יונג, נכנס לזה: שיש כוחות רוחניים שהם מתגלים בתוך הדמיונות ובתוך המחשבות של האדם. ואיפה? זה בתוך הצלם של האדם, וזה מה שמתקשר גם בין העולם הרוחני והעולם הגשמי. שהאדם מתייחס בעולם הגשמי, אבל אם יש לו מחשבות, המחשבות עצמו באות מהדיבור של המלאכים. קטע הוא שהמחשבות של האדם מהדיבור של המלאכים, מחשבות של מלאכים מהדיבור של המלאכים שמעליהם, עד שעולה מהר חורב, בת קול שיוצאת מהר חורב, שזה הדיבור להכל, אבל על דרך השתלשלות, מדרגה אחרי מדרגה, נבראים הרבה ממוצעים, וכל הממוצעים האלה נמצאים עד עולם המחשבה של האדם. אז תחשבו שאנחנו עצמנו — הסולם מוצב ארצה וראשו מגיע השמימה, מלאכים עולים ויורדים — וזה אנחנו.'
  to: 'זהו כל העולם שגם הפסיכולוגיה של קרל גוסטב יונג נכנסת אליו: יש כוחות רוחניים המתגלים בתוך הדמיונות והמחשבות של האדם. מקומם בתוך צלמו של האדם, והוא המקשר בין העולם הרוחני לעולם הגשמי. האדם מתייחס לעולם הגשמי, אבל מחשבותיו עצמן באות מדיבור המלאכים, ומחשבות המלאכים מדיבור המלאכים שמעליהם, עד בת הקול היוצאת מהר חורב, שהיא הדיבור להכל; אלא שעל דרך השתלשלות, מדרגה אחר מדרגה, נבראים ממוצעים רבים, וכל הממוצעים האלה מגיעים עד עולם המחשבה של האדם. הסולם מוצב ארצה וראשו מגיע השמימה, מלאכים עולים ויורדים — וזה אנחנו עצמנו.'
- from: 'פה מסביר לנו יפה איך שזה: "ואינו האדם עצמו" — זה לא אתה, זה לא האדם עצמו. איפה נמצא פה? הוא אומר: "זה הבל דגרמי המתלבש תוך כלי שהוא הגוף". קודם כל הוא מביא — המילים האלה באמת זה עניינים רוחניים שמדברים על המדרגות שדיברתי קודם — אבל באמת החיבור שבין הנפש והגוף, הוא באמת אומר: דרך ההבל שבעצמות. ובאמת בתוך כל התאים — ויש הרבה מחקרים שמראים איך שהתאים והמצבים הביולוגיים באדם משפיעים על התודעה של האדם, והתודעה של האדם משפיעה על הגוף — וכל אלה נרשמים במה שמסביבנו, בכל העולם, באדם הקולקטיבי, כמו שהסברנו קודם.'
  to: 'כאן הוא מבאר יפה: "ואינו האדם עצמו" — זה לא אתה. ועל מקומו הוא אומר: "זה הבל דגרמי המתלבש תוך כלי שהוא הגוף". המילים האלה הן עניינים רוחניים, המדברים על המדרגות שדיברתי עליהן קודם, אבל על החיבור שבין הנפש והגוף הוא אכן אומר: דרך ההבל שבעצמות. ואכן, בתוך כל התאים — ויש מחקרים רבים המראים כיצד התאים והמצבים הביולוגיים באדם משפיעים על תודעתו, ותודעתו משפיעה על הגוף — וכל אלה נרשמים במה שמסביבנו, בכל העולם, באדם הקולקטיבי, כפי שביארנו לעיל.'
- from: '"לכן נקרא צלם, כי הוא דבר ממוצע בין הצורה והחומר". והצלם הזה, עם כל הדרגות שבו, זה לא רק האישיות, זה כל כך הרבה, זה כל המבנה — איך אומרים סטאק? זה כל הסטאק, ובעברית: הערימה, מהגוף ועד הנפש.'
  to: '"לכן נקרא צלם, כי הוא דבר ממוצע בין הצורה והחומר". והצלם הזה, על כל הדרגות שבו, אינו רק האישיות; הוא הרבה יותר — כל המבנה, כל הסטאק, ובעברית: הערימה, מהגוף ועד הנפש.'
- from: 'זאת אומרת "שהצורה אינה צריכה תיקון כלל, ולא הוצרכה להתלבש בצלם וחומר, רק להמשיך בהם אור לתקנם". עכשיו, פה הוא מביא: "כי זה טעם ירידת הנשמה בעולם הזה, לתקן, לברר דוגמת גלות השכינה, לברר ניצוצין שנפלו, כנודע". אז פה הוא אומר דווקא, כי כל המצוות — הם לא באו לתקן את הצורה, כלומר, הצורה שהיא הנשמה. פה כשאומר הצורה באמת זה הנפש, רוח, נשמה. אבל זה גם המבנה של הצלם, שהמבנה, בוא נקרא לזה אפילו הפסיכולוגי, הקוגניטיבי, ועד התודעתי שלנו, הוא באמת לא צריך את התיקון. התיקון הוא בשביל להמשיך בהם עוד אור, שעל ידי הלבושים האלה אנחנו ממשיכים אור. זאת אומרת שהנשמה היא אלוקית, ויש בה אור אין סוף, וכשהיא מאירה בתוך הלבושים האלה שאמרנו, על ידי תורה ומצוות, היא מתקנת אותם. אבל זה מה שאמרנו בפעם שעברה.'
  to: '"שהצורה אינה צריכה תיקון כלל, ולא הוצרכה להתלבש בצלם וחומר, רק להמשיך בהם אור לתקנם". והוא מביא: "כי זה טעם ירידת הנשמה בעולם הזה, לתקן, לברר דוגמת גלות השכינה, לברר ניצוצין שנפלו, כנודע". כאן הוא אומר דווקא שכל המצוות לא באו לתקן את הצורה, שהיא הנשמה; והצורה שהוא אומר כאן היא הנפש, רוח, נשמה. אבל זהו גם מבנה הצלם, והמבנה הזה — נקרא לו אפילו הפסיכולוגי, הקוגניטיבי, ועד התודעתי שלנו — אינו צריך את התיקון. התיקון נועד להמשיך בהם עוד אור: על ידי הלבושים האלה אנו ממשיכים אור. הנשמה אלוקית, ויש בה אור אין סוף, וכשהיא מאירה בתוך הלבושים האלה על ידי תורה ומצוות, היא מתקנת אותם. וזה כבר נתבאר בפעם הקודמת.'
- from: 'ועכשיו, מה נתווסף על ידי התיקון הזה? פה אומר: "דוגמת גלות השכינה לברר ניצוצים שנפלו כנודע". השכינה לא ירדה לגלות בטעות, חס ושלום. הגלות השכינה היה כדי שהעולמות התחתונים, ששם היא נפלה, יתבררו, כי השכינה היא כוח אלוקי אין סופי. כשהוא לא מתגלה בגלות, ועל ידי זה הגלות ממשיכה, והאנושות עושה את הבירור הזה בין טוב ורע בכוח עצמם. כי ברגע שהשכינה מתגלה, חופש הבחירה נעלם.'
  to: 'ועל מה שנתווסף על ידי התיקון הזה אומר כאן: "דוגמת גלות השכינה לברר ניצוצים שנפלו כנודע". השכינה לא ירדה לגלות בטעות, חס ושלום. גלות השכינה הייתה כדי שהעולמות התחתונים, שאליהם נפלה, יתבררו, כי השכינה היא כוח אלוקי אין סופי. בגלות הוא אינו מתגלה, ועל ידי זה הגלות נמשכת, והאנושות עושה את הבירור הזה בין טוב ורע בכוח עצמה. כי ברגע שהשכינה מתגלה, חופש הבחירה נעלם.'
- from: אז בזמן של התיקונים, עד שהאנושות והאדם הפרטי, עדיין עוסקים בתיקונים — זה עניין של בדיוק ככה הנשמה שיורדת לגוף. הנשמה לא צריכה תיקון. הנשמה, על ידי זה שהיא מתחברת בתיקון של הגוף, היא מבררת את הניצוצות — ואז נראה עוד מעט איך זה — וזה מתקן את כל העולם כולו. כמו שהשכינה יורדת לתקן, לברר ניצוצים שנפלו, והנשמה בדיוק באותה צורה יורדת לתקן את הגוף — לתקן, סליחה, ניצוצות שנפלו בשבירת הכלים.
  to: בזמן התיקונים, כל עוד האנושות והאדם הפרטי עדיין עוסקים בתיקונים — כך בדיוק עניינה של הנשמה היורדת לגוף. הנשמה אינה צריכה תיקון. על ידי התחברותה בתיקון הגוף היא מבררת את הניצוצות — ולהלן נראה כיצד — וזה מתקן את העולם כולו. כשם שהשכינה יורדת לתקן, לברר ניצוצים שנפלו, כך בדיוק יורדת הנשמה לתקן ניצוצות שנפלו בשבירת הכלים.
- from: וכשכל הניצוצות האלה יתבררו, זו הגאולה האמיתית והשלמה. מה זה עניין של בירור הניצוצות? זה הבירור של כל האנושות, שגם ההתקדמות המדעית והטכנולוגית והחברתית, וגם הרוחנית והמוסרית, על ידי כל העליות והירידות, מגיעים לבירור, שהבירור הוא גם שכלי, הוא גם רוחני, והוא גם גשמי בהתנהלות של העולם. והסיום, כשהאנושות הגיעה לשיא שהיא אמורה לתקן מלכתחילה, אז מתגלה השכינה. ככה כשאדם מגיע למידות הטובות, שורה עליו שכינה, רוח הקודש, והנשמה מתגלה בתוך הלבושים.
  to: 'וכשיתבררו כל הניצוצות האלה, זו הגאולה האמיתית והשלמה. בירור הניצוצות הוא בירורה של האנושות כולה: ההתקדמות המדעית, הטכנולוגית והחברתית, וגם הרוחנית והמוסרית, מגיעה על ידי כל העליות והירידות לבירור, והבירור הוא גם שכלי, גם רוחני, וגם גשמי בהתנהלות העולם. ובסיום, כשהאנושות מגיעה לשיא שהיא אמורה לתקן מלכתחילה, מתגלה השכינה. וכך, כשאדם מגיע למידות הטובות, שורה עליו שכינה, רוח הקודש, והנשמה מתגלה בתוך הלבושים.'
