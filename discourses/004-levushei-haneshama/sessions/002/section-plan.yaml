  to: '"לא נתן הקב"ה תורה ומצות לישראל אלא לברר ולצרף": זו תכלית ההיסטוריה: לממש את האידיאלים העליונים — צדקה, צדק ומשפט — במחשבה, בדיבור ובמעשה כראוי. התורה, החוכמה האלוקית, מלמדת אותם ומזככת; ועמה המצוות המעשיות, שבין אדם למקום (תפילין, שבת, מזוזה) ושבין אדם לחברו. והצלם, שבו נרשם כל מעשה, הוא הלבוש הרוחני המלביש את הנשמה ומחברה לגוף, ועולה עמה לגן עדן.'
