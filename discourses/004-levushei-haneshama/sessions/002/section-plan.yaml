style:
- from: 'אחד: עץ חיים, שער מ"ט, פרק ה''. העץ חיים מביא פה שהגוף האמיתי — שמדבר פה לא על הגוף החומרי, אלא זה גוף רוחני — שהוא מקליפת נוגה, למרות שהגוף הרוחני הזה הוא בעצמו מאוחד לגמרי גם עם הגוף הגשמי שלנו. והגוף הזה מקליפת נוגה הוא העולם הפסיכולוגיה, שמדבר על הפרסונה, ומדבר על כל סדר השתלשלות באמת, מהאישיות ועד לתאים הביולוגיים והגנים, וכל הסטאק של הערימה של המדרגות, מהביולוגיה ועד לסוציולוגיה, לקוגניטיבי — הכל הם מה שנקרא הגוף האמיתי של האדם. והם, נראה, גם ממש מתאחדים, מתלבשים עם הגוף, כמו שאמרנו, ברמה הביולוגית, ומשפיעים בשתי דרכים, אגב: הסייקי משפיע על הגוף, הגוף משפיע על הסייקי.'
  to: 'הגוף האמיתי שעץ חיים מדבר עליו כאן, שהוא מקליפת נוגה, אינו הגוף החומרי אלא גוף רוחני, אף שהוא מאוחד לגמרי עם גופנו הגשמי. זהו עולמה של הפסיכולוגיה: כל רובדי האדם, מהגנים והתאים, דרך האישיות, ועד החברה והמחשבה — כל אלה הם הגוף האמיתי של האדם. הם מתלבשים בגוף הגשמי ומשפיעים בשני הכיוונים: הנפש על הגוף, והגוף על הנפש.'
- from: 'והסייקי הזה, במילים שלנו, הוא מקליפת נוגה, והוא לבוש של הנפש רוח הנשמה. זאת אומרת שהנפש רוח הנשמה שלנו מתלבשים בלבוש. אחרי זה נראה שגם הלבוש הזה נקרא צלם, שיש שני צלמים: יש צלם שנקרא נפש אלוקית, ויש צלם שנקרא נפש הבהמית. הצלם הזה, הלבוש הזה, נקרא כתנות עור. מה שכתוב, וילבשם כתנות עור, זה כמובן גם רומז על כתנות העור, שהעור הוא מחזיק את הגוף שלנו, ובאמת הלבוש לגוף הגשמי שלנו. וכן יש כתנות אור, יש כמובן, נראה שזה החלוקא דרבנן, והחלוקא דרבנן זה כבר העניין של הלבושים שאנחנו אומרים. אז פה הלבושים באמת הם מה? הם הצלם, שהנפש הבהמית ונפש אלוקית. ומה אמרנו קודם? מה שמובא בחסידות נפש — נפש אלוקית, נפש בהמית — זה לא הנפש שהאריז"ל מדבר, שהיא כלולה במה שהעץ חיים אומר פה, הנר"ן, הנפש רוח נשמה. הכתנות עור, שהם הלבושים לנפש רוח נשמה, זה מה שאנחנו קוראים הנפש הבהמית, הנפש אלוקית, שאנחנו קוראים לזה גם התודעה והאישיות שלנו בכל המדרגות האלה. אז באמת המחשבות שלנו, באמת האישיות שלנו — וזה מילים מאוד מוגבלות, המילים היותר נכונות זה באמת הגוף האמיתי, שהוא הכתנות עור, הם הלבושים. והלבושים האלה נותנים לנשמה ליהנות מזיו השכינה בעולם הבא.'
  to: 'מה שאנו קוראים הנפש הפסיכולוגית הוא מקליפת נוגה, והוא הלבוש שבו מתלבשים הנפש, הרוח והנשמה שלנו. להלן נראה שלבוש זה נקרא גם צלם, ושיש שני צלמים: נפש אלוקית ונפש בהמית. הלבוש הזה נקרא כתנות עור, כלשון הכתוב, והוא רומז גם לעור הגשמי, המחזיק את גופנו ומלביש אותו. ויש גם כתנות אור — כפי שנראה, הן החלוקא דרבנן, וזהו כבר עניין הלבושים שאנו עוסקים בו. נמצא שהנפש האלוקית והנפש הבהמית שבחסידות אינן הנפש שהאריז"ל מדבר עליה, הנר"ן, אלא לבושיה: הכתנות עור, שהן התודעה והאישיות שלנו על כל מדרגותיהן. "המחשבות שלנו", "האישיות שלנו" — אלה מילים מוגבלות; המילים המדויקות הן "הגוף האמיתי", הכתנות עור, הלבושים.'
- from: 'עכשיו, הכתנות עור, הלבושים האלה כלולים מטוב ורע, לכן "אחר שנתערב על ידי חטא אדם הראשון". אחרי זה נראה כל האריכות של הקטעים הבאים בעץ חיים ובמאמר פה: הוא באמת האם הבירור — האם יש פה לבושים שצריכים לברר, או שזה לבושים שאנחנו בעצם מייצרים אותם, או שהלבושים עצמם צריכים תיקון, או שעל ידי הבירור של הלבושים אנחנו ממשיכים מדרגות למעלה. וכל הרעיון של העלאת מ"ן, של התעוררות מלמטה, יהיה בהמשך המאמרים.'
  to: 'הלבושים האלה כלולים מטוב ורע, "אחר שנתערב על ידי חטא אדם הראשון". בקטעים הבאים בעץ חיים ובמאמר נראה באריכות מהו הבירור: האם הלבושים קיימים וצריך לבררם, או שאנו יוצרים אותם; האם הם עצמם צריכים תיקון, או שבבירורם אנו ממשיכים מדרגות שלמעלה. ורעיון העלאת מ"ן, ההתעוררות מלמטה, יבואר בהמשך המאמרים.'
- from: 'על כל פנים, הלבושים האלה, באמת, מה שאמרנו, הם נתערב בהם טוב ורע. זה העניין של כתנות עור בעי"ן, שהרי בתורתו של רבי מאיר מצאו כתוב "כתנות אור" באל"ף (בראשית רבה כ, יב): שהלבושים האלה פעם היו מאירים, ועכשיו העור הוא עיוור, שהעור מסתיר, שזה המימד של החוש של העולם הגשמי החומרי, שהוא מסתיר את המימד של האור עם האל"ף, או המימד הרוחני.'
  to: 'וזהו עניין "כתנות עור" בעי"ן: בתורתו של רבי מאיר מצאו כתוב "כתנות אור" באל"ף (בראשית רבה כ, יב). הלבושים האלה היו פעם מאירים, ועתה העור "עיוור": העולם הגשמי, הנתפס בחושים, מסתיר מאיתנו את ה"אור", את המימד הרוחני.'
- from: על כל פנים, "הלבוש הזה כלול בטוב ורע, אחרי שנתערב על ידי חטא האדם הראשון, וצריך לבררו, והוא נעשה על ידי התורה והמצוות". שהתורה והמצוות שאנחנו עושים מבררים באמת את עצמנו. זה מה שנקרא שתיקון המידות כנגד כולם. תיקון המידות, אבל זה לא רק תיקון המידות באופן כללי. כל המעשים שלנו בעולם הזה משאירים רושם על ידי שני הצלמים האלה. בלשון עץ חיים, מה שנקרא כתנות עור, שזה הלבוש שהוא הגוף האמיתי שלנו, שבאמת זה שני הצלמים, באמת הדרגה של התודעה, גם בנפש האלוקית, נפש הבהמית; וכל הפעולות שהן מחטא האדם הראשון ועד ביאת המשיח, זה היה לתיקון של הלבושים האלה.
  to: '"הלבוש הזה כלול בטוב ורע, אחרי שנתערב על ידי חטא האדם הראשון, וצריך לבררו, והוא נעשה על ידי התורה והמצוות". בתורה ובמצוות שאנו עושים אנו מבררים את עצמנו. וזהו שאומרים שתיקון המידות שקול כנגד כולם — ולא תיקון המידות הכללי בלבד: כל מעשה שלנו בעולם הזה משאיר רושם בשני הצלמים. וכל הפעולות, מחטא האדם הראשון ועד ביאת המשיח, הן לתיקון הלבושים האלה.'
- from: 'אנחנו פה רואים הקבלה בין הלבושים הפרטיים של הנפש ורוח הנשמה בגוף של האדם הפרטי, ובין העולם הכללי — כן, העולם הוא אדם גדול והאדם הוא עולם קטן. אז גם בעולם כולו יש את הלבושים, שאני ממשיל את זה לתודעה הקולקטיבית: כמו שיש את התודעה הפרטית של כל אחד, ככה יש גם את התודעה הקולקטיבית, והיא הסך הכל, שהיא הגוף של כל האנושות בכל זמן. ועם ישראל, על ידי תורה ומצוות, באו להאיר את העולם, לברר את עצמם ואת כל העולם כולו. וזה הבירור שבעולם משפיע גם על בני האדם שבעולם, וגם הבירור של כל בן אדם פרטי משפיע על העולם הכללי.'
  to: 'יש כאן הקבלה בין האדם הפרטי לעולם כולו: העולם הוא אדם גדול, והאדם הוא עולם קטן. גם לעולם יש לבושים, ואני ממשיל אותם לתודעה הקולקטיבית: כשם שלכל אחד תודעה פרטית, כך יש תודעה קולקטיבית, האנושות כולה בכל זמן, כגוף אחד. עם ישראל בא, בתורה ובמצוות, להאיר את העולם ולברר את עצמו ואת העולם כולו. בירור העולם משפיע על כל אדם, ובירורו של כל אדם משפיע על העולם.'
- from: ושם ממשיך בעץ חיים את הבירור של הטוב והרע, והוא אומר שתורה ומצוות הקדוש ברוך הוא נתן לישראל "כדי לברר, לצרף ולהסיר הסיגים, שהם לבוש הנשמה". אז כל הסיפור שיש עולם, עם כל הסיפור של ההיסטוריה של האנושית, היא כדי להביא מחשבות נכונות, להביא את האידיאלים העליונים למימוש פה, בצדקה לעניים, בצדק ובמשפט, ומחשבה, דיבור ומעשה כדבעי. שהמעשים האלה, התורה מלמדת אותנו וגם מזככת אותנו, שהיא חוכמה אלוקית, על ידי שהאנושות עוסקת בחוכמה. ועל זה לא מספיק רק חוכמה, יש גם את המצוות, על ידי המעשים. המצוות זה בין אדם למקום, כמו תפילין ושבת ומזוזה; יש את מצוות בין אדם לחברו. וכל הבירורים האלה משאירים רושם כל רגע על הבן אדם. אני קורא לזה האישיות, אבל זה יותר מזה, זה באמת הצלם, שהוא באמת הלבוש הרוחני שמלביש את הנשמה ומחבר עם הגוף. וזה באמת הלבוש שעולה איתו אחרי זה גם לגן עדן. קרוב מאוד להגיד שזה האישיות שלנו, מה שנקרא.
  to: 'עץ חיים ממשיך שם בבירור הטוב והרע: הקדוש ברוך הוא נתן לישראל תורה ומצוות "כדי לברר, לצרף ולהסיר הסיגים, שהם לבוש הנשמה". כל ההיסטוריה של האנושות נועדה להביא מחשבות נכונות ולממש כאן את האידיאלים העליונים: צדקה לעניים, צדק ומשפט, מחשבה, דיבור ומעשה כדבעי. התורה, החוכמה האלוקית, מלמדת אותנו את המעשים האלה, והעיסוק בה מזכך אותנו. ולא די בחוכמה: יש גם המצוות המעשיות — שבין אדם למקום, כמו תפילין, שבת ומזוזה, ושבין אדם לחברו. כל הבירורים האלה משאירים בנו רושם בכל רגע. אני קורא לזה האישיות, אבל זה יותר מזה: זהו הצלם, הלבוש הרוחני המלביש את הנשמה ומחבר אותה עם הגוף, ועולה עמה אחר כך לגן עדן. ובכל זאת, קרוב מאוד לומר שזו "האישיות" שלנו.'
- from: '"על ידי הכוונה בתורה ומצוות, הוא גומר לבוש נשמה", כמו שאמרנו. "נמצא כי אלו הלבושים הנזכר בפרשת ויחי, אין פירוש שנעשה מחדש על ידי תורה ומצוות, אמנם מתבררים". וזה החידוש של העץ חיים שהגענו אליו: שמה שנשמע בזוהר, שתורה ומצוות הם יוצרים את הלבושים — פה העץ חיים מביא שיטה שבאמת הלבושים האלה הם מה שמחברים את הנשמה עם הגוף, אבל הניקיון של הלבושים האלה פועל בירור גם באדם, ולכן על ידי הלבושים האלה הוא יכול ליהנות מזיו השכינה בגן עדן, וגם בעולם שמזכך אותם. וזה הבירור של הרע, וזה עבודת הבירורים. זה חשוב להבין בכלל גם עבודת הבירורים בעולם, ואיך כל רגע פרטי שלנו משפיע על זה.'
  to: '"על ידי הכוונה בתורה ומצוות, הוא גומר לבוש נשמה". "נמצא כי אלו הלבושים הנזכר בפרשת ויחי, אין פירוש שנעשה מחדש על ידי תורה ומצוות, אמנם מתבררים". זהו חידושו של עץ חיים: מן הזוהר נשמע שהתורה והמצוות יוצרות את הלבושים, ועץ חיים מלמד שהלבושים כבר קיימים — הם המחברים את הנשמה עם הגוף — והתורה והמצוות מנקות אותם. ניקוי הלבושים הוא בירור באדם עצמו, ועל ידי הלבושים המבוררים הוא נהנה מזיו השכינה בגן עדן. וזהו בירור הרע, עבודת הבירורים. חשוב להבין את עבודת הבירורים בעולם כולו, ואיך כל רגע פרטי שלנו משפיע עליה.'
teaching:
- from: 'הגוף האמיתי שעץ חיים מדבר עליו כאן, שהוא מקליפת נוגה, אינו הגוף החומרי אלא גוף רוחני, אף שהוא מאוחד לגמרי עם גופנו הגשמי. זהו עולמה של הפסיכולוגיה: כל רובדי האדם, מהגנים והתאים, דרך האישיות, ועד החברה והמחשבה — כל אלה הם הגוף האמיתי של האדם. הם מתלבשים בגוף הגשמי ומשפיעים בשני הכיוונים: הנפש על הגוף, והגוף על הנפש.'
  to: '"הגוף האמיתי שהוא מקלי'' נוגה" אינו הגוף החומרי אלא גוף רוחני, המאוחד עם הגשמי: כל רובדי האדם שהפסיכולוגיה חוקרת, מהגנים והתאים, דרך האישיות, ועד החברה והמחשבה. הוא מלובש בגוף, והם משפיעים זה על זה.'
- from: 'מה שאנו קוראים הנפש הפסיכולוגית הוא מקליפת נוגה, והוא הלבוש שבו מתלבשים הנפש, הרוח והנשמה שלנו. להלן נראה שלבוש זה נקרא גם צלם, ושיש שני צלמים: נפש אלוקית ונפש בהמית. הלבוש הזה נקרא כתנות עור, כלשון הכתוב, והוא רומז גם לעור הגשמי, המחזיק את גופנו ומלביש אותו. ויש גם כתנות אור — כפי שנראה, הן החלוקא דרבנן, וזהו כבר עניין הלבושים שאנו עוסקים בו. נמצא שהנפש האלוקית והנפש הבהמית שבחסידות אינן הנפש שהאריז"ל מדבר עליה, הנר"ן, אלא לבושיה: הכתנות עור, שהן התודעה והאישיות שלנו על כל מדרגותיהן. "המחשבות שלנו", "האישיות שלנו" — אלה מילים מוגבלות; המילים המדויקות הן "הגוף האמיתי", הכתנות עור, הלבושים.'
  to: 'הוא "לבוש אל הנר"ן", ונקרא "כתנות עור", ורמז לו בעור המלביש את הגוף; ויש גם כתנות אור, הן החלוקא דרבנן, והן הלבושים שבהם עוסק המאמר. הלבוש הזה הוא הצלם, ושני צלמים הם: הנפש האלוקית והנפש הבהמית (הערה ב''). נמצא ששתי הנפשות שבחסידות אינן הנר"ן של האריז"ל אלא לבושיו: התודעה והאישיות על כל מדרגותיהן. קרוב מאוד לומר שזו "האישיות" שלנו, אך המונח המדויק הוא "הגוף האמיתי".'
- from: 'הלבושים האלה כלולים מטוב ורע, "אחר שנתערב על ידי חטא אדם הראשון". בקטעים הבאים בעץ חיים ובמאמר נראה באריכות מהו הבירור: האם הלבושים קיימים וצריך לבררם, או שאנו יוצרים אותם; האם הם עצמם צריכים תיקון, או שבבירורם אנו ממשיכים מדרגות שלמעלה. ורעיון העלאת מ"ן, ההתעוררות מלמטה, יבואר בהמשך המאמרים.'
  to: '"כלול מטוב ורע": מחטא אדם הראשון נתערב בלבושים רע, ולכן הם "כתנות עור" בעי"ן; ובתורתו של רבי מאיר נכתב "כתנות אור" באל"ף (בראשית רבה כ, יב). הלבושים היו מאירים, ועתה העור מסתיר את האור. אם הלבושים מתבררים או נוצרים, ומה נמשך בבירורם (העלאת מ"ן), יתבאר להלן.'
- from: 'וזהו עניין "כתנות עור" בעי"ן: בתורתו של רבי מאיר מצאו כתוב "כתנות אור" באל"ף (בראשית רבה כ, יב). הלבושים האלה היו פעם מאירים, ועתה העור "עיוור": העולם הגשמי, הנתפס בחושים, מסתיר מאיתנו את ה"אור", את המימד הרוחני.'
  to: ''
- from: '"הלבוש הזה כלול בטוב ורע, אחרי שנתערב על ידי חטא האדם הראשון, וצריך לבררו, והוא נעשה על ידי התורה והמצוות". בתורה ובמצוות שאנו עושים אנו מבררים את עצמנו. וזהו שאומרים שתיקון המידות שקול כנגד כולם — ולא תיקון המידות הכללי בלבד: כל מעשה שלנו בעולם הזה משאיר רושם בשני הצלמים. וכל הפעולות, מחטא האדם הראשון ועד ביאת המשיח, הן לתיקון הלבושים האלה.'
  to: '"והוא נעשה ע"י התורה והמצוה": בהן האדם מברר את עצמו. לכן תיקון המידות שקול כנגד הכל: כל מעשה משאיר רושם בשני הצלמים, וכל המעשים, מחטא אדם הראשון ועד ביאת המשיח, הם תיקון הלבושים.'
- from: 'יש כאן הקבלה בין האדם הפרטי לעולם כולו: העולם הוא אדם גדול, והאדם הוא עולם קטן. גם לעולם יש לבושים, ואני ממשיל אותם לתודעה הקולקטיבית: כשם שלכל אחד תודעה פרטית, כך יש תודעה קולקטיבית, האנושות כולה בכל זמן, כגוף אחד. עם ישראל בא, בתורה ובמצוות, להאיר את העולם ולברר את עצמו ואת העולם כולו. בירור העולם משפיע על כל אדם, ובירורו של כל אדם משפיע על העולם.'
  to: 'וכך בעולם, שהוא אדם גדול: לבושיו הם התודעה הקולקטיבית, האנושות כולה כגוף אחד. עם ישראל, בתורה ובמצוות, מברר את עצמו, ומאיר ומברר את העולם; ובירור העולם ובירור האדם משפיעים זה על זה.'
