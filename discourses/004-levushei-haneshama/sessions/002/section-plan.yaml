style:
- from: 'אחד: עץ חיים, שער מ"ט, פרק ה''. העץ חיים מביא פה שהגוף האמיתי — שמדבר פה לא על הגוף החומרי, אלא זה גוף רוחני — שהוא מקליפת נוגה, למרות שהגוף הרוחני הזה הוא בעצמו מאוחד לגמרי גם עם הגוף הגשמי שלנו. והגוף הזה מקליפת נוגה הוא העולם הפסיכולוגיה, שמדבר על הפרסונה, ומדבר על כל סדר השתלשלות באמת, מהאישיות ועד לתאים הביולוגיים והגנים, וכל הסטאק של הערימה של המדרגות, מהביולוגיה ועד לסוציולוגיה, לקוגניטיבי — הכל הם מה שנקרא הגוף האמיתי של האדם. והם, נראה, גם ממש מתאחדים, מתלבשים עם הגוף, כמו שאמרנו, ברמה הביולוגית, ומשפיעים בשתי דרכים, אגב: הסייקי משפיע על הגוף, הגוף משפיע על הסייקי.'
  to: 'עץ חיים, שער מ"ט, פרק ה'', מביא שהגוף האמיתי — ואין הכוונה לגוף החומרי אלא לגוף רוחני — הוא מקליפת נוגה, אף שהגוף הרוחני הזה מאוחד לגמרי גם עם גופנו הגשמי. הגוף הזה הוא עולמה של הפסיכולוגיה, העוסקת בפרסונה ובכל סדר ההשתלשלות: מהאישיות ועד לתאים הביולוגיים ולגנים, כל הסטאק, ערימת המדרגות מהביולוגיה ועד לסוציולוגיה ולקוגניטיבי. כל אלה נקראים הגוף האמיתי של האדם. כפי שנראה, הם מתאחדים ומתלבשים עם הגוף, גם ברמה הביולוגית, ומשפיעים בשני הכיוונים: הסייקי על הגוף, והגוף על הסייקי.'
- from: 'והסייקי הזה, במילים שלנו, הוא מקליפת נוגה, והוא לבוש של הנפש רוח הנשמה. זאת אומרת שהנפש רוח הנשמה שלנו מתלבשים בלבוש. אחרי זה נראה שגם הלבוש הזה נקרא צלם, שיש שני צלמים: יש צלם שנקרא נפש אלוקית, ויש צלם שנקרא נפש הבהמית. הצלם הזה, הלבוש הזה, נקרא כתנות עור. מה שכתוב, וילבשם כתנות עור, זה כמובן גם רומז על כתנות העור, שהעור הוא מחזיק את הגוף שלנו, ובאמת הלבוש לגוף הגשמי שלנו. וכן יש כתנות עור, יש כמובן, נראה שזה החלוקא דרבנן, והחלוקא דרבנן זה כבר העניין של הלבושים שאנחנו אומרים. אז פה הלבושים באמת הם מה? הם הצלם, שהנפש הבהמית ונפש אלוקית. ומה אמרנו קודם? מה שמובא בחסידות נפש — נפש אלוקית, נפש בהמית — זה לא הנפש שהאריז"ל מדבר, שהיא כלולה במה שהעץ חיים אומר פה, הנר"ן, הנפש רוח נשמה. הכתנות עור, שהם הלבושים לנפש רוח נשמה, זה מה שאנחנו קוראים הנפש הבהמית, הנפש אלוקית, שאנחנו קוראים לזה גם התודעה והאישיות שלנו בכל המדרגות האלה. אז באמת המחשבות שלנו, באמת האישיות שלנו — וזה מילים מאוד מוגבלות, המילים היותר נכונות זה באמת הגוף האמיתי, שהוא הכתנות עור, הם הלבושים. והלבושים האלה נותנים לנשמה ליהנות מזיו השכינה בעולם הבא.'
  to: 'הסייקי הזה, במילים שלנו, הוא מקליפת נוגה, והוא הלבוש שבו מתלבשים הנפש, הרוח והנשמה שלנו. להלן נראה שלבוש זה נקרא גם צלם, ושיש שני צלמים: האחד נקרא נפש אלוקית, והשני נפש הבהמית. הצלם הזה, הלבוש הזה, נקרא כתנות עור, כמו שכתוב: וילבשם כתנות עור. הכתוב רומז כמובן גם לכתנות העור: העור מחזיק את גופנו, והוא הלבוש לגוף הגשמי שלנו. ויש גם כתנות עור — כפי שנראה, זה החלוקא דרבנן, והוא כבר שייך לעניין הלבושים שאנו עוסקים בו. הלבושים כאן, אם כן, הם הצלם של הנפש הבהמית והנפש האלוקית. ומה שמובא בחסידות בשם "נפש" — נפש אלוקית ונפש בהמית — אינו הנפש שהאריז"ל מדבר עליה, הכלולה במה שעץ חיים קורא כאן נר"ן, נפש רוח נשמה. הכתנות עור, שהן הלבושים לנפש, לרוח ולנשמה, הן מה שאנו קוראים הנפש הבהמית והנפש האלוקית, וגם התודעה והאישיות שלנו על כל מדרגותיהן. "המחשבות שלנו", "האישיות שלנו" — אלה מילים מוגבלות מאוד; המילים הנכונות יותר הן "הגוף האמיתי": הכתנות עור, הלבושים. והלבושים האלה מאפשרים לנשמה ליהנות מזיו השכינה בעולם הבא.'
- from: 'עכשיו, הכתנות עור, הלבושים האלה כלולים מטוב ורע, לכן "אחר שנתערב על ידי חטא אדם הראשון". אחרי זה נראה כל האריכות של הקטעים הבאים בעץ חיים ובמאמר פה: הוא באמת האם הבירור — האם יש פה לבושים שצריכים לברר, או שזה לבושים שאנחנו בעצם מייצרים אותם, או שהלבושים עצמם צריכים תיקון, או שעל ידי הבירור של הלבושים אנחנו ממשיכים מדרגות למעלה. וכל הרעיון של העלאת מ"ן, של התעוררות מלמטה, יהיה בהמשך המאמרים.'
  to: 'הכתנות עור, הלבושים האלה, כלולים מטוב ורע, ולכן — "אחר שנתערב על ידי חטא אדם הראשון". בקטעים הבאים בעץ חיים ובמאמר כאן נראה באריכות מהו הבירור: האם יש כאן לבושים שצריך לברר, או לבושים שאנו מייצרים, או שהלבושים עצמם צריכים תיקון, או שבבירור הלבושים אנו ממשיכים מדרגות שלמעלה. וכל רעיון העלאת מ"ן, ההתעוררות מלמטה, יבואר בהמשך המאמרים.'
- from: 'על כל פנים, הלבושים האלה, באמת, מה שאמרנו, הם נתערב בהם טוב ורע. זה העניין של כתנות עור בעי"ן, שהרי בתורתו של רבי מאיר מצאו כתוב "כתנות אור" באל"ף (בראשית רבה כ, יב): שהלבושים האלה פעם היו מאירים, ועכשיו העור הוא עיוור, שהעור מסתיר, שזה המימד של החוש של העולם הגשמי החומרי, שהוא מסתיר את המימד של האור עם האל"ף, או המימד הרוחני.'
  to: 'בלבושים האלה, כאמור, נתערבו טוב ורע. זהו עניין "כתנות עור" בעי"ן, שהרי בתורתו של רבי מאיר מצאו כתוב "כתנות אור" באל"ף (בראשית רבה כ, יב): הלבושים האלה היו פעם מאירים, ועתה העור "עיוור" — מסתיר. זהו מימד החוש של העולם הגשמי והחומרי, המסתיר את מימד ה"אור" שבאל"ף, המימד הרוחני.'
- from: על כל פנים, "הלבוש הזה כלול בטוב ורע, אחרי שנתערב על ידי חטא האדם הראשון, וצריך לבררו, והוא נעשה על ידי התורה והמצוות". שהתורה והמצוות שאנחנו עושים מבררים באמת את עצמנו. זה מה שנקרא שתיקון המידות כנגד כולם. תיקון המידות, אבל זה לא רק תיקון המידות באופן כללי. כל המעשים שלנו בעולם הזה משאירים רושם על ידי שני הצלמים האלה. בלשון עץ חיים, מה שנקרא כתנות עור, שזה הלבוש שהוא הגוף האמיתי שלנו, שבאמת זה שני הצלמים, באמת הדרגה של התודעה, גם בנפש האלוקית, נפש הבהמית; וכל הפעולות שהן מחטא האדם הראשון ועד ביאת המשיח, זה היה לתיקון של הלבושים האלה.
  to: '"הלבוש הזה כלול בטוב ורע, אחרי שנתערב על ידי חטא האדם הראשון, וצריך לבררו, והוא נעשה על ידי התורה והמצוות". התורה והמצוות שאנו עושים מבררות את עצמנו. וזהו שאומרים, שתיקון המידות כנגד כולם — ולא תיקון המידות באופן כללי בלבד: כל מעשינו בעולם הזה משאירים רושם, על ידי שני הצלמים האלה. בלשון עץ חיים זהו הנקרא כתנות עור, הלבוש שהוא הגוף האמיתי שלנו: שני הצלמים, דרגת התודעה, בנפש האלוקית ובנפש הבהמית. וכל הפעולות, מחטא האדם הראשון ועד ביאת המשיח, היו לתיקון הלבושים האלה.'
- from: 'אנחנו פה רואים הקבלה בין הלבושים הפרטיים של הנפש ורוח הנשמה בגוף של האדם הפרטי, ובין העולם הכללי — כן, העולם הוא אדם גדול והאדם הוא עולם קטן. אז גם בעולם כולו יש את הלבושים, שאני ממשיל את זה לתודעה הקולקטיבית: כמו שיש את התודעה הפרטית של כל אחד, ככה יש גם את התודעה הקולקטיבית, והיא הסך הכל, שהיא הגוף של כל האנושות בכל זמן. ועם ישראל, על ידי תורה ומצוות, באו להאיר את העולם, לברר את עצמם ואת כל העולם כולו. וזה הבירור שבעולם משפיע גם על בני האדם שבעולם, וגם הבירור של כל בן אדם פרטי משפיע על העולם הכללי.'
  to: 'יש כאן הקבלה בין לבושי הנפש, הרוח והנשמה בגופו של האדם הפרטי לבין העולם הכללי: העולם הוא אדם גדול, והאדם הוא עולם קטן. גם בעולם כולו יש לבושים, ואני ממשיל אותם לתודעה הקולקטיבית: כשם שלכל אחד תודעה פרטית, כך יש תודעה קולקטיבית, והיא הסך הכל, גופה של האנושות כולה בכל זמן. ועם ישראל בא, בתורה ובמצוות, להאיר את העולם ולברר את עצמו ואת העולם כולו. הבירור שבעולם משפיע על בני האדם שבו, וגם בירורו של כל אדם פרטי משפיע על העולם הכללי.'
- from: ושם ממשיך בעץ חיים את הבירור של הטוב והרע, והוא אומר שתורה ומצוות הקדוש ברוך הוא נתן לישראל "כדי לברר, לצרף ולהסיר הסיגים, שהם לבוש הנשמה". אז כל הסיפור שיש עולם, עם כל הסיפור של ההיסטוריה של האנושית, היא כדי להביא מחשבות נכונות, להביא את האידיאלים העליונים למימוש פה, בצדקה לעניים, בצדק ובמשפט, ומחשבה, דיבור ומעשה כדבעי. שהמעשים האלה, התורה מלמדת אותנו וגם מזככת אותנו, שהיא חוכמה אלוקית, על ידי שהאנושות עוסקת בחוכמה. ועל זה לא מספיק רק חוכמה, יש גם את המצוות, על ידי המעשים. המצוות זה בין אדם למקום, כמו תפילין ושבת ומזוזה; יש את מצוות בין אדם לחברו. וכל הבירורים האלה משאירים רושם כל רגע על הבן אדם. אני קורא לזה האישיות, אבל זה יותר מזה, זה באמת הצלם, שהוא באמת הלבוש הרוחני שמלביש את הנשמה ומחבר עם הגוף. וזה באמת הלבוש שעולה איתו אחרי זה גם לגן עדן. קרוב מאוד להגיד שזה האישיות שלנו, מה שנקרא.
  to: 'ועץ חיים ממשיך שם בבירור הטוב והרע, ואומר שהקדוש ברוך הוא נתן לישראל תורה ומצוות "כדי לברר, לצרף ולהסיר הסיגים, שהם לבוש הנשמה". כל סיפורו של העולם, כל ההיסטוריה של האנושות, נועד להביא מחשבות נכונות ולממש כאן את האידיאלים העליונים: בצדקה לעניים, בצדק ובמשפט, ובמחשבה, דיבור ומעשה כדבעי. התורה, שהיא חוכמה אלוקית, מלמדת אותנו את המעשים האלה, וגם מזככת אותנו כשהאנושות עוסקת בחוכמה. ולא די בחוכמה: יש גם המצוות, המעשים — מצוות שבין אדם למקום, כמו תפילין ושבת ומזוזה, ומצוות שבין אדם לחברו. כל הבירורים האלה משאירים רושם באדם בכל רגע. אני קורא לזה האישיות, אבל זה יותר מזה: זהו הצלם, הלבוש הרוחני המלביש את הנשמה ומחבר אותה עם הגוף, והוא הלבוש שעולה עמה אחר כך לגן עדן. קרוב מאוד לומר שזו "האישיות" שלנו.'
- from: '"על ידי הכוונה בתורה ומצוות, הוא גומר לבוש נשמה", כמו שאמרנו. "נמצא כי אלו הלבושים הנזכר בפרשת ויחי, אין פירוש שנעשה מחדש על ידי תורה ומצוות, אמנם מתבררים". וזה החידוש של העץ חיים שהגענו אליו: שמה שנשמע בזוהר, שתורה ומצוות הם יוצרים את הלבושים — פה העץ חיים מביא שיטה שבאמת הלבושים האלה הם מה שמחברים את הנשמה עם הגוף, אבל הניקיון של הלבושים האלה פועל בירור גם באדם, ולכן על ידי הלבושים האלה הוא יכול ליהנות מזיו השכינה בגן עדן, וגם בעולם שמזכך אותם. וזה הבירור של הרע, וזה עבודת הבירורים. זה חשוב להבין בכלל גם עבודת הבירורים בעולם, ואיך כל רגע פרטי שלנו משפיע על זה.'
  to: '"על ידי הכוונה בתורה ומצוות, הוא גומר לבוש נשמה". "נמצא כי אלו הלבושים הנזכר בפרשת ויחי, אין פירוש שנעשה מחדש על ידי תורה ומצוות, אמנם מתבררים". זהו חידושו של עץ חיים: מן הזוהר נשמע שהתורה והמצוות יוצרות את הלבושים, ועץ חיים מביא כאן שיטה שהלבושים הם המחברים את הנשמה עם הגוף, אבל ניקוים פועל בירור גם באדם; ולכן על ידם הוא יכול ליהנות מזיו השכינה בגן עדן, וגם בעולם שמזכך אותם. וזהו בירור הרע, עבודת הבירורים. חשוב להבין את עבודת הבירורים בעולם בכלל, ואיך כל רגע פרטי שלנו משפיע עליה.'
