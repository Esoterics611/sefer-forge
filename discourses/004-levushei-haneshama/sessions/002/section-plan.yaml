  to: '"אמנם מתבררים": זה חידושו של עץ חיים. מן הזוהר נשמע שהתורה והמצוות יוצרות את הלבושים; ולפי עץ חיים הלבושים קיימים, והם המחברים את הנשמה לגוף, והתורה והמצוות מבררות אותם. בלבושים המבוררים נהנה האדם מזיו השכינה בגן עדן. זוהי עבודת הבירורים, בעולם ובכל רגע של כל אדם.'
