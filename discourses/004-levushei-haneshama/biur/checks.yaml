# The independent check's serious findings (check.md, 2026-11-12), for the print.
# scripts/build-biur.py reads this file: each paragraph named in `places` gets a mark [⚑ N] at its end,
# and the findings print as the last part of the explanation (ז), so the reader studying a paragraph
# knows it is in question. The explanation's own sentences are not changed by this file.
# When a finding is settled (corrections.yaml), remove it here, or set `settled:` to what was done.

intro: >-
  אחרי שנכתב הביאור בדקו אותו שלושה בודקים שלא ראו את דרך חשיבתו של הכותב, מול המקורות שבמאגר. אלה ממצאיהם
  העיקריים. הם לא הוכנסו לביאור, שכן הם נוגעים בתוכן: כל אחד מהם ממתין להכרעה. הפסקאות שבהן הם נוגעים
  מסומנות בגוף הביאור בציון "בדיקה" ומספר הממצא. הפירוט המלא, עם כל הממצאים הקטנים, בקובץ הבדיקה שבמאגר.

findings:
  - id: 1
    title: 'מקבילה בדברי אדמו"ר הזקן עצמו: תניא, פרק מ'', בהגהה'
    places: ['18.4', '18.11', '19.16']
    body: >-
      בתניא פרק מ', בהגהה, כותב אדמו"ר הזקן כמעט את לשון ההגהה שלנו בסעיף 18: "שבלימוד מקרא מתפשט היחוד
      ואור־אין־סוף ב"ה מאצילות עד העשיה, ובמשנה עד היצירה לבדה, ובתלמוד עד הבריאה לבדה, כי כולן באצילות.
      אבל קבלה אינה מתפשטת כלל מאצילות לבריאה יצירה עשיה". הדברים שם בלי תנאי, ולכן הם נוגעים גם בקריאת
      "הדרך הראשונה" בסעיף 18 (קבלה "למי שיודע להפשיטה"). הערות המו"ל לתורה אור מפנות לשם. המקום לא נמצא
      בכתיבה, כנראה מפני שהחיפוש בתניא לא מצא מילים שיש בהן ע' (תוקן).
    evidence: 'תניא, ליקוטי אמרים, פרק מ'', בהגהה'
  - id: 2
    title: 'מקור לסדר ציצית קטן–טלית–תפילין = עיבור–יניקה–מוחין'
    places: ['16.12', '16.15']
    body: >-
      בסעיף 16 נאמר שמקור הסדר לא נמצא. הוא מפורש פעמיים, כסדר ההגהה: בשער הכוונות, דרושי ציצית, דרוש ה':
      "ציצית קטן כנגד עיבור וטלית גדול כנגד יניקה ואין טלית ג' כנגד הגדלות של המוחין ולכן אח"כ מניחין
      התפילין שהם כנגד זמן הגדלות של המוחין"; ובפרי עץ חיים, שער התפילין: "כי הטלית הוא בחי' המקיף, לבחי'
      ראשונה עיבור ויניקה". בזה נפתר גם הקושי מול "א"מ דזעיר בהיות גדול" שבשער הציצית.
    evidence: 'שער הכוונות, דרושי ציצית ה''; פרי עץ חיים, שער התפילין'
  - id: 3
    title: 'שלושה שמות בקריאת התורה'
    places: ['17.10', 'ה׳.9']
    body: >-
      בסעיף 17 (מידת הוודאות) ובשאלה הפתוחה שבחלק ה' נאמר שבפרי עץ חיים ניתן לקריאת התורה שם אחד בלבד. בפסקה
      שלפני הקטע המובא שם: "ויכוין אל הת"ת דז"א, לג' בחי' שבו... הוי"ה חיצונית, הויה בריבוע אמצעי, שם מ"ה
      פנימי". השאלה מוכרעת לפחות בחלקה.
    evidence: 'פרי עץ חיים, שער הנהגת הלימוד'
  - id: 4
    title: 'מקור קרוב יותר ל"כוונות עיוה"כ"'
    places: ['13.4', '13.5']
    body: >-
      בשער הכוונות, דרושי יום הכיפורים, דרוש א', יש כל פרטי לשון ההגהה: "חיצוניות אימא עילאה", "זו"ן נק'
      אדם... ע"י הלחם הגופני... בשיתוף מוצא פי ה'", "למעלה מז"א", והאכילה בערב יום הכיפורים. המקור שהובא,
      פרי עץ חיים שער יום הכיפורים, אומר שהמזון הולך למלכות, ואינו קורא לז"א "אדם".
    evidence: 'שער הכוונות, דרושי יום הכיפורים א'''
  - id: 5
    title: '"כמ"ש בע"ח ספ"ג גבי ח"ש": מועמד שלא נשקל'
    places: ['12.17', '12.21', 'ה׳.12']
    body: >-
      מלבד שער מ"ט, יש לשקול את שער החשמל פרק ג' (עץ חיים 41.3.1), הפרק האחרון של השער שההגהה ציטטה זה עתה:
      שם הלבושים שמן המצוות, ציצית ביצירה ותפילין בבריאה, הם "הלבושים של האדם בעוה"ב", וההגהה עצמה מביאה
      מקום זה שורות ספורות אחר כך. "ח"ש" שם לא נתבאר. ועוד: ה"ח"ש" שבשער מ"ט פרק ג' נדרש מאותיות תחש/נחשת,
      לא מאותיות חשמל.
    evidence: 'עץ חיים 41.3.1: "להורות כי יצירה מלבוש לבריאה"'
  - id: 6
    title: 'שער הצלם: ארבעה פרקים, לא שלושה'
    places: ['11.22', 'ה׳.15']
    body: >-
      נאמר שבעותק שלפנינו יש לשער הצלם שלושה פרקים בלבד, ומכאן ש"פרק ג'" שבהגהה הוא סוף פרק ב'. בעותק יש
      ארבעה פרקים (26.1–26.4), ככותרת השער. פרק ג' שבעותק (26.3.1) לא נשקל כלל, והוא אומר שהצלם הוא של בינה:
      "צלם א' מבינה לבד", "צלם הבינה". זה בדיוק "צלם דאימא" שההגהה מביאה עליו "פ"א ופ"ג". השאלה פתוחה בין
      שני המקומות.
    evidence: 'עץ חיים 26.1.1: "שער הצלם ויתחלק לד'' פרקים"; 26.3.1'
  - id: 7
    title: '"שהיא אלקות שבנוגה": שתי הקריאות עומדות'
    places: ['15.8', '15.19', 'ה׳.7']
    body: >-
      בסעיף 15 נמנית הקריאה ש"שהיא" מוסב על המצוות בין המקומות שבהם "אפשר לטעות". אבל "מצות" הוא השם היחיד
      בכתוב שאפשר להסב עליו, ובקונטרס אחרון (4.22, שהסעיף עצמו מביא) גשמיות המצווה נמשכת מכלי האצילות,
      "שהיא בחינת אלקות ממש". ולמה "שלא ע"י נר"נ דאדם": אדמו"ר הזקן עצמו נותן טעם בקונטרס אחרון 4.28,
      שהבירורים "גבוהין בשרשן מנפש־רוח־נשמה שבאדם, כי הן מס"ג". יש להציג את שתי הקריאות ולא לפסול אחת.
    evidence: 'תניא, קונטרס אחרון ד, 4.22, 4.27, 4.28; עץ חיים 40.8.1'
  - id: 8
    title: '"באצילות": גם במקום האצילות'
    places: ['15.5']
    body: >-
      נאמר ש"באצילות" אין פירושו כאן במקום האצילות. באותם סוגריים עצמם: "מעלים עד נוקבא דאצי' העליון",
      ובסעיף 14 "עד מל' דאצי'", ובעץ חיים 41.3.2 "עלו עד נוקבא דאצילות". נכון יותר: לא רק במקום האצילות.
    evidence: 'לשון ההגהה; עץ חיים 41.3.2'
  - id: 9
    title: 'סעיף 17 אומר יותר מן המקור'
    places: ['17.2', '17.9']
    body: >-
      נאמר שהכוונות שבכתבי האריז"ל כולן לשמות של האצילות, ו"אף אחד מן השמות אינו של העולם". באותו פרק:
      "תכוין כי מקרא הוא בעשיה, לכן תכוין כי שם ב"ן הוא בעשיה" (1.24), "המשנה הוא מטטרון ביצירה" (1.46).
      הדבר נכון רק בשמות שההגהה מונה.
    evidence: 'פרי עץ חיים, שער הנהגת הלימוד 1.24, 1.46'
  - id: 10
    title: 'סעיף 18: הנימוק לתלמוד פועל בכיוון ההפוך'
    places: ['18.12']
    body: >-
      הנימוק "שהרי הכוונה בהם בשמות הכלים של נוקבא דז"א דאצילות" אינו מתאים לתלמוד: עץ חיים 44.5.9 עושה את
      הכלים החיצוניים של נוקבא דאצילות, שבהם מכוונים בתלמוד, נשמה לנוקבא *דעשייה* (ובקונטרס אחרון 4.55:
      "רוח דבריאה"). המתח לא נדון, ואפשר שהוא העומד מאחורי "אפשר... בריאה ממש שבעשיה" שבסעיף 19.
    evidence: 'עץ חיים 44.5.9; תניא, קונטרס אחרון 4.55'
  - id: 11
    title: 'דברי הסבא: הפשטת הלבוש רק בדף צ"ח'
    places: ['13.14', '13.15']
    body: >-
      "וכד סלקין לעילא, מתפשטן מניה" נאמר רק בדף צ"ח ע"ב. בדף צ"ט ע"ב הנשמה מתעטפת ברוח "לקיימא תמן לעילא,
      בהיכלא טמירא", ואין שם הפשטה. ו"מדור הרוח" הוא לשון הכותב, לא לשון הזוהר.
    evidence: 'זוהר ח"ב צ"ח ע"ב, צ"ט ע"ב'
  - id: 12
    title: 'סעיף 19: הקריאה עומדת; שלושה דברים לתקן'
    places: ['19.6', '19.11', '19.12']
    body: >-
      הפירוש של "אך זה אינו" (דוחה את ה"אפשר" שלפניו) עומד, והוא העדיף. לתקן: (א) במשפט ג' "מי שנשמתו מן
      בריאה" משמש ראיה למקום התלמוד, ובפסקה מאוחרת אותן מילים מתפרשות על הלבוש של האדם בלבד: צריך ליישב.
      (ב) עץ חיים 49.5.2 פותח "בכונת המצות והתורה", ולכן "בלי כוונה" הוא קריאת ההגהה, לא לשון עץ חיים.
      (ג) הראיה מקונטרס אחרון הולכת רחוק ממנו: שם ההבחנה היא בין לימוד האדם לתלמוד שניתן בסיני, לא בין
      לימוד פשוט לכוונה. ויש להביא לכאן גם את תניא פרק מ' (ממצא 1).
    evidence: 'עץ חיים 49.5.2; תניא, קונטרס אחרון 4.54–4.56; תניא פרק מ'''
