  - label: שרש אומות העולם מתחת הזמן
    quote: וכח אלקי המהווה הטבע, מוסתר ונעלם בע' שרים, בסוד גלות השכינה
  - label: ישראל עלה במחשבה
    quote: פי', שרש נשמתם ומקור חוצבם מבחי' מחשבה עליונה שלמעלה מן הזמן
  - label: חידוש השפע מאין ליש
    quote: שמחדש השפע תמיד מאין ליש בבלתי הפסק כו', והוא למעלה מן הזמן
  - label: מודים אנחנו לך
    quote: מודים אנחנו לך שאתה ה' אלקינו, פי', מחמת שאתה ה' אלקינו בבחי' מח'
  - label: החומר המחשיך
    quote: בהיותה מלובשת בחומר הגופני המחשיך עליה, לא תוכל לבא לבחי' הודאה זאת
  - label: מודים דרבנן — הודאה להודאה
    quote: וענין מודים דרבנן הוא ענין הודאה להודאה זו
