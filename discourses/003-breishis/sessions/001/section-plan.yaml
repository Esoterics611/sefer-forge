  - label: רצוא בק"ש, שוב בתפלה
    quote: והנה מבחינת רצוא הנ"ל בק"ש נעשה שוב אח"כ בתפלה
  - label: שוב בתורה ובמצות
    quote: ואח"כ במעשה המצות נמשך בחי' שוב זה יותר וכידוע בשרש ענין המצות שהוא להמשיך האור בכלי דוקא
  - label: בע"כ אתה חי
    quote: לפי שאחר האהבה והתשוקה במס"נ בבחי' רצוא הנ"ל אח"כ נעשה בחי' שוב להיות בע"כ אתה חי בגוף
  - label: בכל לבבך ובכל נפשך
    quote: וזהו פי' בכל לבבך במס"נ תחילה בבחי' הרצוא ואח"כ ובכל נפשך היא בחי' שוב
  - label: השוב נקרא שמים
    quote: כי כמו שהשמים מקיפי' לארץ כך בחי' השוב הזה הוא בחי' מקיף לבחי' הרצוא דארץ הנ"ל
  - label: כגרגיר חרדל
    quote: הרי אנו רואים שהארץ אינה רק כגרגיר חרדל לגבי מרחב הכדור של השמים המקיפי' עליה מכל צדדיה בהשואה אחת
  - label: השמים כסאי והארץ הדום רגלי
    quote: פי' הדום רגלי הוא ע"ד השרפרף לכסא שמגביה הרגלים כך הנשמות שנק' ברא כרעא דאבוה מתעלים ע"י בחי' ארץ הוא בחי' הרצוא

