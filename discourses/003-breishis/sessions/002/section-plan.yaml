  to: כלומר, אינו מתלבש בגילויים שמסתירים אלוקות.
- from: בחיצוניות העתיק הוא יכול להתלבש באריך, ואריך מסתיר את העתיק, והפרצופים של אבא ואמא מסתירים את אריך, עד זעיר אנפין מלביש ומסתיר את הפרצופים שלמעלה, עד שפרצוף נוקבא מסתיר את הכל ונותן מקום למציאות של עולם שיש, ופה האלוקות מסתתרת.
  to: חיצוניות עתיק מתלבשת באריך, ואריך מסתיר את עתיק; פרצופי אבא ואמא מסתירים את אריך, זעיר אנפין מלביש ומסתיר את הפרצופים שלמעלה ממנו, עד שפרצוף נוקבא מסתיר את הכל ונותן מקום למציאות של עולם שהוא יש, ושם האלוקות מסתתרת.
- from: אמרנו שבגאולה זה התעוררות מלמעלה, שהקדוש ברוך הוא בכבודו ובעצמו מגלה את עצמו ומגלה את, הוא פותח את כל המסכים, וזה מתגלה בנשמות ישראל פה למטה, שאתה מרגיש שהיהודי שפה לידך זה עצמות אינסוף בגוף. וזה שיש מציאות שלמטה זה לא סתירה, בזה שהיהודי הזה עם הבחירה החופשית עצמו, הנשמה שלו מאירה בגלוי את האלוקות. וזה הדרך בעל שם טוב, שהנשמה שלו רואה מסוף העולם ועד סופו, כאדם הראשון. אבל כל אחד הוא ככה.
  to: 'בגאולה, כאמור, ההתעוררות היא מלמעלה: הקדוש ברוך הוא בכבודו ובעצמו מגלה את עצמו ופותח את כל המסכים, וזה מתגלה בנשמות ישראל כאן למטה, עד שמרגישים שהיהודי שלידך הוא עצמות אינסוף בגוף. וקיומה של המציאות שלמטה אינו סתירה לכך: היהודי הזה, בעל הבחירה החופשית, נשמתו מאירה בגלוי את האלוקות. וזו דרך הבעל שם טוב, שנשמתו רואה מסוף העולם ועד סופו, כאדם הראשון; אבל כך הוא כל אחד.'
- from: 'מה שאין כן, כמובן, בנשמות של סדר השתלשלות שמסתתר, אז תמיד הפנימיות נשאר מוסתר. הנקודה פה גם כן: אומרים שהקדוש ברוך הוא מתגלה על ידי גילוי של פנימיות התורה. כשמגלים את פנימיות התורה, זה מגלה את הקדוש ברוך הוא.'
  to: 'מה שאין כן בנשמות של סדר ההשתלשלות, שבו הפנימיות נשארת תמיד מוסתרת. והנקודה כאן היא גם שהקדוש ברוך הוא מתגלה על ידי גילוי פנימיות התורה: כשמגלים את פנימיות התורה, מתגלה הקדוש ברוך הוא.'
- from: 'אנחנו אומרים כל יום "אור חדש על ציון תאיר": זה מבחינת פנימיות העתיק, ותאיר זה מבחינת התורה, שהתורה של אור חדש היא תורת החסידות, הפנימיות של העניינים שעומדים פה.'
  to: 'כל יום אנחנו אומרים "אור חדש על ציון תאיר": האור החדש הוא מבחינת פנימיות עתיק, ו"תאיר" הוא מבחינת התורה, שהתורה של האור החדש היא תורת החסידות, פנימיות העניינים שמדובר בהם כאן.'
