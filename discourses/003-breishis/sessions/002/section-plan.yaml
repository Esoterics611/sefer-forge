title: פרשת בראשית — ארץ קדמה לשמים, שמים חדשים וארץ חדשה
heading: פָּרָשַׁת בְּרֵאשִׁית
lines:
  - אֶרֶץ קָדְמָה לְשָׁמַיִם
  - שָׁמַיִם חֲדָשִׁים וְאֶרֶץ חֲדָשָׁה — עוֹלַם הָעֲקוּדִים

# The voicenote reads from "והנה" (00:00) to "ברוך הוא" (18:54); the rest of
# the column, before and after, stays in ocr.md (see ocr-match.md).
nusach:
  start: והנה בבחי' זו ארץ קדמה לשמים
  end: אני דייקא הוא המאציל עליון ברוך הוא
  breaks:
    - וצ"ל קדימת בירור המ"ן
    - אבל לע"ל בביאת משיח
    - הנה התכלית הוא שיאיר
    - דהנה כל הנשמות
    - ולע"ל יהי' גילוי אור חדש
    - והן מקורות לחכמה וחסד
  bold: [והנה]

keys:
  - label: ארץ קדמה לשמים — רצוא ושוב
    quote: ארץ הוא בחי' רצוא שבתפלה דהיינו בירור המ"ן תחלה ואח"כ שמים היינו השפעת המ"ד ע"י תו"מ
  - label: קדימת בירור המ"ן
    quote: וצ"ל קדימת בירור המ"ן תחלה כדי שאח"כ יבא בירור המ"ד לברר את המ"ן
  - label: עבודת הבירורים בגלות
    quote: וזו היא עבודתינו כל ימי משך הגלות שהרע גובר וצ"ל בירור הרע ולהפרידו מן הטוב
  - label: גילוי עולם העקודים לעתיד לבוא
    quote: הנה התכלית הוא שיאיר ויתנוצץ גילוי אור עולם העקודים שלמעלה מעולם האצי'
  - label: נשמות חדשות
    quote: ואז יהי' התנוצצות נשמות חדשות שאין בהם בחי' בירור
  - label: פנימיות עליון אינו משתלשל
    quote: אבל פנימי' עליון אינו יורד ומשתלשל כלל
  - label: אנת הוא חכים ולא בחכמה ידיעא
    quote: כמאמר אנת הוא חכים אלא ולא בחכמה ידיעא שנמשך אור א"ס בחכמה
  - label: שמים חדשים וארץ חדשה
    quote: וגילוי זה נקרא שמים חדשים וארץ חדשה אשר אני עושה

