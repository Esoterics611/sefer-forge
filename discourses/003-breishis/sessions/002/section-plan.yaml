- from: הארץ זה עולם הגשמי והחומרי של זמן ומקום, שזה כל היקום שאנחנו מכירים ויכולים לחשוב עליו.
  to: הארץ היא העולם הגשמי והחומרי של זמן ומקום, כל היקום שאנחנו מכירים ויכולים לחשוב עליו.
- from: שגם המחשבה בעניינים גשמיים שלנו היא מתחת לזמן ומקום, וגם התורה שאנחנו לומדים, שהיא עם כבש ופרה ובור וחמור, יש גשמיים, שזה הכל בעולם שמתחת לזמן ומקום, ורומזת בעליונים, שזה בשמיים.
  to: גם המחשבה שלנו בעניינים גשמיים היא מתחת לזמן ומקום, וגם התורה שאנחנו לומדים, העוסקת בכבש ופרה ובור וחמור, בעניינים גשמיים שמתחת לזמן ומקום, רומזת לעליונים, לשמיים.
- from: 'ככה גם שמיים וארץ:'
  to: 'כך גם שמיים וארץ:'
- from: העניינים הארציים שלנו, של הגוף, נפש הבהמית, של החיות שלנו, שבבני, חיי ומזוני, כולם רויחי בגשמיות.
  to: העניינים הארציים שלנו הם עניני הגוף, הנפש הבהמית והחיות שלנו — "בני, חיי ומזוני רויחי" — בגשמיות.
- from: אז זה העניין של התפילה, שעל זה מתפללים, שזה העניינים הארציים, והתפילה שלנו פועלת בעולמות של למעלה מזמן ומקום.
  to: על העניינים הארציים האלה מתפללים, והתפילה שלנו פועלת בעולמות שלמעלה מזמן ומקום.
- from: ולכן אי אפשר להרגיש את זה, לשמוע את זה, כי כל החושים שלנו פועלים בתוך מימד של זמן ומקום.
  to: לכן אי אפשר להרגיש ולשמוע את פעולתה, כי כל החושים שלנו פועלים בתוך מימד של זמן ומקום.
- from: התפילה פועלת בשורש של העולם, בשמיים, שקדמה לארץ.
  to: התפילה פועלת בשורש של העולם, בשמיים, שקדמו לארץ.
- from: לכן כל מה שקורה בארץ הזה, כל הברכות שמתגלות פה בזמן ומקום בגשמיות, השורש שלהם זה בעולמות של למעלה ברוחניות.
  to: לכן כל מה שקורה בארץ, כל הברכות שמתגלות כאן בזמן ומקום בגשמיות, שורשן בעולמות העליונים, ברוחניות.
- from: 'זה עניין של הרצוא ושוב בתפילה. עכשיו מבאר את זה בפרק הזה, עניין "ארץ קדמה לשמיים":'
  to: 'זהו עניין הרצוא ושוב בתפילה, המבואר בפרק הזה בעניין "ארץ קדמה לשמיים":'
- from: שקודם מתפללים, שזה הארץ, שסוף מעשה במחשבה תחילה, למרות שהארץ, מה שקורה בארץ, זה תוצאה של מה שבשורש כבר מתהווה בשמיים.
  to: קודם מתפללים, וזו הארץ, כי "סוף מעשה במחשבה תחילה", אף על פי שמה שקורה בארץ הוא תוצאה של מה שכבר מתהווה בשורשו בשמיים.
- from: לכן השמיים קדמו לארץ, שיש את השמיים ואת הארץ.
  to: מצד זה השמיים קודמים לארץ, אבל בתכלית
- from: הארץ קדמה העניין, שמה שהעניינים בשמיים זה בשביל שזה יהיה ככה בארץ.
  to: הארץ קודמת, שהרי העניינים שבשמיים הם בשביל שכך יהיה בארץ.
- from: וממילא זה העניין של התפילה, שהתפילה בארץ פועלת כביכול, לא כביכול, פועלת עניינים חדשים בשמיים, שזה משפיעים את הברכה בארץ.
  to: 'וזהו עניין התפילה: התפילה בארץ פועלת באמת עניינים חדשים בשמיים, והם משפיעים את הברכה בארץ.'
- from: 'בפרטים:'
  to: 'ובפרטות:'
- from: זה מסביר שהעניין של מים נוקבים, שזה ההתעוררות מלמטה — כידוע שבקבלה הנוקבא היא ספירת המלכות, שהיא כנגד העולמות התחתונים, עולם המעשה, והזכר זה הבחינה מלמעלה, השפעה מעולמות העליונים לתחתונים.
  to: כאן מבואר שהמים נוקבים הם ההתעוררות מלמטה. כידוע, בקבלה הנוקבא היא ספירת המלכות, שכנגד העולמות התחתונים, עולם המעשה, והזכר הוא הבחינה שמלמעלה, ההשפעה מהעולמות העליונים לתחתונים.
- from: 'אז פה יש למטה מעורר: כשיש את ההתעוררות מלמטה, כשבני אדם מתפללים פה למטה, זה מעורר את ההתעוררות שבאה מלמעלה. ועכשיו הוא מביא לכך שהשמיים מבחינת משפיעים, הוא מביא מזה כמה פסוקים, שזה נקרא השפעת המים דוכרים.'
  to: 'התחתון הוא המעורר: כשבני אדם מתפללים כאן למטה, ההתעוררות מלמטה מעוררת את ההתעוררות שמלמעלה. ועל כך שהשמיים הם בבחינת משפיעים, השפעת המים דוכרים, הוא מביא כמה פסוקים.'
- from: 'עכשיו נגיד בקצרה:'
  to: ''
- from: 'יש שתי בחינות בתהליך הזה. שזה התעוררות המים נוקבים, זה נקרא העלאת מ"ן, מים נוקבים בלשון הקבלה: תפילה, כל המצוות שאנחנו עושים בגשמיות עם העולם הזה החומרי, וצדקה כנגד כולם, כל הדברים הטובים, כל המעשים הטובים שעושים בעולם הזה — זה ההתעוררות מלמטה, זה נקרא העלאת מ"ן, מים נוקבים.'
  to: 'יש בתהליך הזה שתי בחינות. הראשונה היא התעוררות המים נוקבים, שנקראת בלשון הקבלה העלאת מ"ן: התפילה, כל המצוות שאנחנו עושים בגשמיות בעולם הזה החומרי, והצדקה כנגד כולם, כל המעשים הטובים שעושים בעולם הזה.'
- from: ולפי ערך העלאת המ"ן, כך יש את המשכת המ"ד, המים דוכרים, שזה השפעה שבאה מלמעלה, לפי ערך ההתעוררות מלמטה.
  to: ולפי ערך העלאת המ"ן נמשכים המ"ד, המים דוכרים, ההשפעה שמלמעלה.
- from: 'לכן כל מה שאדם עושה בעולם הזה, חוזר אליו ככה אלף פעמים יותר חזק: עושה טוב, מקבל אלף פעמים טוב, וכן להפך, חס ושלום.'
  to: 'לכן כל מה שאדם עושה בעולם הזה חוזר אליו פי אלף: העושה טוב מקבל טוב פי אלף, וכן להפך, חס ושלום,'
- from: התכלית של כל היום, שמעלה את כל התורה והמצוות של כל היום, של העבודה של האדם, זה התפילה, שהיא ממש מכוונת ופועלת את ההתעוררות של המים נוקבים מלמטה.
  to: ותכלית היום, המעלה את כל התורה והמצוות ואת כל עבודת האדם של היום, היא התפילה, המכוונת את התעוררות המים נוקבים מלמטה ופועלת אותה.
- from: 'השלב השני, זה נקרא לפעמים בירור שני דמ"ד:'
  to: 'הבחינה השנייה נקראת לפעמים בירור שני דמ"ד:'
- from: כשיש את המים דוכרים שיורדים מלמעלה למטה.
  to: המים דוכרים יורדים מלמעלה למטה.
- from: כמו שיש תפילה, ויהודי מבקש מעומק ליבו, והקדוש ברוך הוא עונה לתפילה וממשיך ברכה מלמעלה שיורדת לעולם — היה הבירור הראשון.
  to: יהודי מתפלל ומבקש מעומק ליבו, והקדוש ברוך הוא עונה לתפילה וממשיך ברכה מלמעלה שיורדת לעולם; זהו הבירור הראשון.
- from: 'הבירור השני זה שעל ידי ההשפעה מלמעלה זה מברר את הלמטה בירור שני: כמו שיהודי מקבל את מה שהוא התפלל עליו, ואחרי זה רואה את הברכה, וזה מביא כבר לדרגה חדשה למעלה.'
  to: 'הבירור השני הוא שההשפעה מלמעלה מבררת את התחתון: היהודי מקבל את מה שהתפלל עליו, רואה את הברכה, וזה כבר מביא לדרגה חדשה למעלה.'
- from: יש את הרצון מלמטה, כמו שהוא כבר מקבל את המילוי מלמעלה. הייחוד הזה, זה כבר נקרא הבירור שני דמ"ד.
  to: הרצון שמלמטה מקבל את מילויו מלמעלה, וייחוד זה נקרא הבירור השני דמ"ד.
- from: 'בלשון הגאולה, לדוגמה: יש את העבודה מלמטה, מבקשים את הגאולה, פועלים כמה שאפשר מלמטה. הקדוש ברוך הוא מביא את הגאולה מלמעלה בפועל ממש.'
  to: 'לדוגמה, בעניין הגאולה: העבודה מלמטה היא לבקש את הגאולה ולפעול ככל האפשר, והקדוש ברוך הוא מביא את הגאולה מלמעלה בפועל ממש.'
- from: 'ואז יש את השלב השלישי, שיש את הגאולה, ביחד עם הרצון לגאולה, שזה כאילו משלים את כל הבחינה למטה. זה הרצון, שזה באמת, העולם עצמו השתנה. סליחה, זה העניין:'
  to: ואז, יחד עם הרצון לגאולה, הגאולה משלימה את כל הבחינה שלמטה, עד שהעולם עצמו משתנה. זהו
- from: הבירור השני של המ"ד זה שהמים נוקביים משתנים. התחתון, אחרי שהעליון מתגלה בו, הוא כבר משתנה למעלה. בעניין של הגאולה, זה אומר מתי שיש כבר ניסים ונפלאות, שהגשמי עצמו, הזמן ומקום, מגלה בגילוי את הלמעלה מזמן ומקום, את הנושא ההפכים הזה. וזה שיש גילוי אלוקות פה למטה, זה הסיום של הגלות.
  to: 'הבירור השני של המ"ד: המים נוקבים עצמם משתנים, והתחתון, אחרי שהעליון מתגלה בו, כבר משתנה ומתעלה. בגאולה פירוש הדבר הוא ניסים ונפלאות: הגשמי עצמו, הזמן והמקום, מגלה בגלוי את שלמעלה מזמן ומקום, נושא ההפכים. גילוי האלוקות כאן למטה הוא סיום הגלות.'
- from: אז הגאולה עצמה זה ההתעוררות מלמעלה שמקבילה להתעוררות מלמטה. וזה קורה גם בכל יום.
  to: הגאולה עצמה היא ההתעוררות מלמעלה שמקבילה להתעוררות מלמטה, כפי שקורה גם בכל יום;
- from: אבל הבירור השני זה מתי שהלמטה מכיל בעצמו ומקבל את הגילוי הגדול שבא מלמעלה.
  to: אבל הבירור השני הוא כשהתחתון מכיל בעצמו ומקבל את הגילוי הגדול שבא מלמעלה.
- from: 'כל זה פה באמת המילים. אני קופץ קצת וממשיך:'
  to: 'וכך ממשיך:'
- from: בדיוק כמו שאמרנו.
  to: ''
- from: אז צריך להיות קודם כל הבירור של המ"ן.
  to: קודם צריך להיות בירור המ"ן.
- from: זה כמו שאומרים שהמשיח בא אחרי הבירור של כל רפ"ח ניצוצים, של כל העניינים של העולם הזה, שנפלו בגלות, והבירור שלהם זה היה על ניסיונות ועבודה.
  to: לכן אומרים שהמשיח בא אחרי בירור כל רפ"ח הניצוצות, כל ענייני העולם הזה שנפלו בגלות, ובירורם על ידי ניסיונות ועבודה.
- from: והבירור זה גם בשולחן ערוך, עד שחיים לפי ההלכה.
  to: 'הבירור הוא גם בשולחן ערוך, בחיים על פי ההלכה:'
- from: ההלכה באה לנו, ובחוכמה אתבררו. חוכמה של התורה שבאה לברר את הניצוצות.
  to: ההלכה ניתנה לנו, ו"בחוכמה אתבררו", חוכמת התורה באה לברר את הניצוצות.
- from: ואז כשהסתיימו כל הבירורים של כל הניצוצות, ואז כבר יבוא המשיח, הוא ישחט את היצר הרע.
  to: וכשיסתיימו כל הבירורים של כל הניצוצות, יבוא המשיח וישחט את היצר הרע.
- from: אז זה כבר הסיום, הבירור של המ"ן תחילה. ואחר כך כבר בירור המ"ד.
  to: זהו סיום בירור המ"ן, שבא תחילה, ואחריו בא
- from: בירור המ"ד זה כבר גילוי מלמעלה. זה משיח ואליהו שבאים לברר את המ"ן, אבל בא לעשות בירור שני.
  to: 'בירור המ"ד, שהוא גילוי מלמעלה: משיח ואליהו באים לברר את המ"ן, בירור שני.'
- from: אז כבר נסתיימה עבודת הבירורים, כמו שהרבי הכריז בתשנ״א, של העובדה שהבירור של העולם, של האנושות, של התהליך נגמר. עכשיו יש את התהליך מלמעלה.
  to: 'עבודת הבירורים כבר נסתיימה, כמו שהרבי הכריז בתשנ״א: הבירור של העולם ושל האנושות נגמר, ועתה התהליך הוא מלמעלה.'
- from: כל התקופה מאז זה כבר הגילוי בהשגחה פרטית יותר ויותר מלמעלה למטה, כדי שיהיה את הייחוד, וזה עניין הגאולה ממש, של העליון והתחתון ביחד.
  to: כל התקופה מאז היא גילוי, בהשגחה פרטית, יותר ויותר מלמעלה למטה, כדי שיהיה ייחוד העליון והתחתון יחד, וזהו עניין הגאולה ממש.
- from: וכל זה, "מה שאין כן בלי העלאת מ"ן, אין כוח במ"ד לברר".
  to: 'וזהו: "מה שאין כן בלי העלאת מ"ן, אין כוח במ"ד לברר".'
- from: המ"ד לא יורד לברר עד שהמ"ן לא עושה את שלו. זו ההתחלה של הכל. הבן אדם מתפלל גם כשהוא לא רואה את התוצאה. האלוקות מתגלה לו בהשגחה פרטית לפי ערך התפילה שלו. ומה זה הגילוי הראשון לזה, שההשגחה הפרטית נותנת לו כוח בעצמו לברר את העניינים שלו?
  to: 'המ"ד אינו יורד לברר עד שהמ"ן עושה את שלו, וזו ההתחלה של הכל: האדם מתפלל גם כשאינו רואה את התוצאה, והאלוקות מתגלה לו בהשגחה פרטית לפי ערך תפילתו. הגילוי הראשון הוא שההשגחה הפרטית נותנת לו כוח לברר בעצמו את ענייניו, וזו גם התכלית.'
- from: וזה התכלית של זה גם. ובמשל זה עניין הגאולה.
  to: וזה משל לעניין הגאולה.
- from: אז מה זה הבירור של רפ"ח ניצוצות?
  to: בירור רפ"ח הניצוצות הוא
- from: גם מבחינה פרטית, שהאדם הולך ומתפתח עד שהוא קונה מוחין דגדלות, מבין מה טוב ורע, גם בדקות שבדקות, שלדוגמה לא ליהנות ממחמאה ולא לחפש את הכרת הסובבים, שזה כבר דרגות יותר גבוהות של להפריד הרע מן הטוב, זה עבודה פנימית. כמובן שבגיל שנתיים הוא לומד לא לדחוף וכולי. וגם כציוויליזציה, כאנושות, אנחנו גם כן הלכנו מעבודת קורבנות של להקריב בני אדם, חס ושלום, והעניין של לשפוך דם כמים, ולהגיע לדרגות של השגות, שמחפשים את העולם הטוב והמושלם.
  to: 'גם באדם הפרטי: האדם הולך ומתפתח עד שקונה מוחין דגדלות ומבין מהו טוב ומהו רע גם בדקות שבדקות, כגון שלא ליהנות ממחמאה ולא לחפש את הכרת הסובבים, שאלה כבר דרגות גבוהות של הפרדת הרע מן הטוב, עבודה פנימית; ואילו בגיל שנתיים הוא לומד שלא לדחוף. וכך גם האנושות כולה הלכה מעבודת קורבנות אדם, חס ושלום, ושפיכת דם כמים, עד לדרגות של השגה שבהן מחפשים את העולם הטוב והמושלם.'
- from: אבל סוף של הבירור הזה, זה מתי שהעולם כבר מוכן שיהיה פה גילוי אלוקות, ואז הקדוש ברוך הוא מתגלה מלמעלה, והאנושות כבר יש לה כלי להכיל את זה.
  to: 'וסוף הבירור הזה הוא כשהעולם כבר מוכן לגילוי אלוקות: אז הקדוש ברוך הוא מתגלה מלמעלה, ולאנושות כבר יש כלי להכיל את הגילוי.'
- from: כמו שהילד שלמד לא לדחוף, אחרי זה למד לעשות את הבירור היותר פנימי.
  to: 'כמו הילד שלמד שלא לדחוף, ואחר כך למד את הבירור הפנימי יותר:'
- from: כשמתגלה לו רוח הקודש, אז יש לו את הכלים להכיל את רוח הקודש, ועל זה התכלית, בשביל זה הוא נברא.
  to: כשמתגלה לו רוח הקודש, יש לו הכלים להכיל אותה, וזו התכלית שבשבילה נברא.
- from: 'וכל יום באותו דבר: בן אדם קם בבוקר, מתפלל על מה שהוא צריך, רואה השגחה פרטית כל היום, שמלאה את הכלים האלה, וההשגחה הפרטית נותנת לו לפעול בעולם כמו שצריך.'
  to: 'וכך בכל יום: אדם קם בבוקר ומתפלל על מה שהוא צריך, ורואה כל היום השגחה פרטית הממלאת את הכלים האלה ונותנת לו לפעול בעולם כראוי.'
- from: אבל הכל מתחיל עם ההתעוררות של התפילה, כי בלי זה, זה סתם בזבוז.
  to: אבל הכל מתחיל בהתעוררות התפילה, ובלעדיה הכל לשווא.
- from: וזה מה שאנחנו מדברים, שהגאולה עצמה, שאנחנו באמת בפתח של זה, כשכל הגילוי, דרך אגב, זה הייחוד, לראות מה נראה כשאנחנו קוראים השגחה פרטית. זה ייחוד והתכללות למטה.
  to: 'זו הגאולה עצמה, שאנחנו באמת בפתחה. כל הגילוי הוא הייחוד, הנראה במה שאנחנו קוראים השגחה פרטית: ייחוד והתכללות למטה.'
- from: כשרואים את ההשגחה העליונה למטה, זה עושה הרבה יותר קל.
  to: כשרואים את ההשגחה העליונה למטה, הכל נעשה קל הרבה יותר;
- from: כל השאלות עכשיו, והספקות, והדעות הכוזבות, זה בגלל שלא היה גילוי.
  to: כל השאלות, הספקות והדעות הכוזבות של ימינו הן משום שלא היה גילוי.
- from: כמו שכבר ידוע שבגלות השכינה מבית המקדש גם היה גלות הנבואה, וגלות של ההשגחה הפרטית.
  to: כידוע, עם גלות השכינה מבית המקדש באו גם גלות הנבואה וגלות ההשגחה הפרטית.
- from: ומלכות בית דוד זה השגחה פרטית, ומלכות רומי הרשעה זה בדיוק ההפך של זה, זה גלות השכינה, שאין השגחה עליונה.
  to: מלכות בית דוד היא השגחה פרטית, ומלכות רומי הרשעה היא בדיוק היפוכה, גלות השכינה, שאין בה השגחה עליונה.
- from: ולכן ההשגחה הפרטית, שזה כל החידוש של הבעל שם טוב הקדוש, שזה עניין של מלכות בית דוד, זה עניין שיהיה ייחוד והתכללות למטה —
  to: ולכן ההשגחה הפרטית, שהיא כל חידושו של הבעל שם טוב הקדוש ועניין מלכות בית דוד, היא שיהיה ייחוד והתכללות למטה,
- from: כמו שבאצילות ידוע זה "איהו וחיוהי וגרמוהי חד", והאורות והכלים שלו כולם אחד. כמו שהקדוש ברוך הוא, עצמות אינסוף, מתלבש ומתאחד עם האורות והאצילות והכלים דעולם האצילות, כמו שמובן בתניא באגרת הקודש פרק כ', למרות שאנחנו לא יכולים להבין את זה בשכל שלנו.
  to: 'כמו באצילות. כידוע, באצילות "איהו וחיוהי וגרמוהי חד": האורות והכלים כולם אחד, והקדוש ברוך הוא, עצמות אינסוף, מתלבש ומתאחד עם האורות והכלים דעולם האצילות, כמבואר בתניא באגרת הקודש פרק כ'', אף שאין אנו יכולים להבין זאת בשכלנו.'
- from: הגילוי הזה והאחדות הזה, גם פה למטה בעולם הזה יהיה הגשמי.
  to: הגילוי והאחדות האלה יהיו גם כאן למטה, בעולם הזה הגשמי.
- from: 'באמת, איך יש את הגילוי הזה שמאחד את האורות ואת הכלים באצילות, שהם בעצמם שני הפכים? זה גילוי שלמעלה משניהם. שזה פה אומר על עולם העקודים. זה אפשר להגיד בחינת שורש העולם הזה, בוא נגיד ככה:'
  to: ובאמת, הגילוי המאחד את האורות והכלים באצילות, שהם עצמם שני הפכים, הוא גילוי שלמעלה משניהם, וזה הנאמר כאן על עולם העקודים, שאפשר לומר שהוא בחינת שורש העולם הזה.
- from: עולם התיקון, שזה מהאצילות ולמטה, זה עולם התיקון.
  to: עולם התיקון הוא מהאצילות ולמטה.
- from: עולם התוהו זה בשורשים של למעלה מעולם התיקון, זה בעולם הנקודים, שהוא בין האצילות והעולם העקודים.
  to: עולם התוהו הוא בשורשים שלמעלה מעולם התיקון, בעולם הנקודים, שבין האצילות לעולם העקודים.
- from: אז האצילות זה כבר עולם התיקון; עולם הנקודים, שזה שם היה שבירה, זה האורות דה תוהו שנפלו, וכל הבירור של התיקון הוא של התיקון של האורות דה תוהו בכלים דה תיקון. כשנשלם הגילוי הזה מתגלה הדרגה השלישית, שזה עולם העקודים.
  to: בעולם הנקודים הייתה השבירה, ושם נפלו האורות דתוהו, וכל הבירור הוא תיקון האורות דתוהו בכלים דתיקון. כשנשלם התיקון הזה, מתגלה הדרגה השלישית, עולם העקודים.
- from: כל האריכות הזה זה בשורת הגאולה של הרבי מתשנ״א, שאומר שכבר נסתיימה עבודת הבירורים, ויש כבר את הגילוי של פנימיות עתיק, שזה ממש רוחו של המשיח. וזה כבר יש מתשנ״א, וכל העבודה מאז זה רק שזה מתאחד ביחד עם העולם, זה הבירור שני כמו שאמרנו.
  to: 'כל זה הוא בשורת הגאולה של הרבי מתשנ״א: כבר נסתיימה עבודת הבירורים, ויש כבר גילוי פנימיות עתיק, שהוא ממש רוחו של משיח, וכל העבודה מאז היא רק שהגילוי יתאחד עם העולם, וזהו הבירור השני.'
- from: הנה השורש, ופה הוא אומר שהעניין של הגילוי של מעלה מתוהו ותיקון, שמתגלה אחרי שיש את הגילוי של האורות דה תוהו, של עולם הנקודים, בכלים דה תיקון מעולם האצילות, בריאה, יצירה ועשייה ועד עולם הזה התחתון, עד שנסתיימה עבודה של הרפ"ח ניצוצות, גם בעולם הפרטי וגם באדם הכללי, אז בא הגילוי של המשיח, שזו הגילוי של העקודים, שהוא למעלה מהתהליך של תוהו ותיקון, וזה נקרא פנימיות עתיק.
  to: 'זהו השורש, וכאן מבואר שהגילוי שלמעלה מתוהו ותיקון מתגלה אחרי גילוי האורות דתוהו, של עולם הנקודים, בכלים דתיקון: מעולם האצילות, דרך בריאה, יצירה ועשייה, ועד העולם הזה התחתון. כשנסתיימה עבודת רפ"ח הניצוצות, גם בעולם הפרטי וגם באדם הכללי, בא גילוי המשיח, גילוי העקודים שלמעלה מהתהליך של תוהו ותיקון, הנקרא פנימיות עתיק.'
- from: 'שם יש חמישה מאמרים של הרבי, שזה הגילוי של נ״א, של מה זה בדיוק פנימיות העתיק. וזה העלייה השביעית של ספירת המלכות. בקצרה, הגילוי של פנימיות העתיק זה גילוי שורש ספירת המלכות בפנימיות העתיק. שכל העליות, גם בית המקדש הראשון בימי שלמה המלך, היה רק גילוי אורות שנחסרו במלכות. שזה העניין, חמישה אורות שנחסרו ממנה עד לחיצוניות העתיק. זה החמישה פרצופים של האצילות:'
  to: 'על כך יש חמישה מאמרים של הרבי, גילוי שנת נ״א, המבארים מהי בדיוק פנימיות עתיק: זו העלייה השביעית של ספירת המלכות, גילוי שורש ספירת המלכות בפנימיות עתיק. כל העליות, גם בבית המקדש הראשון בימי שלמה המלך, היו רק גילוי אורות שנחסרו מהמלכות, חמישה אורות, עד חיצוניות עתיק. אלה חמשת הפרצופים של האצילות:'
- from: נותנים אותה למלכות, אז אפשר גם לקחת אותה ממנה, וזה כל העליות והירידות שהיו תמיד מבריאת העולם.
  to: מה שנותנים למלכות אפשר גם לקחת ממנה, ומכאן כל העליות והירידות שהיו מאז בריאת העולם.
- from: אבל פנימיות עתיק זה שורש המלכות שמתגלה באינסוף. תסתכלו במאמרים של "תפילה למשה" ו"פדה בשלום נפשי".
  to: אבל פנימיות עתיק היא שורש המלכות שמתגלה באינסוף; ראה המאמרים "תפילה למשה" ו"פדה בשלום נפשי".
- from: וזה העניין שפנימיות עתיק, שהוא מתגלה, מתגלה את שורש המלכות עצמה, וזה אי אפשר לקחת ממנה אף פעם, כי זה לא משהו שמתווסף לזה, הוא מגלה מי שהיא בעצמה.
  to: כשהיא מתגלה, היא מגלה את שורש המלכות עצמה, ואת זה אי אפשר לקחת ממנה לעולם, כי אין זה דבר שמתווסף לה, אלא גילוי של מי שהיא בעצמה.
- from: וזה מה שארץ, וזה "אמת מארץ תצמח", ו"אבן מקיר תזעק", כשהחומר עצמו בעצמו מגלה לך את השורש שלו. זה כאילו שמסירים את המסכה, ורואים איך שהעולם הזה באמת הוא בעצמו הגילוי של העולם העליון.
  to: 'וזו הארץ: "אמת מארץ תצמח", ו"אבן מקיר תזעק": החומר עצמו מגלה את שורשו, כהסרת מסכה, ורואים שהעולם הזה הוא עצמו גילוי העולם העליון.'
- from: הנשמות החדשות האלה כבר נשמות בדורנו, "שאין בהן בחינת בירור", שלא באו לברר, דרך אגב, אלא באו לגלות את הבחינה הזאת. נפקא מינה עצומה מעת תשנ״א וכל הבשורות הגאולה.
  to: 'הנשמות החדשות האלה הן כבר הנשמות שבדורנו, "שאין בהן בחינת בירור": הן לא באו לברר אלא לגלות את הבחינה הזאת. זו נפקא מינה עצומה מאז תשנ״א ובשורות הגאולה.'
- from: 'נמשיך עוד קצת:'
  to: 'וממשיך:'
- from: 'מה שאמרנו קודם על ספירת המלכות, זאת אומרת: מלכות היא כנסת ישראל, היא שורש כל הנשמות של ישראל. מה זה המלכות? אז תמיד הנשמות ירדו, שנכללו באדם הראשון, הם הצליחו להתברר אחרי זה את כל הבירור של רפ"ח ניצוצות, של כולנו, זה חיצוניות העתיק.'
  to: 'וזה העניין שנתבאר לעיל בספירת המלכות: המלכות היא כנסת ישראל, שורש כל נשמות ישראל. הנשמות שנכללו באדם הראשון ירדו תמיד, והתבררו אחר כך בכל הבירור של רפ"ח הניצוצות, של כולנו; זו חיצוניות עתיק.'
- from: אבל הפנימיות העתיק, הנשמות של פנימיות העתיק, הנשמות החדשות, כמו שאמרנו פה, הם תמיד היו אחדים עם העצמות אין סוף.
  to: אבל הנשמות של פנימיות עתיק, הנשמות החדשות, היו תמיד אחת עם עצמות אין סוף.
- from: לכן הנשמות בדורנו, יש להם אחדות עם השם, שאי אפשר לקחת את זה מהם.
  to: לכן לנשמות שבדורנו יש אחדות עם השם שאי אפשר לקחת מהן,
- from: כי זה נשמות שלא היו בחטא אדם הראשון, זה נשמות שכל העניין שלהם פה, זה שהם מגלים שהמלכות, שזה נשמות ישראל, והקדוש ברוך הוא הם אחד, על ידי התורה. וזה הנשמות של דור הגאולה שאנחנו רואים.
  to: כי הן לא היו בחטא אדם הראשון. כל עניינן כאן הוא לגלות, על ידי התורה, שהמלכות, נשמות ישראל, והקדוש ברוך הוא אחד הם. אלה הנשמות של דור הגאולה, שאנחנו רואים.
- from: 'אז הם ירדו:'
  to: ''
- from: הוא לא בא ומתלבש בגילויים שמסתירים אלוקות.
  to: כלומר, אינו מתלבש בגילויים שמסתירים אלוקות.
- from: בחיצוניות העתיק הוא יכול להתלבש באריך, ואריך מסתיר את העתיק, והפרצופים של אבא ואמא מסתירים את אריך, עד זעיר אנפין מלביש ומסתיר את הפרצופים שלמעלה, עד שפרצוף נוקבא מסתיר את הכל ונותן מקום למציאות של עולם שיש, ופה האלוקות מסתתרת.
  to: חיצוניות עתיק מתלבשת באריך, ואריך מסתיר את עתיק; פרצופי אבא ואמא מסתירים את אריך, זעיר אנפין מלביש ומסתיר את הפרצופים שלמעלה ממנו, עד שפרצוף נוקבא מסתיר את הכל ונותן מקום למציאות של עולם שהוא יש, ושם האלוקות מסתתרת.
- from: אמרנו שבגאולה זה התעוררות מלמעלה, שהקדוש ברוך הוא בכבודו ובעצמו מגלה את עצמו ומגלה את, הוא פותח את כל המסכים, וזה מתגלה בנשמות ישראל פה למטה, שאתה מרגיש שהיהודי שפה לידך זה עצמות אינסוף בגוף.
  to: 'בגאולה, כאמור, ההתעוררות היא מלמעלה: הקדוש ברוך הוא בכבודו ובעצמו מגלה את עצמו ופותח את כל המסכים, וזה מתגלה בנשמות ישראל כאן למטה, עד שמרגישים שהיהודי שלידך הוא עצמות אינסוף בגוף.'
- from: וזה שיש מציאות שלמטה זה לא סתירה, בזה שהיהודי הזה עם הבחירה החופשית עצמו, הנשמה שלו מאירה בגלוי את האלוקות.
  to: 'וקיומה של המציאות שלמטה אינו סתירה לכך: היהודי הזה, בעל הבחירה החופשית, נשמתו מאירה בגלוי את האלוקות.'
- from: וזה הדרך בעל שם טוב, שהנשמה שלו רואה מסוף העולם ועד סופו, כאדם הראשון. אבל כל אחד הוא ככה.
  to: וזו דרך הבעל שם טוב, שנשמתו רואה מסוף העולם ועד סופו, כאדם הראשון; ובאמת כך הוא כל אחד.
- from: '"והפנימיות העליון אינו יורד ומשתלשל כלל", מה שאין כן, כמובן, בנשמות של סדר השתלשלות שמסתתר, אז תמיד הפנימיות נשאר מוסתר. הנקודה פה גם כן: אומרים שהקדוש ברוך הוא מתגלה על ידי גילוי של פנימיות התורה.'
  to: '"והפנימיות העליון אינו יורד ומשתלשל כלל", מה שאין כן בנשמות של סדר ההשתלשלות, שבו הפנימיות נשארת תמיד מוסתרת. ועוד: הקדוש ברוך הוא מתגלה על ידי גילוי פנימיות התורה.'
- from: כשמגלים את פנימיות התורה, זה מגלה את הקדוש ברוך הוא.
