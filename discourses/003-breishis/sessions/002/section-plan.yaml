- from: 'מה שאמרנו קודם על ספירת המלכות, זאת אומרת: מלכות היא כנסת ישראל, היא שורש כל הנשמות של ישראל. מה זה המלכות? אז תמיד הנשמות ירדו, שנכללו באדם הראשון, הם הצליחו להתברר אחרי זה את כל הבירור של רפ"ח ניצוצות, של כולנו, זה חיצוניות העתיק.'
  to: 'וזה מה שאמרנו קודם על ספירת המלכות: המלכות היא כנסת ישראל, שורש כל נשמות ישראל. הנשמות שנכללו באדם הראשון ירדו תמיד, והן התבררו אחר כך בכל הבירור של רפ"ח הניצוצות, של כולנו: זו חיצוניות עתיק.'
- from: אבל הפנימיות העתיק, הנשמות של פנימיות העתיק, הנשמות החדשות, כמו שאמרנו פה, הם תמיד היו אחדים עם העצמות אין סוף. לכן הנשמות בדורנו, יש להם אחדות עם השם, שאי אפשר לקחת את זה מהם. כי זה נשמות שלא היו בחטא אדם הראשון, זה נשמות שכל העניין שלהם פה, זה שהם מגלים שהמלכות, שזה נשמות ישראל, והקדוש ברוך הוא הם אחד, על ידי התורה. וזה הנשמות של דור הגאולה שאנחנו רואים.
  to: אבל הנשמות של פנימיות עתיק, הנשמות החדשות שאמרנו, תמיד היו אחת עם עצמות אין סוף. לכן לנשמות שבדורנו יש אחדות עם השם שאי אפשר לקחת מהן, כי הן לא היו בחטא אדם הראשון. כל עניינן כאן הוא לגלות, על ידי התורה, שהמלכות, נשמות ישראל, והקדוש ברוך הוא אחד הם. אלה הנשמות של דור הגאולה, שאנחנו רואים.
