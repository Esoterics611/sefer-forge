- from: כשהחומר עצמו בעצמו מגלה לך את השורש שלו. זה כאילו שמסירים את המסכה, ורואים איך שהעולם הזה באמת הוא בעצמו הגילוי של העולם העליון.
  to: 'כשהחומר עצמו מגלה את שורשו. כמו הסרת מסכה: רואים שהעולם הזה הוא עצמו גילוי העולם העליון.'
