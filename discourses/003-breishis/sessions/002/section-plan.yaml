- from: 'כשאנחנו מדברים על גילוי אלוקות, זה שהתורה היא גם כן לבושים של הקדוש ברוך הוא, והקדוש ברוך הוא והתורה היא אחד. על ידי זה נשמות ישראל מבחינת המלכות — איך אנחנו מגלים את הקשר שלנו עם הקדוש ברוך הוא? על ידי שלושה קשרים:'
  to: 'גילוי האלוקות שאנחנו מדברים עליו הוא שהתורה היא גם כן לבושים של הקדוש ברוך הוא, והקדוש ברוך הוא והתורה אחד הם. ונשמות ישראל, בחינת המלכות, מגלות את הקשר שלנו עם הקדוש ברוך הוא על ידי שלושה קשרים:'
- from: ובבחינת פנימיות התורה, שבעיקר שעוסקים בעניין הלבושים, זה מגלה את הקדוש ברוך הוא מלבושים שלו, ובעצם הלימוד הזה הוא מגלה את הקדוש ברוך הוא בעולם. ומה זה מדברים פה מבחינת הקדוש ברוך הוא, מבחינת, נגיד, האינסוף? הוא מרומז פה בעולם העקודים, שהוא למעלה מהתהליך של תוהו ותיקון. ולכן כשנסתיימה עבודת הבירורים, ויש את האורות דה תוהו בכלים דה תיקון,
  to: ופנימיות התורה, שעוסקת בעיקר בעניין הלבושים, מגלה את הקדוש ברוך הוא מתוך לבושיו, ועצם הלימוד הזה מגלה את הקדוש ברוך הוא בעולם. ומה שמדובר כאן בבחינת הקדוש ברוך הוא, בחינת האינסוף, מרומז בעולם העקודים, שלמעלה מהתהליך של תוהו ותיקון. ולכן כשנסתיימה עבודת הבירורים, ויש אורות דתוהו בכלים דתיקון,
- from: העניין של החוכמה כמו שהיא באינסוף לפני שירדה לעולם התיקון, זה עניין העקודים. הוא גם למעלה מהמקום שהיה בו שבירה, אלא ממש זה בחינה שאפשר לומר לפני הצמצום. ויש להסתכל באמת בעץ חיים באריכות, לראות מה בחינת העקודים, ואיפה היא לפני הצמצום ואחרי הצמצום, ואין כאן מקום לבאר.
  to: החוכמה כפי שהיא באינסוף, לפני שירדה לעולם התיקון, היא עניין העקודים. היא גם למעלה מהמקום שהייתה בו השבירה, בחינה שאפשר לומר שהיא לפני הצמצום. ויש לעיין באריכות בעץ חיים, לראות מהי בחינת העקודים ואיפה היא לפני הצמצום ואחריו; ואין כאן מקום לבאר.
- from: אז זה גילוי שפנימיות עתיק, זה השמיים החדשים
  to: גילוי פנימיות עתיק הוא השמיים החדשים
