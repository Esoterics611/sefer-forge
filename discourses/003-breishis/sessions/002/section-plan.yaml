# Style pass (prompts/style-pass.md): the spoken explanation as written Hebrew.
# Applied after `edits:`; the readings in quotation marks are untouched.
style:
- from: מסבירים את עניין שמיים וארץ. עוד פעם, מאמר בראשית הוא מאמר של הקדמה לכל תורת החסידות.
  to: כאן מתבאר עניין שמיים וארץ. מאמר בראשית הוא הקדמה לכל תורת החסידות.
- from: שמיים זה הבחינות של למעלה מזמן ומקום, עניינים מה שנקרא עליונים.
  to: שמיים הם הבחינות שלמעלה מזמן ומקום, מה שנקרא עניינים עליונים.
- from: הארץ זה עולם הגשמי והחומרי של זמן ומקום, שזה כל היקום שאנחנו מכירים ויכולים לחשוב עליו.
  to: הארץ היא העולם הגשמי והחומרי של זמן ומקום, כל היקום שאנחנו מכירים ויכולים לחשוב עליו.
- from: שגם המחשבה בעניינים גשמיים שלנו היא מתחת לזמן ומקום, וגם התורה שאנחנו לומדים, שהיא עם כבש ופרה ובור וחמור, יש גשמיים, שזה הכל בעולם שמתחת לזמן ומקום, ורומזת בעליונים, שזה בשמיים.
  to: גם המחשבה שלנו בעניינים גשמיים היא מתחת לזמן ומקום, וגם התורה שאנחנו לומדים, העוסקת בכבש ופרה ובור וחמור, בעניינים גשמיים שבעולם שמתחת לזמן ומקום, רומזת לעליונים, לשמיים.
- from: 'ככה גם שמיים וארץ: העניינים הארציים שלנו, של הגוף, נפש הבהמית, של החיות שלנו,'
  to: 'כך גם שמיים וארץ: העניינים הארציים שלנו הם עניני הגוף, הנפש הבהמית והחיות שלנו,'
- from: אז זה העניין של התפילה, שעל זה מתפללים, שזה העניינים הארציים, והתפילה שלנו פועלת בעולמות של למעלה מזמן ומקום. ולכן אי אפשר להרגיש את זה, לשמוע את זה,
  to: על העניינים הארציים האלה מתפללים, והתפילה שלנו פועלת בעולמות שלמעלה מזמן ומקום. לכן אי אפשר להרגיש ולשמוע את פעולתה,
- from: לכן כל מה שקורה בארץ הזה, כל הברכות שמתגלות פה בזמן ומקום בגשמיות, השורש שלהם זה בעולמות של למעלה ברוחניות.
  to: לכן כל מה שקורה בארץ, כל הברכות שמתגלות כאן בזמן ומקום בגשמיות, שורשן בעולמות העליונים, ברוחניות.
- from: זה עניין של הרצוא ושוב בתפילה. עכשיו מבאר את זה בפרק הזה,
  to: זהו עניין הרצוא ושוב בתפילה, וזה מה שמבואר בפרק הזה,
- from: שקודם מתפללים, שזה הארץ, שסוף מעשה במחשבה תחילה, למרות שהארץ, מה שקורה בארץ, זה תוצאה של מה שבשורש כבר מתהווה בשמיים.
  to: קודם מתפללים, וזו הארץ, ש"סוף מעשה במחשבה תחילה", אף על פי שמה שקורה בארץ הוא תוצאה של מה שכבר מתהווה בשורשו בשמיים.
- from: לכן השמיים קדמו לארץ, שיש את השמיים ואת הארץ. הארץ קדמה העניין, שמה שהעניינים בשמיים זה בשביל שזה יהיה ככה בארץ.
  to: מצד זה השמיים קדמו לארץ. אבל הארץ קודמת בעניין, שהעניינים שבשמיים הם בשביל שכך יהיה בארץ.
- from: וממילא זה העניין של התפילה, שהתפילה בארץ פועלת כביכול, לא כביכול, פועלת עניינים חדשים בשמיים, שזה משפיעים את הברכה בארץ.
  to: 'וזהו עניין התפילה: התפילה בארץ פועלת באמת עניינים חדשים בשמיים, והם משפיעים את הברכה בארץ.'
- from: זה מסביר שהעניין של מים נוקבים, שזה ההתעוררות מלמטה — כידוע שבקבלה
  to: כאן מבואר שמים נוקבים הם ההתעוררות מלמטה. כידוע, בקבלה
- from: והזכר זה הבחינה מלמעלה, השפעה מעולמות העליונים לתחתונים.
  to: והזכר הוא הבחינה שמלמעלה, ההשפעה מהעולמות העליונים לתחתונים.
- from: 'אז פה יש למטה מעורר: כשיש את ההתעוררות מלמטה, כשבני אדם מתפללים פה למטה, זה מעורר את ההתעוררות שבאה מלמעלה.'
  to: 'בזה התחתון מעורר: כשבני אדם מתפללים כאן למטה, ההתעוררות מלמטה מעוררת את ההתעוררות שבאה מלמעלה.'
- from: ועכשיו הוא מביא לכך שהשמיים מבחינת משפיעים, הוא מביא מזה כמה פסוקים, שזה נקרא השפעת המים דוכרים.
  to: ולכך שהשמיים הם בבחינת משפיעים, שזו השפעת המים דוכרים, הוא מביא כמה פסוקים.
- from: 'עכשיו נגיד בקצרה: יש שתי בחינות בתהליך הזה. שזה התעוררות המים נוקבים, זה נקרא העלאת מ"ן, מים נוקבים בלשון הקבלה:'
  to: 'בקצרה, יש בתהליך הזה שתי בחינות. הראשונה היא התעוררות המים נוקבים, שנקראת בלשון הקבלה העלאת מ"ן:'
- from: כל הדברים הטובים, כל המעשים הטובים שעושים בעולם הזה — זה ההתעוררות מלמטה, זה נקרא העלאת מ"ן, מים נוקבים.
  to: כל המעשים הטובים שעושים בעולם הזה. זו ההתעוררות מלמטה, העלאת מ"ן.
- from: ולפי ערך העלאת המ"ן, כך יש את המשכת המ"ד, המים דוכרים, שזה השפעה שבאה מלמעלה, לפי ערך ההתעוררות מלמטה.
  to: ולפי ערך העלאת המ"ן נמשכים המ"ד, המים דוכרים, ההשפעה שבאה מלמעלה.
- from: 'לכן כל מה שאדם עושה בעולם הזה, חוזר אליו ככה אלף פעמים יותר חזק: עושה טוב, מקבל אלף פעמים טוב,'
  to: 'לכן כל מה שאדם עושה בעולם הזה חוזר אליו חזק פי אלף: העושה טוב מקבל טוב פי אלף,'
- from: התכלית של כל היום, שמעלה את כל התורה והמצוות של כל היום, של העבודה של האדם, זה התפילה, שהיא ממש מכוונת ופועלת את ההתעוררות של המים נוקבים מלמטה.
  to: תכלית היום, המעלה את כל התורה והמצוות ואת כל עבודת האדם של היום, היא התפילה, שמכוונת ופועלת את התעוררות המים נוקבים מלמטה.
- from: 'השלב השני, זה נקרא לפעמים בירור שני דמ"ד: כשיש את המים דוכרים שיורדים מלמעלה למטה. כמו שיש תפילה, ויהודי מבקש מעומק ליבו,'
  to: 'השלב השני נקרא לפעמים בירור שני דמ"ד: המים דוכרים יורדים מלמעלה למטה. יהודי מתפלל ומבקש מעומק ליבו,'
- from: 'שיורדת לעולם — היה הבירור הראשון. הבירור השני זה שעל ידי ההשפעה מלמעלה זה מברר את הלמטה בירור שני: כמו שיהודי מקבל את מה שהוא התפלל עליו, ואחרי זה רואה את הברכה, וזה מביא כבר לדרגה חדשה למעלה.'
  to: 'שיורדת לעולם: זה הבירור הראשון. הבירור השני הוא שההשפעה מלמעלה מבררת את התחתון: היהודי מקבל את מה שהתפלל עליו, רואה את הברכה, וזה כבר מביא לדרגה חדשה למעלה.'
- from: יש את הרצון מלמטה, כמו שהוא כבר מקבל את המילוי מלמעלה. הייחוד הזה, זה כבר נקרא הבירור שני דמ"ד.
  to: הרצון שמלמטה מקבל את מילויו מלמעלה, והייחוד הזה נקרא הבירור השני דמ"ד.
- from: 'בלשון הגאולה, לדוגמה: יש את העבודה מלמטה, מבקשים את הגאולה, פועלים כמה שאפשר מלמטה. הקדוש ברוך הוא מביא'
  to: 'לדוגמה, בעניין הגאולה: יש העבודה מלמטה, מבקשים את הגאולה ופועלים כמה שאפשר מלמטה, והקדוש ברוך הוא מביא'
- from: 'ואז יש את השלב השלישי, שיש את הגאולה, ביחד עם הרצון לגאולה, שזה כאילו משלים את כל הבחינה למטה. זה הרצון, שזה באמת, העולם עצמו השתנה. סליחה, זה העניין: הבירור השני של המ"ד זה שהמים נוקביים משתנים.'
  to: 'ואז, יחד עם הרצון לגאולה, הגאולה משלימה את כל הבחינה למטה, עד שהעולם עצמו השתנה. זהו הבירור השני של המ"ד: המים נוקבים עצמם משתנים.'
- from: בעניין של הגאולה, זה אומר מתי שיש כבר ניסים ונפלאות, שהגשמי עצמו, הזמן ומקום, מגלה בגילוי את הלמעלה מזמן ומקום, את הנושא ההפכים הזה.
  to: 'בגאולה פירוש הדבר הוא שיש כבר ניסים ונפלאות: הגשמי עצמו, הזמן והמקום, מגלה בגלוי את שלמעלה מזמן ומקום, נושא ההפכים.'
