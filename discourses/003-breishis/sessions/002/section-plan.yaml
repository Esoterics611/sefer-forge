  to: האור החדש הוא מבחינת פנימיות עתיק, ו"תאיר" הוא מבחינת התורה, שהתורה של האור החדש היא תורת החסידות, פנימיות העניינים שמדובר בהם כאן.
- from: דרך אגב, זה גם המקור של תורת החסידות, מבחינת יחידה שבתורה.
  to: וזהו גם מקור תורת החסידות, בחינת יחידה שבתורה.
- from: שם יש כבר מקום ללמעלה או למטה, במילא הלמטה מסתיר והלמעלה מגלה או מוסתר.
  to: שם כבר יש מקום ללמעלה ולמטה, וממילא הלמטה מסתיר, והלמעלה מגלה או מוסתר.
- from: זה כל הסוד של הספירות, "חוכמה וחסד", כל אחד במדרגה שלו.
  to: וזהו כל סוד הספירות, "חוכמה וחסד", כל אחד במדרגה שלו.
- from: 'על זה רמז אליהו הנביא בתיקוני זוהר, במאמר של "אנת הוא חכים":'
  to: 'על זה רמז אליהו הנביא בתיקוני זוהר, במאמר "אנת הוא חכים":'
- from: 'שהחוכמה היא ידיעה שבעולם התיקון: כבר יש מקום לחוכמה ובינה וחסד, וחסד זה לא חוכמה וחוכמה זה לא חסד, רק שמתכללים ביחד.'
  to: 'החוכמה הידועה היא זו שבעולם התיקון: יש כבר מקום לחוכמה ובינה וחסד, וחסד אינו חוכמה וחוכמה אינה חסד, אלא שהם מתכללים יחד.'
- from: אבל החוכמה כמו שהיא בשורשה בעצמות אינסוף, ששם באמת באינסוף אין התחלה וסוף, הכל נהיה בשורש גולמי של העלם כזה, ששם היא לא ידיעה בתור חוכמה, למרות שכל החוכמה נמצאת, רק שהיא נכללת שם באינסוף.
  to: אבל החוכמה כפי שהיא בשורשה בעצמות אינסוף, ששם אין התחלה וסוף והכל בשורש גולמי של העלם, אינה ידועה כחוכמה, אף שכל החוכמה נמצאת שם, נכללת באינסוף.
- from: אבל עם כל זה, כל האינסוף הזה מתלבש בתוך החוכמה. וזה סוד, שורש סדר ההשתלשלות של עולם התיקון.
  to: ועם כל זה, האינסוף כולו מתלבש בתוך החוכמה, וזהו הסוד, שורש סדר ההשתלשלות של עולם התיקון.
- from: הכל עצמות אינסוף, מי שמתלבש בכל הבחינות למטה.
  to: הכל עצמות אינסוף, המתלבש בכל הבחינות שלמטה.
