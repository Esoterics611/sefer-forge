  to: 'במאמר "אנת הוא חכים":'
- from: 'שהחוכמה היא ידיעה שבעולם התיקון: כבר יש מקום לחוכמה ובינה וחסד, וחסד זה לא חוכמה וחוכמה זה לא חסד, רק שמתכללים ביחד. אבל החוכמה כמו שהיא בשורשה בעצמות אינסוף, ששם באמת באינסוף אין התחלה וסוף, הכל נהיה בשורש גולמי של העלם כזה, ששם היא לא ידיעה בתור חוכמה, למרות שכל החוכמה נמצאת, רק שהיא נכללת שם באינסוף.'
  to: 'החוכמה היא ידיעה שבעולם התיקון: יש כבר מקום לחוכמה ובינה וחסד, וחסד אינו חוכמה וחוכמה אינה חסד, אלא שהם מתכללים יחד. אבל החוכמה כפי שהיא בשורשה בעצמות אינסוף, ששם אין התחלה וסוף והכל בשורש גולמי של העלם, אינה ידיעה בתור חוכמה, אף שכל החוכמה נמצאת שם, נכללת באינסוף.'
