- from: מראה לנו את כל הלבושים של אור אין סוף.
  to: מראה כאן את כל הלבושים של אור אין סוף.
- from: כשאנחנו מדברים על גילוי אלוקות, זה שהתורה היא גם כן לבושים של הקדוש ברוך הוא, והקדוש ברוך הוא והתורה היא אחד. על ידי זה נשמות ישראל מבחינת המלכות — איך אנחנו מגלים את הקשר שלנו עם הקדוש ברוך הוא?
  to: גילוי האלוקות שבו מדובר הוא שהתורה היא גם כן לבושים של הקדוש ברוך הוא, והקדוש ברוך הוא והתורה אחד הם. ונשמות ישראל, בחינת המלכות, מגלות את הקשר שלנו עם הקדוש ברוך הוא
- from: ובבחינת פנימיות התורה, שבעיקר שעוסקים בעניין הלבושים, זה מגלה את הקדוש ברוך הוא מלבושים שלו, ובעצם הלימוד הזה הוא מגלה את הקדוש ברוך הוא בעולם.
  to: ופנימיות התורה, שעוסקת בעיקר בעניין הלבושים, מגלה את הקדוש ברוך הוא מתוך לבושיו, ועצם הלימוד הזה מגלה את הקדוש ברוך הוא בעולם.
- from: ומה זה מדברים פה מבחינת הקדוש ברוך הוא, מבחינת, נגיד, האינסוף? הוא מרומז פה בעולם העקודים, שהוא למעלה מהתהליך של תוהו ותיקון.
  to: ומה שמדובר כאן בבחינת הקדוש ברוך הוא, בחינת האינסוף, מרומז בעולם העקודים, שלמעלה מהתהליך של תוהו ותיקון.
- from: ולכן כשנסתיימה עבודת הבירורים, ויש את האורות דה תוהו בכלים דה תיקון, מתגלה על ידי זה הדרגה שלמעלה משניהם, עולם העקודים.
  to: ולכן כשנסתיימה עבודת הבירורים, ויש אורות דתוהו בכלים דתיקון, מתגלה על ידי כך הדרגה שלמעלה משניהם, עולם העקודים.
- from: '"עולם העקודים הוא התכללות כל הכוחות כל הבחינות ועקוד בכלי אחד", כמו שאמרנו למעלה, "אנת הוא חכים ולא בחוכמה ידיעא".'
  to: '"עולם העקודים הוא התכללות כל הכוחות כל הבחינות ועקוד בכלי אחד", כנזכר לעיל, "אנת הוא חכים ולא בחוכמה ידיעא".'
- from: העניין של החוכמה כמו שהיא באינסוף לפני שירדה לעולם התיקון, זה עניין העקודים.
  to: החוכמה כפי שהיא באינסוף, לפני שירדה לעולם התיקון, היא עניין העקודים.
- from: הוא גם למעלה מהמקום שהיה בו שבירה, אלא ממש זה בחינה שאפשר לומר לפני הצמצום.
  to: היא גם למעלה מהמקום שהייתה בו השבירה, בחינה שאפשר לומר שהיא לפני הצמצום.
- from: ויש להסתכל באמת בעץ חיים באריכות, לראות מה בחינת העקודים, ואיפה היא לפני הצמצום ואחרי הצמצום, ואין כאן מקום לבאר.
  to: ויש לעיין באריכות בעץ חיים מהי בחינת העקודים ומקומה לפני הצמצום ואחריו, ואין כאן מקום להאריך.
- from: אז זה גילוי שפנימיות עתיק, זה השמיים החדשים —
  to: גילוי פנימיות עתיק הוא השמיים החדשים —
