  - label: גילוי עולם העקודים לעתיד לבוא
    quote: הנה התכלית הוא שיאיר ויתנוצץ גילוי אור עולם העקודים שלמעלה מעולם האצי'
  - label: נשמות חדשות
    quote: ואז יהי' התנוצצות נשמות חדשות שאין בהם בחי' בירור
  - label: פנימיות עליון אינו משתלשל
    quote: אבל פנימי' עליון אינו יורד ומשתלשל כלל
  - label: אנת הוא חכים ולא בחכמה ידיעא
    quote: כמאמר אנת הוא חכים אלא ולא בחכמה ידיעא שנמשך אור א"ס בחכמה
  - label: שמים חדשים וארץ חדשה
    quote: וגילוי זה נקרא שמים חדשים וארץ חדשה אשר אני עושה


