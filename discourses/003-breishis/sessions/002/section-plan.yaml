- from: אז צריך להיות קודם כל הבירור של המ"ן. זה כמו שאומרים שהמשיח בא אחרי הבירור של כל רפ"ח ניצוצים, של כל העניינים של העולם הזה, שנפלו בגלות, והבירור שלהם זה היה על ניסיונות ועבודה.
  to: קודם צריך להיות בירור המ"ן. כך אומרים שהמשיח בא אחרי בירור כל רפ"ח הניצוצות, כל העניינים של העולם הזה שנפלו בגלות, ובירורם הוא על ידי ניסיונות ועבודה.
- from: והבירור זה גם בשולחן ערוך, עד שחיים לפי ההלכה. ההלכה באה לנו, ובחוכמה אתבררו. חוכמה של התורה שבאה לברר את הניצוצות.
  to: 'הבירור הוא גם בשולחן ערוך, כשחיים לפי ההלכה: ההלכה ניתנה לנו, ו"בחוכמה אתבררו", חוכמת התורה באה לברר את הניצוצות.'
- from: ואז כשהסתיימו כל הבירורים של כל הניצוצות, ואז כבר יבוא המשיח, הוא ישחט את היצר הרע. אז זה כבר הסיום, הבירור של המ"ן תחילה. ואחר כך כבר בירור המ"ד. בירור המ"ד זה כבר גילוי מלמעלה. זה משיח ואליהו שבאים לברר את המ"ן, אבל בא לעשות בירור שני.
  to: 'וכשמסתיימים כל הבירורים של כל הניצוצות, יבוא המשיח וישחט את היצר הרע. זה סיום בירור המ"ן, שבא תחילה, ואחר כך בא בירור המ"ד. בירור המ"ד הוא גילוי מלמעלה: משיח ואליהו באים לברר את המ"ן, בירור שני.'
- from: אז כבר נסתיימה עבודת הבירורים, כמו שהרבי הכריז בתשנ״א, של העובדה שהבירור של העולם, של האנושות, של התהליך נגמר. עכשיו יש את התהליך מלמעלה. כל התקופה מאז זה כבר הגילוי בהשגחה פרטית יותר ויותר מלמעלה למטה, כדי שיהיה את הייחוד, וזה עניין הגאולה ממש, של העליון והתחתון ביחד.
  to: 'עבודת הבירורים כבר נסתיימה, כמו שהרבי הכריז בתשנ״א: הבירור של העולם ושל האנושות נגמר, ועכשיו התהליך הוא מלמעלה. כל התקופה מאז היא גילוי, בהשגחה פרטית, יותר ויותר מלמעלה למטה, כדי שיהיה הייחוד של העליון והתחתון יחד, וזה עניין הגאולה ממש.'
- from: המ"ד לא יורד לברר עד שהמ"ן לא עושה את שלו. זו ההתחלה של הכל. הבן אדם מתפלל גם כשהוא לא רואה את התוצאה. האלוקות מתגלה לו בהשגחה פרטית לפי ערך התפילה שלו. ומה זה הגילוי הראשון לזה, שההשגחה הפרטית נותנת לו כוח בעצמו לברר את העניינים שלו? וזה התכלית של זה גם. ובמשל זה עניין הגאולה.
  to: המ"ד אינו יורד לברר עד שהמ"ן עושה את שלו; זו ההתחלה של הכל. האדם מתפלל גם כשאינו רואה את התוצאה, והאלוקות מתגלה לו בהשגחה פרטית לפי ערך תפילתו. והגילוי הראשון של זה הוא שההשגחה הפרטית נותנת לו כוח לברר בעצמו את ענייניו, וזו גם התכלית. ובמשל, זה עניין הגאולה.
- from: וכל זה, "מה שאין כן בלי העלאת
  to: 'וזהו: "מה שאין כן בלי העלאת'
- from: אז מה זה הבירור של רפ"ח ניצוצות? גם מבחינה פרטית, שהאדם הולך ומתפתח עד שהוא קונה מוחין דגדלות, מבין מה טוב ורע, גם בדקות שבדקות, שלדוגמה לא ליהנות ממחמאה ולא לחפש את הכרת הסובבים, שזה כבר דרגות יותר גבוהות של להפריד הרע מן הטוב, זה עבודה פנימית. כמובן שבגיל שנתיים הוא לומד לא לדחוף וכולי.
  to: 'ומהו בירור רפ"ח הניצוצות? גם באדם הפרטי: האדם הולך ומתפתח עד שקונה מוחין דגדלות ומבין מהו טוב ומהו רע גם בדקות שבדקות, למשל לא ליהנות ממחמאה ולא לחפש את הכרת הסובבים, שאלה כבר דרגות גבוהות של הפרדת הרע מן הטוב, עבודה פנימית; ובגיל שנתיים הוא לומד לא לדחוף וכולי.'
- from: וגם כציוויליזציה, כאנושות, אנחנו גם כן הלכנו מעבודת קורבנות של להקריב בני אדם, חס ושלום, והעניין של לשפוך דם כמים, ולהגיע לדרגות של השגות, שמחפשים את העולם הטוב והמושלם.
  to: וכך גם האנושות כולה הלכה מעבודת קורבנות של הקרבת בני אדם, חס ושלום, ושפיכת דם כמים, עד לדרגות של השגה, שבהן מחפשים את העולם הטוב והמושלם.
- from: אבל סוף של הבירור הזה, זה מתי שהעולם כבר מוכן שיהיה פה גילוי אלוקות, ואז הקדוש ברוך הוא מתגלה מלמעלה, והאנושות כבר יש לה כלי להכיל את זה.
  to: וסוף הבירור הזה הוא כשהעולם כבר מוכן לגילוי אלוקות, ואז הקדוש ברוך הוא מתגלה מלמעלה, ולאנושות כבר יש כלי להכיל את הגילוי.
- from: כמו שהילד שלמד לא לדחוף, אחרי זה למד לעשות את הבירור היותר פנימי. כשמתגלה לו רוח הקודש, אז יש לו את הכלים להכיל את רוח הקודש, ועל זה התכלית, בשביל זה הוא נברא.
  to: 'כמו הילד שלמד לא לדחוף, ואחר כך למד את הבירור הפנימי יותר: כשמתגלה לו רוח הקודש, יש לו הכלים להכיל אותה, וזו התכלית שבשבילה נברא.'
- from: 'וכל יום באותו דבר: בן אדם קם בבוקר, מתפלל על מה שהוא צריך, רואה השגחה פרטית כל היום, שמלאה את הכלים האלה,'
  to: 'וכך בכל יום: אדם קם בבוקר ומתפלל על מה שהוא צריך, רואה השגחה פרטית כל היום, שממלאה את הכלים האלה,'
- from: אבל הכל מתחיל עם ההתעוררות של התפילה, כי בלי זה, זה סתם בזבוז.
  to: אבל הכל מתחיל בהתעוררות התפילה, ובלעדיה זה סתם בזבוז.
- from: וזה מה שאנחנו מדברים, שהגאולה עצמה, שאנחנו באמת בפתח של זה, כשכל הגילוי, דרך אגב, זה הייחוד, לראות מה נראה כשאנחנו קוראים השגחה פרטית.
  to: 'זו הגאולה עצמה, שאנחנו באמת בפתחה: כל הגילוי הוא הייחוד, שנראה במה שאנחנו קוראים השגחה פרטית.'
- from: כשרואים את ההשגחה העליונה למטה, זה עושה הרבה יותר קל. כל השאלות עכשיו, והספקות, והדעות הכוזבות, זה בגלל שלא היה גילוי.
  to: כשרואים את ההשגחה העליונה למטה, הכל נעשה קל הרבה יותר. כל השאלות, הספקות והדעות הכוזבות של עכשיו הם משום שלא היה גילוי.
- from: כמו שכבר ידוע שבגלות השכינה מבית המקדש גם היה גלות הנבואה, וגלות של ההשגחה הפרטית. ומלכות בית דוד זה השגחה פרטית, ומלכות רומי הרשעה זה בדיוק ההפך של זה, זה גלות השכינה, שאין השגחה עליונה.
  to: כידוע, בגלות השכינה מבית המקדש היו גם גלות הנבואה וגלות ההשגחה הפרטית. מלכות בית דוד היא השגחה פרטית, ומלכות רומי הרשעה היא בדיוק היפוכה, גלות השכינה, שאין בה השגחה עליונה.
- from: ולכן ההשגחה הפרטית, שזה כל החידוש של הבעל שם טוב הקדוש, שזה עניין של מלכות בית דוד, זה עניין שיהיה ייחוד והתכללות למטה — כמו שבאצילות ידוע זה
  to: ולכן ההשגחה הפרטית, שהיא כל חידושו של הבעל שם טוב הקדוש ועניין מלכות בית דוד, היא שיהיה ייחוד והתכללות למטה, כמו שידוע באצילות,
- from: והאורות והכלים שלו כולם אחד. כמו שהקדוש ברוך הוא, עצמות אינסוף, מתלבש ומתאחד עם האורות והאצילות והכלים דעולם האצילות, כמו שמובן בתניא באגרת הקודש פרק כ', למרות שאנחנו לא יכולים להבין את זה בשכל שלנו. הגילוי הזה והאחדות הזה, גם פה למטה בעולם הזה יהיה הגשמי.
  to: 'האורות והכלים כולם אחד: הקדוש ברוך הוא, עצמות אינסוף, מתלבש ומתאחד עם האורות והכלים דעולם האצילות, כמבואר בתניא באגרת הקודש פרק כ'', אף שאיננו יכולים להבין זאת בשכלנו. הגילוי והאחדות האלה יהיו גם כאן למטה, בעולם הזה הגשמי.'
- from: 'באמת, איך יש את הגילוי הזה שמאחד את האורות ואת הכלים באצילות, שהם בעצמם שני הפכים? זה גילוי שלמעלה משניהם. שזה פה אומר על עולם העקודים. זה אפשר להגיד בחינת שורש העולם הזה, בוא נגיד ככה: עולם התיקון, שזה מהאצילות ולמטה, זה עולם התיקון.'
  to: ובאמת, איך יש גילוי שמאחד את האורות והכלים באצילות, שהם עצמם שני הפכים? זה גילוי שלמעלה משניהם, וזה מה שנאמר כאן על עולם העקודים. אפשר לומר שזו בחינת שורש העולם הזה. עולם התיקון הוא מהאצילות ולמטה.
- from: עולם התוהו זה בשורשים של למעלה מעולם התיקון, זה בעולם הנקודים, שהוא בין האצילות והעולם העקודים. אז האצילות זה כבר עולם התיקון; עולם הנקודים, שזה שם היה שבירה, זה האורות דה תוהו שנפלו, וכל הבירור של התיקון הוא של התיקון של האורות דה תוהו בכלים דה תיקון. כשנשלם הגילוי הזה מתגלה הדרגה השלישית, שזה עולם העקודים.
  to: עולם התוהו הוא בשורשים שלמעלה מעולם התיקון, בעולם הנקודים, שבין האצילות לעולם העקודים. האצילות כבר היא עולם התיקון; בעולם הנקודים הייתה השבירה, ושם האורות דתוהו שנפלו, וכל הבירור הוא תיקון האורות דתוהו בכלים דתיקון. כשנשלם הגילוי הזה, מתגלה הדרגה השלישית, עולם העקודים.
- from: כל האריכות הזה זה בשורת הגאולה של הרבי מתשנ״א, שאומר שכבר נסתיימה עבודת הבירורים, ויש כבר את הגילוי של פנימיות עתיק, שזה ממש רוחו של המשיח. וזה כבר יש מתשנ״א, וכל העבודה מאז זה רק שזה מתאחד ביחד עם העולם, זה הבירור שני כמו שאמרנו.
  to: 'כל זה הוא בשורת הגאולה של הרבי מתשנ״א: כבר נסתיימה עבודת הבירורים, ויש כבר גילוי פנימיות עתיק, שהוא ממש רוחו של משיח. זה קיים מאז תשנ״א, וכל העבודה מאז היא רק שהגילוי יתאחד עם העולם, הבירור השני שאמרנו.'
- from: הנה השורש, ופה הוא אומר שהעניין של הגילוי של מעלה מתוהו ותיקון, שמתגלה אחרי שיש את הגילוי של האורות דה תוהו, של עולם הנקודים, בכלים דה תיקון מעולם האצילות, בריאה, יצירה ועשייה ועד עולם הזה התחתון, עד שנסתיימה עבודה של הרפ"ח ניצוצות, גם בעולם הפרטי וגם באדם הכללי, אז בא הגילוי של המשיח, שזו הגילוי של העקודים, שהוא למעלה מהתהליך של תוהו ותיקון, וזה נקרא פנימיות עתיק.
  to: זה השורש. כאן הוא אומר שהגילוי שלמעלה מתוהו ותיקון מתגלה אחרי גילוי האורות דתוהו, של עולם הנקודים, בכלים דתיקון, מעולם האצילות, בריאה, יצירה ועשייה, ועד העולם הזה התחתון. כשנסתיימה עבודת רפ"ח הניצוצות, גם בעולם הפרטי וגם באדם הכללי, בא גילוי המשיח, גילוי העקודים, שלמעלה מהתהליך של תוהו ותיקון, וזה נקרא פנימיות עתיק.
- from: 'שם יש חמישה מאמרים של הרבי, שזה הגילוי של נ״א, של מה זה בדיוק פנימיות העתיק. וזה העלייה השביעית של ספירת המלכות. בקצרה, הגילוי של פנימיות העתיק זה גילוי שורש ספירת המלכות בפנימיות העתיק. שכל העליות, גם בית המקדש הראשון בימי שלמה המלך, היה רק גילוי אורות שנחסרו במלכות. שזה העניין, חמישה אורות שנחסרו ממנה עד לחיצוניות העתיק. זה החמישה פרצופים של האצילות:'
  to: 'על כך יש חמישה מאמרים של הרבי, גילוי שנת נ״א, המבארים מהי בדיוק פנימיות עתיק. זו העלייה השביעית של ספירת המלכות. בקצרה, גילוי פנימיות עתיק הוא גילוי שורש ספירת המלכות בפנימיות עתיק. כל העליות, גם בבית המקדש הראשון בימי שלמה המלך, היו רק גילוי אורות שנחסרו מהמלכות: חמישה אורות שנחסרו ממנה, עד חיצוניות עתיק. אלה חמשת הפרצופים של האצילות:'
