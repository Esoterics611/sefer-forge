- from: '"שלמעלה מסדר השתלשלות". אנחנו אומרים כל יום "אור חדש על ציון תאיר":'
  to: '"שלמעלה מסדר השתלשלות". כל יום אנחנו אומרים "אור חדש על ציון תאיר":'
