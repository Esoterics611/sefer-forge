# The abbreviations of פדה בשלום, opened in print (Ronnie, 2026-11-24: "the ראשי תיבות have to be opened in the
# text — write out the full word in place"). Read by scripts/build-biur.py (front matter `open_abbreviations:`).
# biur.src.md and ocr.md keep them as written; only what prints changes. The build refuses an abbreviation that is
# in none of the three lists below, so nothing is printed closed by oversight.
#
# words:   an abbreviation → its words. A word with prefix letters (ו ב כ ל מ ש ה ד) is found by its base
#          ("ובחי'" → "ו" + "בחינת"); list the prefixed form itself where the prefix changes the reading.
# phrases: exact text → text, applied first, for a reading that depends on the words around it.
# keep:    printed as written: the Name, letters named as letters, the names of the masters, כו', בס"ד.

keep:
  - "כו'"
  - "וכו'"
  - "בס\"ד"
  - "ה'"
  - "הוי\"ה"
  - "ה\"א"          # the letter ה"א (ה"א תתאה)
  - "ב\"ן"          # the name ב"ן
  - "נ\"ב"          # a gematria
  - "צ'"            # the letters of צלם
  - "ל'"
  - "ם'"
  - "מ'"
  - "צל\"ם"
  - "למ\"ד"
  - "מ\"ם"
  - "בא\"ר"         # a notarikon: בידך אפקיד רוחי
  - "האר\"י"
  - "רש\"י"
  - "הבעש\"ט"
  - "פורג'"         # Sefer Forge

