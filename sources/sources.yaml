# Reference works kept in the repo: the books our texts cite, so a session's
# citations can be looked up and quoted (scripts/source-lookup.py) and set
# beside the text (scripts/build-references.py). Each file is a Sefaria export,
# kept exactly as downloaded: never edit it. sources/README.md says how to add
# a work.
#
#   file       the export JSON (Hebrew, "merged" version)
#   cite_as    how our texts abbreviate the work (first word of a citation)
#   gates      numbered: gate N is address N (Etz Chaim's 50 gates);
#              otherwise gate N is the work's Nth named gate (Pri Etz Chaim)
#   numbering  where the editions our texts cite are numbered differently
#              from this file, found while placing citations

works:
  etz-chaim:
    title: "עץ חיים"
    file: sources/arizal/etz-chaim.he.json
    cite_as: ['ע"ח', "עץ", 'בע"ח']
    gates: numbered
    from: "https://storage.googleapis.com/sefaria-export/json/Kabbalah/Arizal and Chaim Vital/Sefer Etz Chaim/Hebrew/merged.json"
    sefaria: https://www.sefaria.org/Sefer_Etz_Chaim
    version: "Sefer Etz Chaim, from http://www.hebrew.grimoar.cz/vital/ec_chajim.htm (Public Domain)"
    fetched: 2026-11-05
    numbering:
      - "Gates 1-50 as in the standard (Warsaw) order; addresses gate.chapter.paragraph. Shaar HaKlalim is 'Shaar HaKlalim.N.M'."
      - "Gate 39 (מ\"ן ומ\"ד): chapter N = דרוש N; in דרוש י\"א the simanim are paragraphs, siman N = paragraph N+1 (39.11.8 = סי' ז')."
      - "Gate 40 (פנימיות וחיצוניות): what the Alter Rebbe cites as דרוש ב' and דרוש ג' is in 40.2.1."
      - "Gate 42: chapters 6-12 are empty in this file; 42.13-17 hold later material of the gate."
      - "The Shklov print numbers some gates one lower (שער כ\"ו = Shklov שער כ\"ה)."
  pri-etz-chaim:
    title: "פרי עץ חיים"
    file: sources/arizal/pri-etz-chaim.he.json
    cite_as: ['פע"ח', "פרי", 'בפע"ח']
    gates: named
    from: "https://storage.googleapis.com/sefaria-export/json/Kabbalah/Arizal and Chaim Vital/Pri Etz Chaim/Hebrew/merged.json"
    sefaria: https://www.sefaria.org/Pri_Etz_Chaim
    version: "Pri Etz Chaim, from http://www.hebrew.grimoar.cz/vital/pri_ec_chajim.htm (Public Domain)"
    fetched: 2026-11-05
    numbering:
      - "Gates by name (Gate of Prayer = שער א'). Each gate has an 'Introduction' block and numbered chapters."
      - "Gate of Prayer: the Alter Rebbe's פע\"ח ש\"א פ\"ו is chapter 7 here (Gate of Prayer.7.2-7.4)."
  shaar-hagilgulim:
    title: "שער הגלגולים"
    file: sources/arizal/shaar-hagilgulim.he.json
    cite_as: ['שעה"ג', 'שה"ג']
    gates: numbered
    from: "https://storage.googleapis.com/sefaria-export/json/Kabbalah/Arizal and Chaim Vital/Sha'ar HaGilgulim/Hebrew/merged.json"
    sefaria: https://www.sefaria.org/Sha'ar_HaGilgulim
    version: "Shaar HaGilgulim, from http://www.hebrew.grimoar.cz/vital/saar_ha-gilgulim.htm (Public Domain)"
    fetched: 2026-11-09
    numbering:
      - "Addresses are הקדמה.paragraph: 13.1 = הקדמה י\"ג, its first paragraph (cite it as 'שעה\"ג הקדמה י\"ג'). 1-38 are the הקדמות; 39 is 'בקשר החברים'; 40 is R. Shmuel Vital's appendix."
      - "Not the ספר הגלגולים the Alter Rebbe cites by chapter ('בגלגולים פ\"א', 'פ\"ז', 'פי\"ד', 'פ\"ב'): that is the other redaction of the same teachings, not in sources/. Its words 'וכפי גודל אותה המצוה או זריזות' are not here; the teaching is: souls rise from the kelipot by others' prayers, a צדיק's יחוד or a mitzvah (13.1, again 39.7), into עיבור in the מלכות, 'נקבה העליונה' (12.5), 'ואח\"כ יורדות בגוף בעה\"ז' (12.7)."
      - "His 'וע\"ש אחר ס\"פ ל\"ה בקשר החברים' (each soul rising from the kelipot is at least forty days in the מלכות) is 39.6 here, and 12.7."
  shaar-hakavanot:
    title: "שער הכוונות"
    file: sources/arizal/shaar-hakavanot.he.json
    cite_as: ['שעה"כ', 'שער הכוונות', 'כוונות', 'בכוונות']
    gates: named
    from: "https://storage.googleapis.com/sefaria-export/json/Kabbalah/Arizal and Chaim Vital/Sha'ar HaKavanot/Hebrew/merged.json"
    sefaria: https://www.sefaria.org/Sha'ar_HaKavanot
    version: "Shaar HaKavanot, from http://www.hebrew.grimoar.cz/vital/saar_ha-kavanot.htm (Public Domain)"
    fetched: 2026-11-11
    numbering:
      - "Gates by name (the דרושים of each subject): 'Sermons on Yom Kippur.1.5' = דרושי יום הכיפורים, דרוש א', paragraph 5."
      - "The Alter Rebbe's 'כוונות' is not always this work. His 'כמ\"ש בכוונות עיוה\"כ' (bread and food come from חיצוניות אימא) is in פרי עץ חיים, שער יום הכיפורים פ\"א, 'ענין כל האוכל ושותה בט' (Gate of Yom Kippur.1.8-1.10), and פ\"ג (3.1-3.3); the parallel here is Sermons on Yom Kippur.1.5."
  shaar-hamitzvot:
    title: "שער המצוות"
    file: sources/arizal/shaar-hamitzvot.he.json
    cite_as: ['שעה"מ', 'שער המצוות', 'שער המצות']
    gates: named
    from: "https://storage.googleapis.com/sefaria-export/json/Kabbalah/Arizal and Chaim Vital/Sha'ar HaMitzvot/Hebrew/merged.json"
    sefaria: https://www.sefaria.org/Sha'ar_HaMitzvot
    version: "Jerusalem, 1872 (National Library of Israel scan; Public Domain)"
    fetched: 2026-11-11
    numbering:
      - "By parashah (Introduction, Bereshit ... Vayelekh). Introduction.1 is R. Shmuel Vital's preface; Introduction.2 is the הקדמה of the gate itself."
      - "Not the טעמי המצוות the Alter Rebbe cites ('בטעמי המצות בסוף ההקדמה'): that is the other redaction, printed with ליקוטי תורה (Zolkiew 1775). The parallel teaching is in Introduction.2.7 (מצוות עשה are the חסדים) and 2.9 (the mitzvot bring about the זיווג of זו\"ן)."
  zohar:
    title: "זוהר"
    file: sources/zohar/zohar.he.json
    cite_as: ['זוהר', 'בזוהר', 'זהר', 'זח"א', 'זח"ב', 'זח"ג']
    gates: named
    from: "https://storage.googleapis.com/sefaria-export/json/Kabbalah/Zohar/Zohar/Hebrew/merged.json"
    sefaria: https://www.sefaria.org/Zohar
    version: "Vocalized Zohar, Israel 2013. License: unknown (the vocalization may be under copyright; the Aramaic text is public domain)."
    fetched: 2026-11-11
    numbering:
      - "By parashah, chapter, paragraph ('Pekudei.20.1'). The printed (Vilna) pages our texts cite are marked inside the text; look a page up with: python scripts/source-lookup.py --page zohar 2 229b (volume, page)."
      - "Volumes: 1 = הקדמה to ויחי, 2 = שמות to פקודי, 3 = ויקרא to האזינו. The Alter Rebbe cites by parashah and דף ('זוהר פקודי דף רכ\"ט')."
  mikdash-melekh:
    title: "מקדש מלך"
    file: sources/zohar/mikdash-melekh.he.json
    cite_as: ['מק"מ', 'מקדש מלך']
    gates: numbered
    from: "https://storage.googleapis.com/sefaria-export/json/Kabbalah/Zohar/Mikdash Melekh on Zohar/Hebrew/merged.json"
    sefaria: https://www.sefaria.org/Mikdash_Melekh_on_Zohar
    version: "Zholkva, 1864 (National Library of Israel scan; Public Domain)"
    fetched: 2026-11-11
    numbering:
      - "Arranged by the Zohar's page: volume.N.paragraph, where N counts the Zohar's pages (דף X ע\"א = 2X-1, ע\"ב = 2X), so Zohar I 36b is 1.72. Look up with: python scripts/source-lookup.py --page mikdash-melekh 1 36b."
      - "The Alter Rebbe cites the folio of an older print: his 'מק\"מ בראשית (דף ק\"ב סוף ע\"ב)' is the piece on Zohar I 36b (1.72.1: 'שהם ג' חשמלים שנסתלקו ממנה ונפלו בנוגה')."
