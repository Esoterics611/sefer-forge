# What is published on Sefaria (Voices on Sefaria, the account Ronnie publishes
# under): every sheet, by number, with the discourse it belongs to, and the
# collection that holds them. The record of what is up, as
# booklets/narration/youtube.yaml is for YouTube: a sheet is changed by saving
# it again under its number, so the link already shared keeps working.
# scripts/sefaria-sheet.py reads and writes this file; keep it in main.
#
#   id          the sheet's number: https://www.sefaria.org/sheets/<id>
#   title       as published
#   discourse   the discourse folder it belongs to
#   made_from   the repo file the sheet's content was made from: a biur.src.md
#               is rebuilt and saved again by scripts/sefaria-sheet.py (the three
#               here checked 2026-11-18: the build matches the published text word
#               for word); "not recorded": published before this record existed,
#               the likeliest file named, unchecked
#   linked      how many distinct passages it quotes as linked Sefaria sources
#               (each shows the sheet in that passage's side panel on Sefaria);
#               the rest of its quotations are pasted text, from works Sefaria
#               does not have (noted)
#   beside      checked 2026-11-18 through Sefaria's related-sheets API: whether
#               the sheet is listed beside its passages
#   status      public | unlisted

