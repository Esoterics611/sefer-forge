  image: "https://storage.googleapis.com/sefaria-collection-images/20138-bc806862-e358-11f1-9401-fae83ada074e.png"
  website: "https://esoterics611.github.io/library.html"   # the collection's one link (websiteUrl): chosen 2026-11-18, set by Ronnie's paste the same day (unconfirmed)
