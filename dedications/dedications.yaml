# The dedications store: every part of the work a supporter can dedicate,
# discourse by discourse. scripts/build-dedications.py turns it into
# site/he/dedicate.html and site/dedicate.html; publish with scripts/deploy-site.sh.
#
# Each item:
#   id          stable, used in links (dedicate.html#<id>)
#   kind        edition | part | translation | series | volume | year
#   he / en     title, and what it covers (about)
#   price       a whole number in `currency`, or null: "by arrangement"
#   stripe      a Stripe Payment Link (https://buy.stripe.com/...), or empty: the button
#               then writes to `contact`. Create one per item in Stripe's dashboard
#               (Payment Links), with a custom field "Dedication text" so the
#               dedication comes with the payment.
#   dedicated   once taken: the dedication as it prints (e.g. "לעילוי נשמת ..."); the
#               item then shows it and takes no more.
#   repeat      true: many can take it (a chapter of 54, a note of 5), never "taken"
#
# Prices are the owner's to set: none is invented here.

contact: esoterics611@gmail.com
currency: USD

discourses:
  - id: padah-beshalom
    he: { title: 'פדה בשלום נפשי', subtitle: 'מאמר כ"ק אדמו"ר האמצעי, עם ביאור · החוברת המודפסת' }
