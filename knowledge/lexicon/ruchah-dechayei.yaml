term: רוחא דחיי (בתפילין של יד)
forms:
- רוחא דחיי
category: פרצופים
senses:
- meaning: הו"ד של מילוי היו"ד של שם ס"ג שבחוטם אריך אנפין, בנקב השמאלי, הנמשכת דרך שמאל אריך לנוקבא; ממנה הכוח לנקודת הכתר
    של רחל לעלות ולהיקשר בזרוע השמאלית של ז"א.
  rests_on:
