- or-pnimi-makif
open: 'החילוק בין שני המינים מבואר כאן בפדה בשלום. בתורה אור (מקץ) מס"נ שבקריאת שמע היא "מסירת הרצון", "כי נפש הוא הרצון"; יש לבדוק אם תורה אור או התניא מבחינים גם הם בין "בכל נפשך" ל"בכל מאדך" כפדה בשלום.'
