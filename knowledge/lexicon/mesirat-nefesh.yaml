# Lexicon entry. Format: knowledge/README.md. Check: python scripts/lexicon.py --check
term: מסירת נפש (מסירת הרצון / מס"נ בעצם)
forms:
- מסירת נפש
- מסירת הנפש
- מס"נ
- מסירת הרצון
- למסור נפשו
abbrev:
  מס"נ: מסירת נפש
category: תורה, מצוות ותפילה
senses:
- meaning: 'מסירת הנפש באחד, "בכל נפשך": שהנפש בטלה באחד ממש. היא באה מהארת אור אין סוף שבנשמה, שלמעלה מן החכמה
    והטעם, ולכן היא "בלי טעם ודעת". גם עסק התורה והתפילה הוא מסירת נפש, כשהמחשבה מיוחדת באותיותיהם ואינה בצרכי הגוף.'
  rests_on:
  - work: torah-or
    ref: Ki Tisa.2.5
    quote: וזהו בכל נפשך מסירת נפש
  - work: torah-or
    ref: Shemot.4.12
    quote: למסור נפשו באחד בלי טעם ודעת כלל רק מצד אהבה הפשוטה לה'
  - work: tanya
    ref: Part I; Likkutei Amarim.41.23
    quote: ועסק התורה ומצות והתפלה, הוא גם כן ענין מסירת נפש ממש
- meaning: >-
    אצל אדמו"ר האמצעי (פדה בשלום, פ"ז–ט): שני מיני מסירת נפש. מסירת הרצון ("בכל נפשך", מקיף דחיה): הרצון הזר
    נמסר לרצון ה' בכוח המלחמה שבתפילה, "כדבר הנמסר מרשות לרשות", ולכן יכול לחזור. מסירת הנפש בעצמה ("בכל מאדך",
    יחידה): עצם הנפש, שהוא מקור כל רצון, בטל "בבחי' ביטול עצמי", בלי מלחמה ובלי שינוי, ואין בו הרגשת צער.
  rests_on:
  - cite: >-
      אדמו"ר האמצעי, שערי תשובה ח"א, ד"ה פדה בשלום, פ"ז (נג ע"ב): "אין זה מס"נ בעצמה ומהותה רק שזה הנק' מסירת
      הרצון לבד"; פ"ח (נג ע"ב): "מסירת הנפש בעצמה דוקא ולא מסירת הרצון לבד"; פ"ט (נד ע"ג): "ביטול זה להיותו בחי'
      עצמיות ע"כ מאליו ומעצמו יבא ולא יפול בו שינוי כלל". הנוסח: discourses/006-padah-beshalom/sessions/001/ocr.md
  note: 'הדוגמה במאמר: עשרה הרוגי מלוכה, "מס"נ שלהם היה בשמחה ותענוג" (פי"א).'
