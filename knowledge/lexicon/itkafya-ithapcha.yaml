# Lexicon entry. Format: knowledge/README.md. Check: python scripts/lexicon.py --check
term: אתכפיא ואתהפכא
forms:
- אתכפיא
- אכפייא
- לאכפייא
- אתהפכא
- לאתהפכא
category: תורה, מצוות ותפילה
senses:
- meaning: 'שתי דרכים בעבודת נפש האלקית עם נפש הבהמית (הנפש החיונית). אתכפיא: הרע נכפה ונכנע לפני הטוב, ואינו מתפשט.
    אתהפכא: הרע נהפך, "חשוכא לנהורא". בתניא שתיהן הן עבודת בירור הניצוצות שבתפילה.'
  rests_on:
  - work: zohar
    ref: Vayishlach.1.4
    quote: ההוא יצר הרע אתכפיא קמיה ושליט ימינא על שמאלא
  - work: tanya
    ref: Part V; Kuntres Acharon.8.7
    quote: שהוא בחינת אתהפכא או אתכפיא של נפש החיונית לנפש האלקית
  - work: torah-or
    ref: Bereshit.2.17
    quote: נעשה בטול רצון בחי' אתהפכא חשוכא לנהורא
  - work: padah-beshalom
    ref: 52b.1
    quote: וזהו נקרא אכפייא ולא אתהפכא
  - work: padah-beshalom
    ref: 52b.1
    quote: אבל באמת הרי ישנה בתקפה
  note: 'בפדה בשלום (פ"ו–ז): אכפייא היא הכנעה בלבד, בלי ביטול המהות. אתהפכא היא היפוך המהות, "התכללות אמיתי",
    אבל גם היא, כשהיא באה במלחמה בשעת התפילה, "לפי שעה", "ביטול המיעוט ברוב", ואחר כך הרצון הזר "חוזר וניעור".'
related:
- birur
- mesirat-nefesh
caution: 'אתהפכא שבמלחמה אינה עדיין ביטול בעצם. בפדה בשלום הביטול בעצם, שאינו משתנה, בא מבחינת יחידה ("בכל מאדך"),
  "שלא ע"י מלחמה כלל". אין לזהות אתהפכא עם הביטול בעצם.'
