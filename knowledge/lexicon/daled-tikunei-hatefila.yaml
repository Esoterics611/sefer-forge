    quote: לחבר ה' אחרונה דהוי"ה עם י' דאדנ"י ע"י ה' אחרונה דאהי"ה
  - work: nahar-shalom
    ref: 15b.4
    quote: יכוין לחבר י' דהוי"ה עם א' דאדנ"י ע"י א' דאהי"ה
