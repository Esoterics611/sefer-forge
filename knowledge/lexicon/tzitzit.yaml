open: בדרוש ה' (Sermons on Tzitzit.5.4) הקוצים "ממוח הדעת", ולא ממוחין דעיבור כבדרוש ב' (2.5); ראה kotzin-nimin-searot.
  ובדרוש ד' (4.3) מסתפק הכותב אם גם ממוחין דאבא יוצאות ציציות או רק אור הציץ ("וצ"ע").
