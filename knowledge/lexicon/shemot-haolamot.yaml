category: שמות ואותיות
senses:
- meaning: 'שם א"ל אדני בעולם העשיה, א"ל הויה ביצירה, א"ל שדי בבריאה. ונשמת כל עולם היא הויה במילוי: ב"ן (דההין)
    לעשיה, הנקראת נפש; מ"ה (דאלפין) ליצירה, רוח; ס"ג לבריאה; וע"ב (דיודין) בברכת אבות.'
  rests_on:
  - work: shaar-hakavanot
    ref: Sermons on Morning Prayers.1.3
