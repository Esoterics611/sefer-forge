  - work: shaar-hakavanot
    ref: Sermons on Morning Prayers.1.3
    quote: גם תכוין אל שם א"ל הויה אשר בעולם היצירה
  - work: shaar-hakavanot
    ref: Sermons on Morning Prayers.1.3
    quote: גם תכוין אל שם א"ל שדי אשר בעולם הבריאה
  - work: shaar-hakavanot
    ref: Sermons on Morning Prayers.1.3
    quote: והויה זו דמילוי ההין ה"ס נשמת העשיה הנק' בחי' נפש
  - work: shaar-hakavanot
    ref: Sermons on Morning Prayers.1.3
    quote: תכוין אל נשמת עולם היצירה שהוא הויה דאלפין העולה בגי' מ"ה
  - work: shaar-hakavanot
    ref: Sermons on Morning Prayers.1.3
    quote: תכוין אל נשמת הבריאה והיא הויה דמילוי ס"ג
