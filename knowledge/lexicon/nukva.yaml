    ref: 39.2.1
    quote: עד יסוד נוקבא דז"א בבחי' מ"נ
  - work: shaar-hagilgulim
    ref: '12.5'
    quote: הם צריכות בתחלה לבא בעבור במעי של המלכות נקבה העליונה, כדי להטהר
