term: נוקבא דז"א / מלכות / "נקבה העליונה"
forms:
- נוקבא דז"א
- נוקבא
- נקבה העליונה
- הנקבה העליונה
- מלכות
category: פרצופים ועולמות
senses:
- meaning: הפרצוף המקבל, שהמ"ן עולים אל היסוד שלו. הנשמות היוצאות מן הקליפות באות תחילה "בעבור במעי של המלכות, נקבה
    העליונה", כדי להיטהר, ורק אחר כך יורדות לגוף.
  rests_on:
