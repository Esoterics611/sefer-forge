term: התבוננות (עיון)
forms:
- התבוננות
- ההתבוננות
- עיון
- להתבונן
category: תורה, מצוות ותפילה
senses:
- meaning: 'מהות ההתבוננות: הסתכלות חזקה בעומק הענין והעמידה עליו הרבה, עד שיובן על בוריו בכל חלקיו. היא פנימיות הבינה, שהגמרא
    קוראת "עיון", והיפוכה ה"גירסא", הבנה במבט ראשון. "התבוננות" בנו"ן כפולה: שמתבונן ומעיין בדבר הרבה. ממנה נולדת ההתפעלות
    במוח ובלב.'
  rests_on:
  - work: shaar-hayichud
    ref: '1.1'
    quote: והנה מהות ההתבוננות בעצם הוא ענין ההסתכלו' החזקה בעמקות הענין
  - work: shaar-hayichud
    ref: '1.1'
    quote: בחי' פנימיות בינה הנק' בלשון הגמרא בשם עיון
  - work: shaar-hayichud
    ref: '1.1'
    quote: והוא הנקר' התבוננות בנו"ן הכפול דוקא
