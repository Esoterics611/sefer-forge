# Lexicon entry. Format: knowledge/README.md. Check: python scripts/lexicon.py --check
term: נשמות חדשות / שנשתיירו באדם
forms:
- נשמות חדשות
- חדשות אמיתיות
- נשמות ישנות
- שלא נכללו באדה"ר
- שנכללו באדה"ר
- שנשתיירו באדם
category: הנשמה ולבושיה
senses:
- meaning: מדרגות הנשמות לפי יחסן לאדם הראשון. "חדשות אמיתיות" הן המדרגה הראשונה. "הנשמות שנשתיירו באדם" הן המדרגה
    השנייה, "חדשות ולא לגמרי". אחריהן נשמות קין והבל, המגולגלות והגרים.
  rests_on:
  - work: shaar-hagilgulim
    ref: '12.7'
    quote: שהם הנשמות הנקראים חדשות אמיתיות
  - work: shaar-hagilgulim
    ref: '12.7'
    quote: והם הנשמות שנשתיירו באדם, ונקראים חדשות ולא לגמרי
  - work: shaar-hagilgulim
    ref: '6.1'
    quote: בענין נשמות חדשות וישנות מה עניינם
  - cite: ספר הגלגולים פ"ז, פי"ד (the Alter Rebbe's citations; not in sources/)
open: 'ההגהה מבחינה: "מ"ן עצמן דנוקבא" הן אלו שלא נכללו באדם הראשון, "והן בחי'' בי"ע שלפני החטא", ומתבררות על ידי
  תפילה דווקא. מאלו שנכללו בו נמשכים רוב בני האדם, על ידי מצוות פרו ורבו. המובן המדויק תלוי בספר הגלגולים (פ"ז,
  פי"ד, פ"ב/כ''), שאינו בידינו. המקבילות בשער הגלגולים הן 6.2–6.3, 7.1, 12.2–12.4.'
