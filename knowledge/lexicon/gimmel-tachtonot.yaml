caution: פע"ח שער הציצית (2.2) מתאר את הטלית הגדול כ"א"מ דזעיר בהיות גדול"; שער הכוונות ושער התפילין מעמידים את
  שני הטליתות כנגד עיבור ויניקה בלבד. הסדר של ההגהה הוא של שער הכוונות. (נמצא בבדיקה העצמאית של הביאור, 2026-11-12.)
open: 'בשער הכוונות עצמו שתי לשונות: דרושי ציצית א'' (Sermons on Tzitzit.1.1) "אבל הציצית הגדול המעטף את הראש הוא
  בחי'' אור המקיף דז"א כשהגדיל ונעשו לו י"ס גמורות ונתפשטו ראשו וזרועותיו", כלשון פרי עץ חיים (Gate of Fringes.2.2),
  ודרוש ה'' (5.2) "טלית גדול כנגד יניקה". אם "כשהגדיל" שם הוא היניקה, לא נתברר.'
