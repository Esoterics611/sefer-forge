# Lexicon entry. Format: knowledge/README.md. Check: python scripts/lexicon.py --check
term: 'ג"ת דכל עולם: נטילת ידיים, טלית, תפילין'
forms:
- ג"ת
- ג"ת דעשייה
- ג"ת דעשיה
- טלית קטן
- טלית גדול
- ציצית
- תפילין
category: תורה, מצוות ותפילה
senses:
- meaning: 'סדר הבוקר מתקן את שלוש התחתונות (ג"ת) של כל עולם במקומן: נטילת ידיים וברכת אשר יצר את ג"ת דעשייה, הטלית
    את דיצירה, תפילין את דבריאה. הטלית הקטן כנגד ז"א בלי ראש וזרועות; הטלית הגדול כנגד ז"א "בהיות גדול".'
  rests_on:
  - work: pri-etz-chaim
    ref: Gate of Prayer.7.34
    quote: והרי נתקנו ג"ת דעשייה כנודע במקומן
  - work: pri-etz-chaim
    ref: Gate of Fringes.2.2
    quote: וזהו ענין סוד בחי' טלית קטן, שאין בה עטיפת ראש וזרועותיו
  - work: pri-etz-chaim
    ref: Gate of Fringes.2.2
    quote: אמנם טלית גדול, הוא א"מ דזעיר בהיות גדול
- meaning: 'סדר ההגהה (ציצית קטן כנגד עיבור, טלית גדול כנגד יניקה, תפילין כנגד הגדלות) מפורש בשער הכוונות ובפרי
    עץ חיים: שני הטליתות הם עיבור ויניקה, ואין טלית כנגד הגדלות, ולכן מניחים אחריהם תפילין. הציצית כנגד העולמות
    החיצוניים.'
  rests_on:
  - work: shaar-hakavanot
    ref: Sermons on Tzitzit.5.2
    quote: ציצית קטן כנגד עיבור וטלית גדול כנגד יניקה ואין טלית ג' כנגד הגדלות של המוחין
  - work: shaar-hakavanot
    ref: Sermons on Tzitzit.5.2
    quote: ולכן אח"כ מניחין התפילין שהם כנגד זמן הגדלות של המוחין
  - work: pri-etz-chaim
    ref: Gate of Teffilin.11.12
    quote: כי הטלית הוא בחי' המקיף, לבחי' ראשונה עיבור ויניקה
related:
- penimiyut-chitzoniyut
- ibur-yenika-mochin
status: draft
learned_from:
- discourses/004-levushei-haneshama/biur
caution: פע"ח שער הציצית (2.2) מתאר את הטלית הגדול כ"א"מ דזעיר בהיות גדול"; שער הכוונות ושער התפילין מעמידים את
  שני הטליתות כנגד עיבור ויניקה בלבד. הסדר של ההגהה הוא של שער הכוונות. (נמצא בבדיקה העצמאית של הביאור, 2026-11-12.)
