    quote: בבחי' ביטול בעצם שלא יתכן בזה סיבת מלחמה וניצוח כלל
  - work: padah-beshalom
    ref: 54c.1
    quote: ביטול זה להיותו בחי' עצמיות ע"כ מאליו ומעצמו יבא ולא יפול בו שינוי כלל
