- ביטול עצמי
- בבחי' ביטול בעצם
category: תורה, מצוות ותפילה
senses:
- meaning: 'ביטול שאינו בא מכוח שגובר על הדבר, אלא מעצם הנפש, שאין בו רצון שכנגד. בפדה בשלום: זו מסירת הנפש בעצמה, "בכל מאדך",
    מבחינת היחידה; לכן אין בה מלחמה, אינה משתנה ואין בה צער.'
  rests_on:
