# Lexicon entry. Format: knowledge/README.md. Check: python scripts/lexicon.py --check
term: ד' רבתי דאחד
forms:
- "ד' דאחד"
- "ד' רבתי"
category: תפילה
senses:
- meaning: בד' של "אחד" מכוונים אל המלכות, ומוסרים בה את הנפש על קידוש השם, ובכך יש כוח ברחל לעלות מהיכל אהבה דבריאה עד מקום ז"א דאצילות.
  rests_on:
  - work: shaar-hakavanot
    ref: Sermons on Intentions of the Shema Recitation.5.1.9
    quote: ובד׳ דאח״ד תכוין אל המלכות
  - work: shaar-hakavanot
    ref: Sermons on Intentions of the Shema Recitation.6.3.5
    quote: ולכן אנו צריכין למסור נפשינו על קדוש השם באות ד׳ דאחד
- meaning: ד' רבתי היא לאה, הבחינה העליונה של הנוקבא, וד' זעירא רחל, התחתונה; וכנגדן בבינה, ד' עליונה בינה וד' תחתונה תבונה. בשער
    היחוד (פרק ב) שורש אותיות המחשבה, הנמשך ממלכות דתבונה, "נק' לאה... והוא ד' רבתי דאחד".
  rests_on:
  - work: etz-chaim
    ref: Shaar HaKlalim.11.2
    quote: ודע כמו שיש ד' רבתי וד' זעירא
  - work: pri-etz-chaim
    ref: Gate of Prayer.4.5
    quote: ונשארין למעלה בד' דאחד שהיא לאה
related:
