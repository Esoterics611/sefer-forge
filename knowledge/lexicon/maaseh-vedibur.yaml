# Lexicon entry. Format: knowledge/README.md. Check: python scripts/lexicon.py --check
term: מעשה ודיבור (בתפילה)
forms:
- מעשה ודיבור
- מעשה ודבור
category: תפילה וכוונות
senses:
- meaning: 'בסדר התפילה שני מעברים על ארבעת העולמות: המעשה (נטילה, טליתות, תפילין) מתקן את חיצוניות כל עולם במקומו, והדיבור
    (ארבעת חלקי התפילה) מעלה עולם לעולם.'
  rests_on:
  - work: shaar-hakavanot
    ref: Sermons on Morning Prayers.3.2
    quote: ע"י מצות מעשיות שאנו עושים למטה בעה"ז וכונת התיקון הזה הוא לתקנם במקומם
  - work: shaar-hakavanot
    ref: Sermons on Morning Prayers.3.5
    quote: ועתה נבאר בחי' הדיבור כנ"ל בשם הזוהר ויקהל דר"א ע"א ופ' במדבר דק"כ ע"ב
- meaning: 'אצל הרש"ש: המעשים מתקנים את החיצוניות והפנימיות של העולמות החיצוניים, במקומם; הדיבור מתקן את החיצוניות והפנימיות
    של העולמות הפנימיים ומעלה עולם בעולם, ועמם את החיצוניים.'
  rests_on:
  - work: nahar-shalom
    ref: 19a.10
    quote: בירור ותיקון חיצוניות ופנימיות דחיצוניות הוא ע"י מצות מעשות וברכותיהם
  - work: nahar-shalom
    ref: 15a.7
    quote: ולכלול ולהעלות עולם בעולם
