# Lexicon entry. Format: knowledge/README.md. Check: python scripts/lexicon.py --check
term: צלם
forms:
- צלם
- הצלם
- צלמים
- הצלמים
category: הנשמה ולבושיה
senses:
- meaning: 'הלבוש שבין הצורה (נר"ן) לבין הכלים: הנשמה אינה נכנסת בגוף אלא על ידו. לכל אחד מחלקי הנשמה צלם משלו. הוא יצר טוב
    ויצר רע, והוא תרי"ג איברים, ושורשו ברפ"ח הניצוצות שנשארו בכלים שנשברו ("הבל דגרמי"). את הצלמים ואת הכלים המצוות מצרפות
    ומבררות.'
  rests_on:
  - work: etz-chaim
    ref: 26.1.2
    quote: והצלם גם הוא נחלק לה' בחי' כנגדן והוא לבוש הצורה ולעולם הצורה הזו אינה יכולה לעמוד בלתי צלם זה
  - work: etz-chaim
    ref: 26.2.1
    quote: וזה הצלם הוא המפסיק בין הכלים לבין העצמות האור
  - work: etz-chaim
    ref: 26.1.2
    quote: לכן הצלם הוא תרי"ג איברים
  - work: etz-chaim
    ref: 26.1.2
    quote: ולא נתנו המצות אלא לצרף ולברר וללבן הצלמים וגם הכלים
- meaning: >-
    אותיות צל"ם כשלוש מדרגות של אור: הצ' היא המוחין הנכנסים בפנימיות, אור פנימי; הל' והמ' הם שני אורות מקיפים
    על הראש, הל' התחתון והמ' העליון. במקום אחר: המ' כנגד מקיפי היחידה, והל' כנגד מקיפי החיה. כך גם בפדה בשלום
    לאדמו"ר האמצעי (פ"ט), "ההפרש בין צ' דצלם ללמ"ד ומ"ם דצלם", בין האור הפנימי לבין המקיפים.
  rests_on:
  - work: etz-chaim
    ref: '23.1.2'
    quote: "אות צ' דצלם הם המוחין הנכנסין בפנימיות זעיר אנפין ואותיות ל' ם' הם בחי' אורות מקיפים שיש על ראשו התחתון ל' והעליון ם'"
  - work: etz-chaim
    ref: '20.5.2'
    quote: "ד' בחי' היחידה מקיפים מ' דצלם ואח\"כ ג' בחי' מקיפים דחיה ל' דצלם והצ' דצלם הם אורות הפנימים"
  - work: padah-beshalom
    ref: 55a.1
    quote: "וזהו ההפרש בין צ' דצלם ללמ\"ד ומ\"ם דצלם"
  - work: padah-beshalom
    ref: 56c.2
    quote: "בבחי' צ' דצלם הנ\"ל"
