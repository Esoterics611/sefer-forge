term: ביטול המיעוט ברוב
forms:
- ביטול המיעוט ברוב
- ביטולו במיעוטו
- ביטול במיעוטו
category: תורה, מצוות ותפילה
senses:
- meaning: 'מושג מן ההלכה: דבר מועט שנתערב ברוב בטל בו. בפדה בשלום: הביטול של הרצון הזר במלחמת התפילה. גם כשהוא נהפך, הוא
    בטל רק מפני שכנגדו רצון גדול ממנו, "כטיפה בים"; ולכן כשהכוח הגובר מסתלק הוא "חוזר וניעור". כך גם במי שמוסר עצמו בשביל
    רעהו ואינו מרגיש את הצער.'
