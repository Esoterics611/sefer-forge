# Lexicon entry. Format: knowledge/README.md. Check: python scripts/lexicon.py --check
term: זיווג דחיות העולמות וזיווג הנשמות
forms:
- זיווג דחיות
- זווג דחיות
- זיווג דנשמות
- זווג הנשמות
- מזווג דחיות העולמות
category: מ"ן ומ"ד והזיווג
senses:
- meaning: 'בכל פרצוף שני זיווגים: החיצוני, של חיות העולמות, ממשיך שפע ומזון וחיות, תדיר, ונעשה מאליו; הפנימי, של הנשמות,
    מוציא נשמות חדשות ומחדש את הישנות, ואינו נעשה אלא במ"ן שישראל מעלים. לכן בכל מצוה נמשכים שני מיני מוחין: תחילה מן החיצוני,
    לתת כוח לעלות, ואחר כך העיקריים מן הפנימי. במעשים: לחיצוניות דחיצוניות מזיווג החיות, לפנימיות דחיצוניות מזיווג הנשמות.'
  rests_on:
  - work: nahar-shalom
    ref: 14b.11
    quote: וזיווג דחיצוניותם להמשיך שפע ומזון וחיות לכל העולמות
  - work: nahar-shalom
    ref: 14b.11
    quote: וזווג דפנימיותם הוא להוציא נשמות חדשות ולחדש הנשמות הישנות
  - work: nahar-shalom
    ref: 20a.4
    quote: כי זיווג דחיות נעשה ממילא שלא על ידינו
  - work: nahar-shalom
    ref: 19b.2
    quote: יכוין ע"י הברכה להמשיך בהם מוחין מזווג הנשמות
related:
- zivuga-shelim
- maaseh-vedibur
caution: בפרי עץ חיים, שער התפילה פרק ח, "עולמות" ו"נשמות" במעשים; הזיהוי עם שני הזיווגים הוא קריאת הביאור.
