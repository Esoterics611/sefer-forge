term: עומק, אורך ורוחב (של המושכל)
forms:
- עומק ואורך ורוחב
- עומק המושכל
- עומק המושג
category: תורה, מצוות ותפילה
senses:
- meaning: 'שלושה ממדים בכל דבר מושכל, במשל הנהר. רוחב: הסבר המושכל לכל צד בפרטים רבים. אורך: הורדת המושכל במשלים עד שיגיע
    גם להשגת תינוק. עומק: עצם נקודת המושכל, שממנה מתפשט הכול, כעיקר מרוצת הנהר. העיון הוא העמידה על המושכל עד שמגיעים לעומקו.'
  rests_on:
