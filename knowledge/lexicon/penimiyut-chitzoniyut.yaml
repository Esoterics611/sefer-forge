# Lexicon entry. Format: knowledge/README.md. Check: python scripts/lexicon.py --check
term: פנימיות וחיצוניות (העולמות)
forms:
- פנימיות
- חיצוניות
- בפנימיות
- בחיצוניות
- פנימיות וחיצוניות
category: פרצופים ועולמות
senses:
- meaning: 'בעולמות: החיצוניות של כל עולם היא חלק העשייה שבו. כנגד חיצוניות העולמות יש "פנימיות דנשמות". כל המעשה
    (המצווה) וברכותיה הם בחיצוניות: האור הפנימי כנגד המעשה, והמקיף כנגד הברכה.'
  rests_on:
  - work: etz-chaim
    ref: 40.2.1
    quote: כי החצוניות של כל עולם ועולם הוא בחי' חלק העשיה שיש בכל עולם
  - work: etz-chaim
    ref: 40.1.3
    quote: וכל זה נקרא חיצוניות העולמות וכנגדן יש גם כן שלשה כלים פנימיות דנשמות
  - work: etz-chaim
    ref: 40.2.1
    quote: וכל המעשה הוא וברכותיה הכל הוא בחיצוניות
- meaning: 'באדם ובפרצוף: הנשמות נקראות פנימיות, והכלים (הגוף) חיצוניות.'
  rests_on:
  - work: etz-chaim
    ref: 41.1.2
    quote: כלל העולה כי הנשמות נקראו פנימיות והכלים שהוא הגוף נקרא חיצוניות
caution: 'ההגהה: "התפלה בפנימית והמצוה בחיצוניות", בציון "ע"ח ש"מ דרוש ג''", ובקובץ הזה המקום הוא 40.2.1 (ראה sources.yaml
  numbering). שני המובנים קרובים ואינם אחד.'
