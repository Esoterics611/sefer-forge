# Lexicon entry. Format: knowledge/README.md. Check: python scripts/lexicon.py --check
term: פנימיות וחיצוניות (העולמות)
forms:
- פנימיות
- חיצוניות
- בפנימיות
- בחיצוניות
- פנימיות וחיצוניות
category: פרצופים ועולמות
senses:
- meaning: 'בעולמות: החיצוניות של כל עולם היא חלק העשייה שבו. כנגד חיצוניות העולמות יש "פנימיות דנשמות". כל המעשה (המצווה)
    וברכותיה הם בחיצוניות: האור הפנימי כנגד המעשה, והמקיף כנגד הברכה. ואילו "כל דבר התלוי בפה לבדו, כגון התפלה ועסק התורה",
    תלוי בפנימיות. והכוונה שבמחשבה היא הנשמה של שניהם.'
  rests_on:
  - work: etz-chaim
    ref: 40.2.1
    quote: כי החצוניות של כל עולם ועולם הוא בחי' חלק העשיה שיש בכל עולם
  - work: etz-chaim
    ref: 40.1.3
    quote: וכל זה נקרא חיצוניות העולמות וכנגדן יש גם כן שלשה כלים פנימיות דנשמות
  - work: etz-chaim
    ref: 40.2.1
    quote: וכל המעשה הוא וברכותיה הכל הוא בחיצוניות
  - work: etz-chaim
    ref: 40.2.1
    quote: אכן כל דבר התלוי בפה לבדו כגון התפלה ועסק התורה הכל תלוי בפנימיות
  - work: etz-chaim
    ref: 40.2.1
    quote: ואמנם הכונה במחשבה הוא הנשמה
- meaning: 'באדם ובפרצוף: הנשמות נקראות פנימיות, והכלים (הגוף) חיצוניות.'
  rests_on:
  - work: etz-chaim
    ref: 41.1.2
    quote: כלל העולה כי הנשמות נקראו פנימיות והכלים שהוא הגוף נקרא חיצוניות
- meaning: 'אצל הרש"ש: בכל עולם יש חיצוניות (אופנים בעשיה, מלאכים ביצירה, שרפים והכיסא בבריאה) ופנימיות (הנפשות, הרוחות, הנשמות),
    כל אחת חמישה פרצופים של נרנח"י. אבי"ע של החיצוניות מלבישים את אבי"ע של הפנימיות, וכל אחד נחלק שוב, ונמצאו ארבע שכבות:
    חיצוניות דחיצוניות, פנימיות דחיצוניות, חיצוניות דפנימיות, פנימיות דפנימיות. ועוד: חיצון, אמצעי ופנימי בכל עולם, כנגד ערבית,
    מנחה ושחרית. וההבחנה היא בערכין.'
  rests_on:
  - work: nahar-shalom
    ref: 12a.3
    quote: בכל עולם מא"ק ואבי"ע יש חיצוניות ופנימיות
  - work: nahar-shalom
    ref: 12a.5
    quote: והפנימיות שבו הוא הרוחין והחיצוניות הם המלאכים
  - work: nahar-shalom
    ref: 13b.6
    quote: אבי"ע דחצוניות מלביש לאבי"ע דפנימיות
  - work: nahar-shalom
    ref: 13b.9
    quote: תפלת שחרית היא באבי"ע הפנימי
  - work: nahar-shalom
    ref: 13a.3
    quote: באופן כי הענין חיצוניות ופנימיות הוא בערכין
caution: 'ההגהה: "התפלה בפנימית והמצוה בחיצוניות", בציון "ע"ח ש"מ דרוש ג''", ובקובץ הזה המקום הוא 40.2.1 (ראה sources.yaml
  numbering). שני המובנים קרובים ואינם אחד.'
