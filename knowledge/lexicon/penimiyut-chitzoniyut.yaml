# Lexicon entry. Format: knowledge/README.md. Check: python scripts/lexicon.py --check
term: פנימיות וחיצוניות (העולמות)
forms:
- פנימיות
- חיצוניות
- בפנימיות
- בחיצוניות
- פנימיות וחיצוניות
category: פרצופים ועולמות
senses:
- meaning: 'בעולמות: החיצוניות של כל עולם היא חלק העשייה שבו. כנגד חיצוניות העולמות יש "פנימיות דנשמות". כל המעשה
    (המצווה) וברכותיה הם בחיצוניות: האור הפנימי כנגד המעשה, והמקיף כנגד הברכה. ואילו "כל דבר התלוי בפה לבדו, כגון
    התפלה ועסק התורה", תלוי בפנימיות. והכוונה שבמחשבה היא הנשמה של שניהם.'
  rests_on:
  - work: etz-chaim
    ref: 40.2.1
    quote: כי החצוניות של כל עולם ועולם הוא בחי' חלק העשיה שיש בכל עולם
  - work: etz-chaim
    ref: 40.1.3
    quote: וכל זה נקרא חיצוניות העולמות וכנגדן יש גם כן שלשה כלים פנימיות דנשמות
  - work: etz-chaim
    ref: 40.2.1
    quote: וכל המעשה הוא וברכותיה הכל הוא בחיצוניות
  - work: etz-chaim
    ref: 40.2.1
    quote: אכן כל דבר התלוי בפה לבדו כגון התפלה ועסק התורה הכל תלוי בפנימיות
  - work: etz-chaim
    ref: 40.2.1
    quote: ואמנם הכונה במחשבה הוא הנשמה
- meaning: 'באדם ובפרצוף: הנשמות נקראות פנימיות, והכלים (הגוף) חיצוניות.'
  rests_on:
  - work: etz-chaim
    ref: 41.1.2
    quote: כלל העולה כי הנשמות נקראו פנימיות והכלים שהוא הגוף נקרא חיצוניות
- meaning: 'בשער הכוונות: חיצוניות העולמות היא כללות העולמות עצמם, "כסא הכבוד ומלאכים ואופנים"; פנימיות העולמות
    הן הנשמות שבהם: הנפשות של בני אדם בעשיה, הרוחות ביצירה, הנשמות בבריאה. בעליית העולמות עולות רק הנפשות, הרוחות
    והנשמות; העולמות עצמם, החיצוניות, נשארים במקומם וחוזרים להיות בבחינת פנימיות.'
  rests_on:
  - work: shaar-hakavanot
    ref: Sermons on Morning Prayers.2.2
    quote: חיצוניות העולמות הוא בחי' כללו' העולמות בבחי' חיצונית' הנקר' כסא הכבוד ומלאכים ואופנים
  - work: shaar-hakavanot
    ref: Sermons on Morning Prayers.2.2
    quote: פנימיות העולמות שהם בחי' הנפשות של בני אדם דעשיה והרוחו' שביצירה והנשמות שבבריאה
  - work: shaar-hakavanot
    ref: Sermons on Morning Prayers.1.3
    quote: שאינם עולים רק בחינת הנפשות והרוחות והנשמות אשר בהם בלבד אבל העולמות עצמן אינן עולים
  - work: shaar-hakavanot
    ref: Sermons on Morning Prayers.3.5
    quote: כי העולמות הנקרא חיצוניות אינם עולים כלל אמנם נשארים במקומם וחוזרים להיות בחינת פנימיות
  - work: shaar-hakavanot
    ref: Sermons on Tzitzit.5.2
    quote: כי המלאכים הם חיצו' בבחי' העולמו'
caution: 'ההגהה: "התפלה בפנימית והמצוה בחיצוניות", בציון "ע"ח ש"מ דרוש ג''", ובקובץ הזה המקום הוא 40.2.1 (ראה sources.yaml
  numbering). שני המובנים קרובים ואינם אחד.'
