# Lexicon entry. Format: knowledge/README.md. Check: python scripts/lexicon.py --check
term: אימא / בינה / תבונה
forms:
- אימא
- אמא
- בינה
- תבונה
category: פרצופים ועולמות
senses:
- meaning: הספירה והפרצוף שממנה הצלם, הלבוש שהנשמה מתלבשת בו ("החלק שנתנה האם בבנה"). היא מאירה בבריאה, "אמא מקננא
    בכורסייא", והבריאה מקבלת ממנה דרך מסך, שהוא "החשמל הזה".
  rests_on:
  - work: etz-chaim
    ref: 41.1.2
    quote: והוא החלק שנתנה האם בבנה
  - work: etz-chaim
    ref: 42.13.1
    quote: אמא מקננא בכורסייא שהוא ענין החשמ"ל הזה
  - work: etz-chaim
    ref: 42.13.1
    quote: והבריאה מקבלת מבינה
- meaning: 'בינה היא "עולם הבא" לצדיקים: קליפת נוגה שכנגד הבינה "הוא טוב ולא רע". מכאן בהגהה: הלבוש נמשך מאימא ולכן
    הוא שכר, "אך באמת הלבוש אינו העוה"ב" אלא מה שמאפשר לסבול את אורה.'
  rests_on:
  - work: etz-chaim
    ref: 49.3.1
    quote: ויש קלי' נוגה נגד בינה ושם הוא טוב ולא רע
  - work: etz-chaim
    ref: 49.3.1
    quote: לצדיקים בעולם הבא היא בינה
open: הזיהוי של בינה עם עולם הבא נמצא בעץ חיים 49.3.1 (בהקשר של קליפת נוגה). מקור נוסף שנרשם בעבודה, זוהר ח"ב ר"י
  ע"ב, לא הוצב כאן.
