# Lexicon entry. Format: knowledge/README.md. Check: python scripts/lexicon.py --check
term: לבושי הנשמה
forms:
- לבושים
- הלבושים
- לבושי הנשמה
- לבוש הנשמה
- לבושיהם
category: הנשמה ולבושיה
senses:
- meaning: 'הכלים של הנשמה, שבזוהר ויחי (רכ"ד) נקראים לבושים: "מן יומין דב"נ" נעשים. לפי עץ חיים אינם נעשים חדשים
    על ידי התורה והמצוות. הם נפלו לנוגה בחטא אדם הראשון, ועל ידי התורה והמצוות מתבררים מן הרע ונעשים לבוש לנשמה.
    מן המצוות המעשיות לבוש הנפש, ומן התורה לבוש הרוח.'
  rests_on:
  - work: etz-chaim
    ref: 49.4.2
    quote: וכלים הם לבושים שיש לנר"ן כנזכר פ' ויחי דרכ"ד
  - work: etz-chaim
    ref: 49.5.1
    quote: אלו הלבושים הנזכר פרשת ויחי אין פי' שנעשה מחדש ע"י תורה ומצות אמנם מתבררים מהרע שנתערבו ע"י חטא אדה"ר
  - work: etz-chaim
    ref: 49.5.1
    quote: לא נתן הקב"ה תורה ומצות לישראל אלא לברר ולצרף ולהסיר הסיגים מהכסף שהם לבוש הנשמה
  - work: etz-chaim
    ref: 49.5.1
    quote: כי מן יומין דב"נ ממש נעשה לו לבושים
  - work: etz-chaim
    ref: 49.5.1
    quote: התורה מזדכך נוגה דיצירה לבוש הרוח
- meaning: 'בשער הכוונות (ברכות השחר): לבוש הנשמה הוא מן הקדושה. בחטא מפשיטים מן האדם את לבוש הקדושה ומלבישים את
    נשמתו לבוש הקליפה; חטא קל מחליש את הלבוש, חטא חמור מסלק אותו לגמרי. בכל בוקר המלכות העליונה, שבידה הופקדה הנשמה
    בלילה, מחדשת: למי שנסתלק לבושו נותנת לבוש ("מלביש ערומים"), ולמי שנחלש נותנת כח ("הנותן ליעף כח"), על ידי השם
    א"ל. לבוש הנשמה נמשך משם אלו"ה, א"ל ו"ה.'
  rests_on:
  - work: shaar-hakavanot
    ref: Sermons on Morning Blessings.17
    quote: וע"י כך מפשיטין מעליו לבוש הקדושה ומלבישין לנשמתו לבוש הקלי'
  - work: shaar-hakavanot
    ref: Sermons on Morning Blessings.17
    quote: כי אם החטא הוא קל מתחלש כח הלבוש ההוא
  - work: shaar-hakavanot
    ref: Sermons on Morning Blessings.17
    quote: ואם החטא הוא חמור מסתלק הלבוש לגמרי מעליו
  - work: shaar-hakavanot
    ref: Sermons on Morning Blessings.17
    quote: ומי שנסתלק ממנו לבושו נותנת אליו בבקר בחי' לבוש ומי שיש לו לבוש אלא שנחלש היא נותנת כח בלבוש ההוא
  - work: shaar-hakavanot
    ref: Sermons on Morning Blessings.17
    quote: וחידוש זה נעשה ע"י השם אל המתעורר בבקר בסו' החסד
  - work: shaar-hakavanot
    ref: Sermons on Morning Blessings.17
    quote: כי לבוש הנשמה נמשך משם אלוה
caution: 'זו נקודת הפתיחה של ההגהה "לשון אדמו"ר נ"ע בעצמו" (תו"א חיי שרה): הלבושים "מתבררים" ואינם נבראים. וירידת
  הנשמה לגוף היא לברר את לבושיה, לא לתקן את עצמה.'
