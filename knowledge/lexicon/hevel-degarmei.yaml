# Lexicon entry. Format: knowledge/README.md. Check: python scripts/lexicon.py --check
term: הבל דגרמי
forms:
- הבל דגרמי
- הבל דגרמין
- הבל דגרמי'
category: שבירה, קליפות ובירור
senses:
- meaning: הניצוצות (מרפ"ח הניצוצין) שנשארו בתוך הכלים שנשברו. מהם הצלמים. בעיבור וביניקה אין בכלים אלא הבל דגרמי,
    ובגדלות נכנסים בהם נר"ן. הארת העור דז"א נקראת כך, והיא החשמל.
  rests_on:
  - work: etz-chaim
    ref: 26.1.2
    quote: סודם הן מן רפ"ח ניצוצין שנשארו בתוך הכלים שנשתברו הנקרא הבל דגרמי
  - work: etz-chaim
    ref: 41.2.1
    quote: בג' הכלים של הגדלות יש נר"ן אך בעיבור ויניקה אין בהם רק הבל דגרמי
  - work: etz-chaim
    ref: 42.4.1
    quote: הארת העור דז"א הנקרא הבל דגרמי
  - work: etz-chaim
    ref: 42.4.1
    quote: וזאת הבחי' נקרא חשמ"ל שהוא צלם הבל דגרמי שבעור
related:
- tzelem
- shivat-hamelachim
- chashmal
- ibur-yenika-mochin
status: draft
learned_from:
- discourses/004-levushei-haneshama
- discourses/004-levushei-haneshama/biur
caution: 'בעץ חיים 26.1 הבל דגרמי הוא הצלם הפנימי, וב-42.4 הוא החשמל שבעור. ההגהה מיישבת: "שניהם אור א'' הם, זה
  פנימי וזה מקיף".'
