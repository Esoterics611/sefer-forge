# Lexicon entry. Format: knowledge/README.md. Check: python scripts/lexicon.py --check
term: יש ואין (ביטול היש לאין)
forms:
- ביטול היש לאין
- ביטול היש
- יש ודבר בפ"ע
category: תורה, מצוות ותפילה
senses:
- meaning: '"יש" הוא מה שמרגיש את עצמו כמציאות לעצמו, "יש ודבר בפני עצמו"; "אין" הוא מה שבטל ואינו מרגיש את עצמו. בפדה בשלום:
    הביטול שבפנימיות החכמה הוא "ביטול היש לאין" בפועל, ולא בהבנה בלבד, ולכן גם ההתבוננות מביאה אליו, מה שאין כן אהבה של "בכל
    נפשך".'
  rests_on:
