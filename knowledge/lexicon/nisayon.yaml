term: נסיון
forms:
- נסיון
- ניסיון
category: תורה, מצוות ותפילה
senses:
- meaning: 'בפדה בשלום: מצב שבו שני רצונות עומדים זה כנגד זה, ואפשר שיגבר כל אחד מהם. כל זמן שהחיה והיחידה שבנפש הבהמית מאירות,
    הרצון האלקי גובר על הרצון הזר, וזה נסיון, כמו "והאלקים נסה את אברהם"; למעלה מזה הדבר "מוחלט שאין בו ספק כלל".'
