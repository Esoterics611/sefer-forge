# Lexicon entry. Format: knowledge/README.md. Check: python scripts/lexicon.py --check
term: 'שלושה כלים: פנימי, אמצעי, חיצון'
forms:
- ג' כלים
- כלי פנימי
- כלי אמצעי
- כלי חיצון
- פנימי אמצעי וחיצון
category: פרצופים ועולמות
senses:
- meaning: 'כל פרצוף, וכן גוף האדם, בנוי משלושה כלים: חיצון, אמצעי ופנימי (מוח, לב, כבד). כלי האצילות נעשים נשמה
    לבי"ע: הכלים הפנימיים של ז"א דאצילות לז"א דבריאה, האמצעיים לז"א דיצירה, החיצוניים לז"א דעשייה. לכן אין בי"ע
    "אלהות גמור", שנשמתם כלים ולא אורות.'
  rests_on:
  - work: etz-chaim
    ref: 26.2.1
    quote: והם ג' בחי' חיצון אמצעי ופנימי והם מוח לב כבד
  - work: etz-chaim
    ref: 44.5.1
    quote: הם י"ס (הכלים) הפנימים מג' בחי' (כלים) שיש בז"א דאצילות
  - work: etz-chaim
    ref: 44.5.4
    quote: נשמת ז"א דיצירה הם י"ס אמצעים יש בז"א דאצילות
  - work: etz-chaim
    ref: 44.5.8
    quote: נשמת ז"א דעשיה הם י"ס החיצונים של ז"א דאצי'
  - work: etz-chaim
    ref: 40.8.1
    quote: משם ולמטה כלים דאצילות נעשה נשמה לבי"ע
- meaning: 'לכל ספירה שלושה שמות כנגד שלושת כליה. בתפארת דז"א: החיצון הוי"ה (כ"ו), האמצעי ע"ב, הפנימי מ"ה. בהגהה:
    הכוונה בשם מ"ה היא בכלי הפנימי, שאינו מלובש בעשייה כלל.'
  rests_on:
  - work: etz-chaim
    ref: 44.3.8
    quote: הת"ת החיצון יהו"ה כ"ו האמצעי י' י"ה יה"ו יהו"ה ע"ב הפנימי יו"ד ה"א וא"ו ה"א מ"ה
related:
