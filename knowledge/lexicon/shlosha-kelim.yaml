term: 'שלושה כלים: פנימי, אמצעי, חיצון'
forms:
- ג' כלים
- כלי פנימי
- כלי אמצעי
- כלי חיצון
- פנימי אמצעי וחיצון
category: פרצופים ועולמות
senses:
- meaning: 'כל פרצוף, וכן גוף האדם, בנוי משלושה כלים: חיצון, אמצעי ופנימי (מוח, לב, כבד). הכלים הפנימיים של ז"א
    דאצילות נעשים נשמה לז"א דבריאה. הסדר הזה (פנימי לבריאה, אמצעי ליצירה, חיצון לעשייה) הוא קריאה של עבודת 004 ועדיין
    לא הוצב כאן בציטוט מלא.'
  rests_on:
  - work: etz-chaim
    ref: 26.2.1
    quote: והם ג' בחי' חיצון אמצעי ופנימי והם מוח לב כבד
  - work: etz-chaim
    ref: 44.5.1
    quote: הם י"ס (הכלים) הפנימים מג' בחי' (כלים) שיש בז"א דאצילות
