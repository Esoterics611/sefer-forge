term: אור פנימי ואור מקיף
forms:
- או"פ
- או"מ
- אור פנימי
- אור מקיף
- מקיף
- מקיפים
abbrev:
  או"פ: אור פנימי
  או"מ: אור מקיף
category: פרצופים ועולמות
senses:
- meaning: 'האור הנכנס בכלי, והאור הנשאר מחוצה לו וסובבו. בצלם: החלק המקיף הוא החשמל. במצוות: האור הפנימי כנגד המעשה,
    והמקיף כנגד הברכה. מוחין שמסתלקים מן הראש אחרי התפילה נעשים לו אור מקיף.'
  rests_on:
  - work: etz-chaim
    ref: 40.2.1
    quote: או"פ כנגד המעשה ואו"מ כנגד הברכה
  - work: etz-chaim
    ref: 26.2.1
    quote: חלק הצלם הנשאר בסוד המקיף מבחוץ
  - work: pri-etz-chaim
    ref: Gate of Prayer.7.19
    quote: ושם נעשין אליו בחי' אור מקיף
- meaning: 'בשער הכוונות, במצוות: "כל מצוה הנעשית בדיבור ובהבל הפה" היא אור מקיף. המעשה (נטילת ידים, יפנה) מתקן
    את האור הפנימי, והברכה שעליו (על נטילת ידים, אשר יצר), שהיא הבל היוצא מן הפה, מתקנת את האור המקיף.'
  rests_on:
  - work: shaar-hakavanot
    ref: Sermons on Morning Prayers.3.2
    quote: כנודע כי כל מצוה הנעשית בדיבור ובהבל הפה הוא בחי' אור מקיף
  - work: shaar-hakavanot
    ref: Sermons on Morning Prayers.3.2
    quote: ואמנם ע"י שני ברכות שמברכין ענ"י כשנוטל ידיו ואשר יצר כשיפנה נתקן אוה"מ שלהם
  - work: shaar-hakavanot
    ref: Sermons on Morning Prayers.2.2
    quote: וע"י ברכת אשר יצר שה"ס הבל היוצא מן הפה בעת שמברך הוא מתקן אוה"מ דעולם העשיה
