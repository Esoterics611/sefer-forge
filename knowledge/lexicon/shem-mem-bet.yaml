# Lexicon entry. Format: knowledge/README.md. Check: python scripts/lexicon.py --check
term: שם מ"ב (אנא בכח)
forms:
- שם מ"ב
- אנא בכח
- אבגית"ץ
category: שמות
senses:
- meaning: שם של היצירה. באמירת "אנא בכח" חוזרת העשיה להיות יצירה; שמו האחרון, שקוצי"ת, הוא מלכות דיצירה.
  rests_on:
  - work: shaar-hakavanot
    ref: Sermons on Morning Prayers.3.9
    quote: שם אחרון שבשם מ"ב שקוצי"ת ויש בו ו' אותיות ותכוין כי ע"י ששה שמות דאבגית"ץ
- meaning: 'אצל הרש"ש: שם מ"ב הוא היראה הפנימית והחיצונית שבכל אור, שלא יעלה למקורו יותר מן הראוי ולא ירד מגבולו; מקומו ביצירה,
    בחג"ת. ששת שמותיו הראשונים מעלים שש מדרגות של העשיה להלביש את מלכות היצירה, שקוצי"ת.'
  rests_on:
  - work: nahar-shalom
    ref: 25b.6
    quote: והנה יראה זו היא שם מ"ב שהוא בחינת גבורה כמספר יראה
  - work: nahar-shalom
    ref: 26a.1
    quote: להלביש פנימיות וחיצוניות מלכות דיצירה העומדת שם שבה שש אותיות דשם השביעי שקוצי"ת
