# Lexicon entry. Format: knowledge/README.md. Check: python scripts/lexicon.py --check
term: קוצין, נימין ושערות
forms:
- קוצין
- נימין
- קוצא דשערי
category: פרצופים
senses:
- meaning: שלושה מיני שערות בראש ז"א, כנגד מוחין דעיבור, דיניקה ודגדלות.
  rests_on:
  - work: shaar-hakavanot
    ref: Sermons on Tzitzit.2.4
    quote: יש שלש מיני שערות ונקרא קוצין ונימין ושערות ופשר הדבר הוא כי כבר ביארנו
- meaning: 'אצל הרש"ש, בכוונת הטלית: הקוצים (עיבור) עד החזה הם הציציות, מקיף לרחל; הנימין (יניקה) עד הגרון, מקיף ללאה; השערות
    (גדלות) עד ראש הקרקפתא, מקיף לז"א. וקוצא דשערי דא"א מכה בעורף ז"א ומגלה הארת מוחיו.'
  rests_on:
  - work: nahar-shalom
    ref: 15b.8
    quote: והם הציצית דטלית הנז'
  - work: nahar-shalom
    ref: 15b.8
    quote: יכוין להמשיכם לאור מקיף לנוק' העליונה הנק' לאה
  - work: nahar-shalom
    ref: 16b.11
    quote: להכות בעורף ז"א
related:
- tzitzit
