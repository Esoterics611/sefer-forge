# Lexicon entry. Format: knowledge/README.md. Check: python scripts/lexicon.py --check
term: קוצין, נימין, שערות (שערות ראש ז"א)
forms:
- קוצין
- קוצים
- נימין
- קוצא דשערי
- שערות
category: פרצופים ועולמות
senses:
- meaning: 'שלושה מיני שערות בראש ז"א, כנגד שלושה זמני המוחין: הקוצין, התקיפים, ממוחין דעיבור, הארוכים, עד החזה,
    ראש רחל; הנימין, הרכים יותר, ממוחין דיניקה, עד הגרון, ראש לאה; השערות, הרכות מכולן, ממוחין דגדלות, הקצרות, רק
    עד גולגלתא דז"א, לצורך עצמו, זקופות ומקיפות את ראשו.'
  rests_on:
  - work: shaar-hakavanot
    ref: Sermons on Tzitzit.2.5
    quote: צומחין בראש ז"א הקוצין שהם תקיפין יוצאים ממוחין דעיבור והנימין דאינון שעיעין יתיר אינון ממוחין דזמן היניקה
      והשערות דאינון שעיעין יתיר מכולהו אינון ממוחין דגדלות
  - work: shaar-hakavanot
    ref: Sermons on Tzitzit.2.5
    quote: ונמשכים עד הגרון דז"א עד רישא דנוק' עילאה הנקראת לאה
  - work: shaar-hakavanot
    ref: Sermons on Tzitzit.2.5
    quote: ואינן נמשכים רק עד גולגלתא דרישא דז"א בלבד והם לצורך עצמו ולא לזולתו
  - work: shaar-hakavanot
    ref: Sermons on Tzitzit.2.6
    quote: ולכן אלו השערות דמוחין דגדלות דרישא דז"א הם קצרים והם זקופים מעומד
related:
