# Lexicon entry. Format: knowledge/README.md. Check: python scripts/lexicon.py --check
term: חשמ"ל
forms:
- חשמ"ל
- חשמל
- החשמל
- ח"ש מ"ל
category: הנשמה ולבושיה
senses:
- meaning: חלק הצלם שנשאר מקיף מבחוץ. "חשמל" בגימטריא "מלבוש".
  rests_on:
  - work: etz-chaim
    ref: 26.2.1
    quote: חלק הצלם הנשאר בסוד המקיף מבחוץ הוא הנקרא חשמ"ל שהוא גימטריא מלבו"ש
- meaning: 'העור שעל הגוף (על הכלים): ה"מלבוש" שמבחוץ, הארת העור של ז"א, "הבל דגרמי". הוא בחינת המלכים שלא נתבררו,
    ולכן נקרא גם קליפת נוגה. באימא שמאירה בבריאה ("אמא מקננא בכורסייא") הוא "החשמל הזה".'
  rests_on:
  - work: etz-chaim
    ref: 41.1.2
    quote: וזה העור הוא בחי' המלכים שלא נתבררו ונקרא קליפת נוגה ונקרא חשמ"ל
  - work: etz-chaim
    ref: 41.1.2
    quote: כי חשמ"ל גימטריא מלבוש וכללות של העור כולו נקרא מלבוש
  - work: etz-chaim
    ref: 42.4.1
    quote: וזאת הבחי' נקרא חשמ"ל
  - work: etz-chaim
    ref: 42.13.1
    quote: אמא מקננא בכורסייא שהוא ענין החשמ"ל הזה
  - work: etz-chaim
    ref: 42.4.1
    quote: וכאשר העונות גורמין אז החשמל מסתלק ונשאר עור ז"א לבדו
- meaning: 'בשער הקליפות: החשמל הוא "הבשר", הקדושה שבתוך הקליפות, וקליפת נוגה סובבת אותו. "ח"ש" (החיצון) הוא הנוגה,
    ו"מ"ל" (הפנימי) הוא עצם החשמל. הוא "עץ הדעת טוב דאצילות".'
  rests_on:
  - work: etz-chaim
    ref: 49.2.1
    quote: וע"ז החששמל סובב הנוגה הקלי' רביעית
    note: the file reads "החששמל" (sic)
  - work: etz-chaim
    ref: 49.2.1
    quote: וז"ס ח"ש חשמ"ל ובתוכו מ"ל שהוא עצמות של החשמ"ל והוא הבשר
  - work: etz-chaim
    ref: 49.1.2
    quote: והוא סוד החשמ"ל המקיף לכל הכלים
- meaning: שלושה חשמלים, לבושי הנשמה בבריאה, ביצירה ובעשייה, "נסתלקו" מן האדם בחטא "ונפלו בנוגה". מכאן שהבירור הוא
    החזרתם.
  rests_on:
  - work: mikdash-melekh
    page: 1 36b
    quote: שהם ג' חשמלים שנסתלקו ממנה ונפלו בנוגה
- meaning: 'בשער הכוונות (ברכות השחר): החשמל הוא המלבוש החיצון של אימא עילאה, הלבוש החיצון ביותר של נה"י דאימא,
    שאינו נכנס בראש ז"א ונשאר מבחוץ, מלביש וסובב את זו"ן ומגן עליהם מן החיצונים מרוב עביותו. מצדדיהם הוא נקרא "מלבושים",
    ומתחת לרגליהם "מנעלים" (מבחינת נ"ה דאימא). "חשמל" בגימטריא "מלבוש" (שע"ח, שני שמות א"ל במילואם ושמונה אותיותיהם).'
  rests_on:
  - work: shaar-hakavanot
    ref: Sermons on Morning Blessings.18
    quote: והנה מן המלבוש החיצון דאימא עילאה הנק' חשמ"ל כי כן חשמ"ל בגי' מלבוש
  - work: shaar-hakavanot
    ref: Sermons on Morning Blessings.17
    quote: והוא בגימ' חשמ"ל לבוש הבינה המלבשת את זו"ן
  - work: shaar-hakavanot
    ref: Sermons on Morning Blessings.17
    quote: ועם ח' אותיו' א"ל אל"ף למ"ד הרי שע"ח גימטריא מלבוש
  - work: shaar-hakavanot
    ref: Sermons on Morning Blessings.21
    quote: ואמנם הלבוש היותר חיצוני מכל לבושי נה"י הנז' אינו נכנס תוך רישא דז"א ונשאר מבחוץ דזו"ן ומלביש וסובב אותם
  - work: shaar-hakavanot
    ref: Sermons on Morning Blessings.21
    quote: אשר ע"י אין הקלי' יונקת מן האור פנימי דז"א מפני רוב עביות החשמל הזה המפסיק ביניהם
  - work: shaar-hakavanot
    ref: Sermons on Morning Blessings.22
    quote: והבחי' המקפת אותם מצדדיהם נק' מלבושים והבחי' הסובבת מלמטה מתחת רגליהם נק' מנעלים
  - work: shaar-hakavanot
    ref: Sermons on Morning Blessings.23
    quote: כי אלו המנעלים שנעשים מחשמל דאימא כנ"ל הוא מבחי' נ"ה דאימא
  - work: shaar-hakavanot
    ref: Sermons on Morning Blessings.18
    quote: ואל תטעה ותחשוב כי זהו האוה"מ דז"א
  note: כאן מפורש שהחשמל הזה "בבחינת לבוש בלבד ולא בבחי' אור מקיף" (Sermons on Morning Blessings.18), ואילו המובן
    הראשון (עץ חיים 26.2.1) קורא לו "חלק הצלם הנשאר בסוד המקיף".
caution: אותה מילה בשלושה מובנים, שקרובים זה לזה ואינם אחד. ההגהה ("שער החשמל פ"א") מבארת למה דבר אחד נקרא גם חשמל
  וגם קליפת נוגה. לפני שמפרשים, יש לברר באיזה מובן מדובר.
