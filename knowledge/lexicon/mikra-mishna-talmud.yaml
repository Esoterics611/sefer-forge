term: מקרא, משנה, תלמוד וקבלה בעולמות
forms:
- מארי מקרא
- מארי משנה
- מארי תלמוד
- מקרא משנה ותלמוד
- מקרא
- משנה
- תלמוד
category: תורה, מצוות ותפילה
senses:
- meaning: 'לפי הזוהר: בעלי מקרא בעשייה, בעלי משנה ביצירה, בעלי תלמוד בבריאה, בעלי קבלה באצילות. ואף על פי כן כולם
    באצילות, "כי באצילות יש כל מה שלמטה ממנו".'
  rests_on:
  - work: pri-etz-chaim
    ref: Gate of Conduct While Learning.1.21
    quote: כי מארי מקרא הם בעשיה. ומארי משנה הם ביצירה. ומארי תלמוד בבריאה. ומארי קבלה באצילות
  - work: pri-etz-chaim
    ref: Gate of Conduct While Learning.1.21
    quote: אך הענין, כי באצילות יש כל מה שלמטה ממנו
- meaning: 'הכוונות בלימוד: בקבלה מכוונים לשם מ"ה. ההגהה לומדת מן השמות שמכוונים בהם שהמקרא, המשנה והתלמוד הם באצילות
    עצמה, וכל אחד יורד ומתלבש בעולם שלו (מקרא בעשייה, משנה ביצירה, תלמוד בבריאה), והקבלה אינה מתלבשת כלל.'
  rests_on:
  - work: pri-etz-chaim
    ref: Gate of Conduct While Learning.1.38
    quote: כשיקרא האדם קבלה, יכוין לשם מ"ה
  - work: pri-etz-chaim
    ref: Gate of Conduct While Learning.1.35
    quote: הוי"ה חיצונית, הויה בריבוע אמצעי, שם מ"ה פנימי
- meaning: 'אדמו"ר הזקן עצמו, בתניא פרק מ'' בהגהה: בלימוד מקרא מתפשט היחוד ואור אין סוף מאצילות עד העשייה, במשנה
    עד היצירה לבדה, בתלמוד עד הבריאה לבדה, "כי כולן באצילות", והקבלה אינה מתפשטת כלל לבי"ע. זו המקבילה הקרובה ביותר
    לסוף ההגהה בתורה אור.'
  rests_on:
  - work: tanya
    ref: Part I; Likkutei Amarim.40.13
    quote: ובמשנה עד היצירה לבדה, ובתלמוד עד הבריאה לבדה, כי כולן באצילות
  - work: tanya
    ref: Part I; Likkutei Amarim.40.13
    quote: אבל קבלה אינה מתפשטת כלל מאצילות לבריאה יצירה עשיה
caution: המילים "מקרא", "משנה", "תלמוד" לבדן שכיחות מאוד, ולכן --in מוצא אותן גם במקומות שאינם מדברים בענין הזה.
  ובפע"ח 1.21 "מארי מקרא הם בעשיה" וכו' נראה כחלוקה לעולמות; ההגהה מדגישה שכולם באצילות, וההבדל הוא רק עד היכן כל
  אחד יורד ומתלבש.
