# Ronnie's meanings of the terms: how each term is in the soul of a person and in the service of God,
# as he teaches them (`said:`, his words, checked against the file by scripts/teacher-terms.py --check),
# and where Claude applies his frame to a term he has not yet defined (`applied:`, Claude's, for him to
# confirm or correct). Kept apart from the lexicon's meanings from the sources (knowledge/README.md).
#
# The principle (002 introduction): every term is in two dimensions, "אחד כמו שהם בעולמות העליונים, השני
# כמו שהם בנפש האדם". The lexicon (knowledge/lexicon/) holds the first; this file the second.
#
# Fields: slug, term, forms (as texts write it: the build finds the term by these), lexicon (the lexicon
# entry, if any), soul (the meaning in the soul and the service, in Hebrew, one or two sentences),
# said: [{quote, where (file), at (heading in it)}], applied (Claude's application, when there is no said),
# related.

principle:
  soul: >-
    המבנה שבנפש האדם, המחשבה, הדיבור והמעשה ומבני הנפש עצמה, מקביל לבניין העולמות כולם; לכן כל מושג
    בקבלה מתפרש בשני ממדים, כמו שהוא למעלה וכמו שהוא בנפש, ו"מבשרי אחזה אלוה".
  said:
    - quote: 'בשני מימדים: אחד כמו שהם בעולמות העליונים, השני כמו שהם בנפש האדם'
      where: discourses/002-shaar-hayichud/introduction.md
      at: חב"ד וישראל סבא ותבונה במבנה הנפש
    - quote: 'הם מקבילים לגמרי לבניין העולמות כולם. כמו שהנפש ממלא את הגוף, ככה הקדוש ברוך הוא ממלא את העולם'
      where: discourses/002-shaar-hayichud/introduction.md
      at: ההתבוננות — יסוד עבודת חב"ד
  kavanah: >-
    כוונות הקבלה פועלות בעולמות העליונים בשמות ובפרטים; כוונות החסידות מתבוננות באותם מבנים כדי לעורר אהבה
    ויראה בלב ולתקן את המידות. ההתבוננות היא הכוונה של החסידות.
  kavanah_said:
    - quote: 'הכוונות של המקובלים — הם מכוונים בשמות עליונים שרומזים לעניינים נשגבים בעולמות עליונים, ומכוונים לשם. והכוונה הזאת היא בחינת ההתבוננות'
      where: discourses/002-shaar-hayichud/introduction.md
      at: כוונות הקבלה וכוונות החסידות

terms:
  - slug: chochma
    term: חכמה (אבא)
    forms: [חכמה, חוכמה, אבא]
    soul: >-
      נקודת השכל שבהעלם, "ברק המבריק", קודם שהיא מלובשת באותיות; המעיין שממנו נובע השכל, ונקראת אין, כי
      עדיין אינה מושגת.
    said:
      - quote: 'בחינת החכמה זה ברק המבריק'
        where: discourses/002-shaar-hayichud/introduction.md
        at: חב"ד וישראל סבא ותבונה במבנה הנפש
      - quote: 'והחוכמה נקראת אין, והבינה הנקראת כבר יש'
        where: discourses/002-shaar-hayichud/sessions/010/transcript.md
        at: נהר יוצא מעדן — החכמה נקראת אין
      - quote: 'בבינה היא כבר מתחילה להתלבש באותיות'
        where: discourses/002-shaar-hayichud/sessions/011/transcript.md
        at: ז' תחתונות דבינה — מידות שבשכל
    related: [bina, mochin]
  - slug: bina
    term: בינה (אימא)
    forms: [בינה, אימא, אמא]
    lexicon: ima-bina
    soul: >-
      הנהר: נקודת החכמה מקבלת בה אורך, רוחב ועומק, עד שיכולה להתלבש באותיות המחשבה; "מבין דבר מתוך דבר".
    said:
      - quote: 'ובינה זה כבר רוחב שבו מלובש ברק המבריק הזה'
        where: discourses/002-shaar-hayichud/introduction.md
        at: חב"ד וישראל סבא ותבונה במבנה הנפש
      - quote: 'שזה נהר המחשבה שמתגלה בו נקודת הפנימיות, שהיא החוכמה'
        where: discourses/002-shaar-hayichud/sessions/011/transcript.md
        at: אבא ואמא תתאין — ישראל סבא ותבונה
    related: [chochma, tevuna, iyun]
  - slug: iyun
    term: פנימיות בינה, עיון, התבוננות (שער הנו"ן)
    forms: [התבוננות, עיון, פנימיות בינה, שער הנו"ן]
    soul: >-
      הכוח להתעכב על עצם הנקודה ולחפור בה עד עומק המושג, הפך הסקירה המהירה; ממנו נובעים שכלים חדשים. זו
      עבודת ההתבוננות, הכוונה של החסידות בתפילה.
    said:
      - quote: 'יש כוח בשכל שהוא נקרא כוח העיון, והוא נקרא פנימיות בינה'
        where: discourses/002-shaar-hayichud/sessions/010/transcript.md
        at: פתיחה — מהות ההתבוננות
      - quote: 'השער הנו"ן זה עניין של כוח העיון, שמשם נובעות רעיונות חדשים'
        where: discourses/002-shaar-hayichud/sessions/010/transcript.md
        at: שער הנו"ן — העיון כעיכוב המחשבה
    related: [bina, omek, pnimiyut-atik]
  - slug: omek
    term: עומק, אורך ורוחב (של המושכל)
    forms: [עומק המושג, אורך ורוחב]
    soul: >-
      העומק הוא עצם נקודת המושג, שממנו הכל נובע; הרוחב ריבוי הפרטים; האורך ירידת המושג במשלים עד שאפילו
      תינוק משיג. רק אחר האורך והרוחב מגיעים אל העומק.
    said:
