        at: ז' תחתונות דבינה — מידות שבשכל
      - quote: 'והמידות זה אהבה ויראה, מבחינת זעיר אנפין ונוקבא'
        where: discourses/002-shaar-hayichud/sessions/011/transcript.md
        at: תבונה כבן ובת — להוליד מידות
    related: [mochin, nukva]
