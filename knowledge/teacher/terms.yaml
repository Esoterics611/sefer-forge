# Claude's applications of the frame to terms not yet defined in the shiurim (to confirm or correct).
applied_terms:
  - slug: maaseh-dibur
    term: מעשה ודיבור (בתפילה)
    forms: [מעשה ודיבור, המעשה, הדיבור]
    lexicon: maaseh-vedibur
    applied: >-
      המעשה מתקן את הלבושים במקומם, כבחירה שבמצוות המעשיות; הדיבור, שבו עולה הנשמה עצמה, מעלה מעולם לעולם,
      מן המעשה אל הדיבור, אל המחשבה, אל הרבדים העמוקים. נשען על נר"ן ולבושים (004, הערות ג'–ד').
    related: [levushim, naran]
  - slug: pnimiyut-chitzoniyut
    term: פנימיות וחיצוניות העולמות
    forms: [פנימיות, חיצוניות]
    lexicon: penimiyut-chitzoniyut
    applied: >-
      החיצוניות היא העולם עצמו, ובנפש הלבושים והכלים, דפוסי המחשבה, הדיבור והמעשה; הפנימיות היא הנשמות, ובנפש
      הנר"ן עצמם המאירים בהם.
    related: [levushim, naran]
  - slug: katnut-gadlut
    term: קטנות וגדלות; עיבור, יניקה ומוחין
    forms: [קטנות, גדלות, עיבור, יניקה]
    lexicon: ibur-yenika-mochin
    applied: >-
      קטנות היא המידות כשאין בהן עדיין שכל, הרגל בלי התבוננות; גדלות היא המידות כשהשכל מאיר בהן. עיבור,
      יניקה וגדלות הם שלבי כניסת ההבנה במידות: כבוש, ניזון, עומד בעצמו.
    related: [mochin, zeir-anpin]
  - slug: or-pnimi-makif
