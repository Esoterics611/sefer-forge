    forms: [רחל, נקודת המלכות]
    applied: >-
      אם לאה היא אותיות המחשבה, רחל היא הגילוי למטה, הדיבור והמעשה; "עולימתא שפירתא דלית לה עיינין": הביטוי
      שאין בו עדיין ראייה מן הפנימיות.
    related: [leah, nukva]
  - slug: kaddish
