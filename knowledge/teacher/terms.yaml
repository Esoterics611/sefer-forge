    soul: >-
      הנביעה עצמה, שורש השכל שלמעלה מן השכל, הנפש שלמעלה מזמן ומקום; מתגלה על ידי פנימיות בינה, ובשלמות
      רק לעתיד לבוא.
    said:
      - quote: 'שהבחינה של פנימיות עתיק זה הבחינה של הנביעה עצמה, של המעיין'
