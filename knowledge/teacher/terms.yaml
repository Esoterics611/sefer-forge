      - quote: 'פנימיות עתיק זה הפנימיות של הפנימיות של הכתר, שזו הבחינה שמתגלה רק לעתיד לבוא'
        where: discourses/002-shaar-hayichud/sessions/010/transcript.md
        at: למעלה אפילו מן החכמה — פנימיות בינה היא פנימיות עתיק
    related: [iyun, chochma]
