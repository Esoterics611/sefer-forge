        where: discourses/002-shaar-hayichud/introduction.md
        at: עלמין סתימין ועלמין דאתגליין — שמע ישראל
      - quote: 'the parallel between speech and feelings - emotive attributes is correct - these 2 levels both map to the world of yetzirah'
        where: knowledge/teacher/said/2026-11-16.md
        at: in writing, 2026-11-16
    applied: >-
      הבריאה המחשבה, העשיה המעשה. ההקבלה של הבריאה ושל העשיה היא יישום של העיקרון; של היצירה, הדיבור והרגש
