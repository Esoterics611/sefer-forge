    forms: [אור פנימי, אור מקיף, מקיף, מקיפים]
    lexicon: or-pnimi-makif
    applied: >-
      אור פנימי הוא מה שנקלט ומובן ונכנס במידות; אור מקיף הוא מה שמשפיע מבחוץ ואינו נקלט, כמו הכוונה בברכה
      שמקיפה את המעשה.
    related: [maaseh-dibur]
  - slug: panim-achor
    term: אחור באחור, פנים בפנים, נסירה
    forms: [אחור באחור, פנים בפנים, אב"א, פב"פ, נסירה]
    applied: >-
      אחור באחור: השכל והמידות, או המידות והביטוי, פועלים כל אחד לעצמו; פנים בפנים: מכוונים זה אל זה והביטוי
      מקבל מן הפנימיות; הנסירה היא ההפרדה שמאפשרת פנים בפנים.
    related: [zivug, zeir-anpin, nukva]
  - slug: rachel
