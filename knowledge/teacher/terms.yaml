        at: מלכות התבונה — אותיות המחשבה ולאה
      - quote: 'שבתוך השכל עדיין יש איכשהו איך שאני מתייחס אל זה, אבל זה בתת־מודע'
        where: discourses/002-shaar-hayichud/sessions/011/transcript.md
        at: מלכות התבונה — אותיות המחשבה ולאה
    related: [tevuna, abba-ima, zeir-anpin]
  - slug: abba-ima
