# Booklets of shivchei-habesht-simple.md, grouped by theme.
# Built by: python scripts/build-booklets.py  ->  output/booklets/*.pdf
#   English:  --lang en  ->  output/booklets/en/*.pdf  (shivchei-habesht-simple-en.md)
#   French:   --lang fr  ->  output/booklets/fr/*.pdf  (shivchei-habesht-simple-fr.md)
#
# `stories` are the story numbers of the original book (0 = הקדמת הכותב).
# Every story 0-210 appears in exactly one booklet; the build fails otherwise.
# Within a booklet the stories print in ascending order.

series: "שבחי הבעל שם טוב"
subtitle: "בעברית של ימינו"
source: shivchei-habesht-simple.md

# The English and French booklets (build-booklets.py --lang en|fr) take the
# same grouping, with each booklet's `en` / `fr` title below.
languages:
  en:
    series: "In Praise of the Baal Shem Tov"
    subtitle: "Retold in Modern English"
  fr:
    series: "Les louanges du Baal Chem Tov"
    subtitle: "Racontées en français d'aujourd'hui"

booklets:
