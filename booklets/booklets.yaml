# Built by: python scripts/build-booklets.py  ->  output/booklets/*.pdf
#
# `stories` are the story numbers of the original book (0 = הקדמת הכותב).
# Every story 0-210 appears in exactly one booklet; the build fails otherwise.
# Within a booklet the stories print in ascending order.

