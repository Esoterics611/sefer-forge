# Short glossary printed at the back of each booklet.
# An entry is printed only if one of its `forms` occurs in that booklet's
# text (as a whole word, optionally with the prefixes ו ה ב ל מ ש כ).
# `forms` defaults to [term].

- term: אדון
  def: בעל אחוזה פולני (פריץ), שהכפרים והעיירות שבתחומו היו שלו.
- term: הוי"ה
  def: שם ה' בן ארבע האותיות, שאין מבטאים אותו כפי שהוא נכתב.
- term: ועד ארבע ארצות
  def: המוסד העליון של יהודי פולין, שבו נפגשו נציגי הקהילות.
- term: וידוי
  def: אמירת החטאים לפני ה', בתפילה או לפני המוות.
- term: זהוב
  forms: [זהוב, זהובים]
  def: מטבע פולני.
- term: זוהר
  def: ספר הזוהר, הספר המרכזי של הקבלה.
- term: חוכר, חכירה (ארענדע)
  forms: [חוכר, חוכרים, חכירה, ארענדע]
  def: זכות שיהודי שכר מהאדון תמורת תשלום קבוע, למשל להחזיק פונדק, למכור משקאות או לגבות מכס. מי ששכר אותה נקרא חוכר.
- term: חזרת הש"ץ
  def: החזרה של תפילת שמונה עשרה בקול רם על ידי החזן (שליח הציבור).
- term: חרם
  def: נידוי. גזירה של רב או של קהילה להתרחק מאדם מסוים.
- term: יין שרף
  def: משקה חריף, כמו וודקה.
- term: כוונות
  forms: [כוונות, הכוונות]
  def: מחשבות שמכוונים בזמן התפילה או המצווה, לפי הקבלה.
- term: כרוז
  def: הכרזה בשמים על דבר שנגזר. צדיק יכול לשמוע אותה.
- term: מגיד
  def: דרשן של קהילה. "המגיד ממזריטש" הוא רבי דוב בער, תלמידו של הבעל שם טוב וממשיך דרכו.
- term: מוהל
  def: מי שעושה את ברית המילה.
- term: מוזג
  def: מי שמוכר משקאות בפונדק.
- term: מוכיח
  def: דרשן שעסק בתוכחה ובמוסר. "המוכיח מפולנאה" הוא רבי אריה לייב, מתלמידי הבעל שם טוב.
- term: מוכסן
  forms: [מוכסן, מוכסנים]
  def: יהודי שחכר מהאדון את המכס, ולפעמים גם את הפונדק ואת מכירת המשקאות בכפר.
- term: מורה הוראה
  def: רב שפוסק בשאלות של הלכה בקהילה.
- term: מזיק
  forms: [מזיק, מזיקים]
  def: שד. כוח רע שפוגע בבני אדם.
- term: מחשבה זרה
  forms: [מחשבה זרה, מחשבות זרות]
  def: מחשבה שאינה שייכת לתפילה, ונכנסת לאדם בזמן שהוא מתפלל.
- term: מלמד
  def: מורה של ילדים קטנים ב"חדר".
- term: מעשה מרכבה
  def: הסודות העמוקים ביותר של התורה.
- term: מקווה
  def: בור מים לטבילה. חסידים טובלים בו גם לפני התפילה.
- term: משכון
  def: חפץ שנותנים למלווה, כדי להבטיח שההלוואה תוחזר.
- term: מקטרג, קטרוג
  forms: [מקטרג, קטרוג]
  def: קטרוג הוא טענה בשמים נגד אדם או נגד עם ישראל. מקטרג הוא מי שמעלה אותה.
- term: נדוניה
  def: הכסף שהורי הכלה נותנים לזוג הצעיר.
- term: נעילה
  def: התפילה האחרונה של יום כיפור.
- term: ניצוצות
  def: לפי הקבלה, ניצוצות של קדושה שנפלו לעולם. הצדיק מעלה אותם ומתקן אותם.
- term: סנדק
  def: מי שמחזיק את התינוק על ברכיו בזמן ברית המילה. זה כבוד גדול.
- term: עגונה
  def: אישה שבעלה נעלם, ואינה יכולה להינשא שוב כי אין עדות שהוא מת.
- term: עין יעקב
  def: ספר שמקבץ את סיפורי האגדה שבתלמוד.
- term: עלילה
  forms: [עלילה, עלילת דם]
  def: האשמת שקר נגד יהודים. בעלילת דם האשימו אותם ברצח נוצרי.
- term: עליית נשמה
  def: מצב שבו נשמת הצדיק עולה לעולמות העליונים, בזמן שגופו נשאר כאן.
- term: פדיון הבן
  def: מצווה לפדות בן בכור מכהן, בחמישה שקלים, ביום השלושים ואחד ללידתו.
- term: פדיון שבויים
  def: שחרור יהודים מכלא או משבי תמורת כסף.
- term: פרסה
  forms: [פרסה, פרסאות]
  def: מידת מרחק של כמה קילומטרים.
- term: קומיסר
  def: פקיד של האדון, שניהל בשמו את העיר או את האחוזה.
- term: קידוש לבנה
  def: ברכה על הירח החדש, שאומרים בחוץ בלילה, בתחילת החודש.
- term: קליפה
  forms: [קליפה, קליפות]
  def: לפי הקבלה, כוח הרע, שמכסה על הקדושה כמו קליפה על פרי.
- term: קלויז
  def: בית מדרש קטן, שבו לומדים ומתפללים.
- term: קמע
  forms: [קמע, קמעות]
  def: פתק שנכתבו בו שמות קדושים, לשמירה או לרפואה.
- term: קפיצת הדרך
  def: נס שבו אדם מגיע למקום רחוק בזמן קצר מאוד.
- term: רבנו תם
  def: תפילין של רבנו תם הן זוג תפילין שני, שהפרשיות שבו מסודרות לפי שיטת רבנו תם.
- term: שאלת חלום
  def: בקשה מן השמים שיענו על שאלה בחלום.
- term: שבתי צבי
  def: משיח השקר (1626–1676). אחרי מותו המשיכו קבוצות סודיות להאמין בו, והן נקראו "כת שבתי צבי".
- term: שוחט
  def: מי ששוחט בהמות ועופות לפי ההלכה. הסכין שלו צריכה להיות חלקה לגמרי.
- term: שכינה
  def: נוכחות ה' בעולם.
- term: שמות קדושים
  def: שמות של ה' ושל מלאכים. "בעל שם" השתמש בהם לרפואה ולשמירה.
- term: שר התורה
  def: המלאך הממונה על התורה.
- term: תולדות
  forms: [תולדות]
  def: הספר "תולדות יעקב יוסף" של רבי יעקב יוסף, הרב של פולנאה, תלמיד הבעל שם טוב.
- term: תיקון
  def: לפי הקבלה, תיקון של נשמה או של ניצוץ שנפגמו בחטא, והעלאה שלהם למקומם.
- term: תנאים
  def: הסכם השידוך שנכתב לפני החתונה. בו קובעים את הנדוניה ואת מועד החתונה.
