# A narration for video: booklet 13, rabbis and tzaddikim of his generation, part two (stories 61, 78, 116, 135, 144, 145; part one has 24, 25, 35), from the English booklets
# (shivchei-habesht-simple-en.md). Rules: prompts/narration-rules.md.
#
# Built by: python scripts/build-narration.py booklets/narration/tzaddikim-of-his-generation-part-two.yaml
#   -> output/narration/tzaddikim-of-his-generation-part-two/  (video.mp4, thumbnail.jpg, narration.mp3/.wav,
#      narration.srt, chapters.txt, script.txt)
#
# cut: paragraphs left out, by their opening words. drop: brackets that
# explain a word, by their opening words. edits: `from` -> `to`, each `from`
# found once in the story; the other brackets become part of the sentence.
# Respellings for the voice: booklets/narration/say-en.yaml. Summaries are not read.

title: "Tzaddikim of His Generation, Part Two"
lang: en
voice: am_michael
speed: 1.0

# The picture for the whole video: a wagon stopped on a dark road on Friday night, the stars, the first Sabbath candles in a far window. An original drawing
# (booklets/narration/images/draw.py), rendered by headless Chrome at build time.
image: booklets/narration/images/tzaddikim-of-his-generation-part-two.svg

intro: >
  In Praise of the Baal Shem Tov, retold in modern English.

outro: >
  Here end these stories from In Praise of the Baal Shem Tov.

stories:
  - n: 61

  - n: 78
    edits:
      - from: "And I heard from the rabbi, who said"
        to: "I heard from the rabbi, who said"
      - from: '(For his custom was to hear the "Kedushah" and the "Barchu" in all the synagogues.)'
        to: 'For his custom was to hear the "Kedushah" and the "Barchu" in all the synagogues.'

  - n: 116
    edits:
      - from: "(I heard the explanation from the Rabbi of Polonne and forgot it, but surely it is written in his books, and see there.)"
        to: "I heard the explanation from the Rabbi of Polonne and forgot it, but surely it is written in his books, and see there."

  - n: 135

  - n: 144
    drop:
      - "(in the Verses of Song)"
    edits:
      - from: "And by the way I will write what I heard from Rabbi Yechiel"
        to: "I heard from Rabbi Yechiel"
      - from: "(For the rabbi prayed in a small special room in the study house, and heard the Kedushah, Barchu and Amen from there.)"
        to: "For the rabbi prayed in a small special room in the study house, and heard the Kedushah, Barchu and Amen from there."

  - n: 145
    edits:
      - from: "Another story (of Rabbi Yechiel):"
        to: "Another story of Rabbi Yechiel:"
