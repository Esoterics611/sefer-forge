# A narration for video, in French: the same three stories as
# the-locked-gate.yaml, from the French booklets (shivchei-habesht-simple-fr.md).
# Rules: prompts/narration-rules.md.
#
# Built by: python scripts/build-narration.py booklets/narration/la-porte-verrouillee.yaml
#   -> output/narration/la-porte-verrouillee/  (video.mp4, thumbnail.jpg,
#      narration.mp3/.wav, narration.srt, chapters.txt, script.txt)
#
# cut: paragraphs left out, by their opening words. drop: brackets that
# explain a word, by their opening words. edits: `from` -> `to`, each `from`
# found once in the story; the other brackets become part of the sentence.
# Respellings for the voice: booklets/narration/say-fr.yaml; 'h is read as
# the French r. Summaries are not read. 161 recalls the ark in 17, so 17 first.

title: "La porte verrouillée"
lang: fr
voice: ff_siwis
speed: 1.0

# The same drawing as the English episode.
image: booklets/narration/images/the-locked-gate.svg

intro: >
  Les louanges du Baal Chem Tov, racontées en français d'aujourd'hui.

outro: >
  Ici s'achèvent ces récits des Louanges du Baal Chem Tov.

stories:
  - n: 17
    cut:
      # an afterword: his anger with the guests after Yom Kippur
      - "Et des paroles du rav de notre communauté, il ressort"
    edits:
      - from: "J'ai encore entendu de lui (de Rabbi Falk) :"
        to: "J'ai entendu de Rabbi Falk :"
      - from: "(Et aux gens de sa ville, il dit que la porte était grande comme le monde entier.)"
        to: "Et aux gens de sa ville, il dit que la porte était grande comme le monde entier."
      - from: "(Et il leur raconta que le cadenas était grand comme tout Mejibij.)"
        to: "Et il leur raconta que le cadenas était grand comme tout Mejibij."

  - n: 161
    edits:
      - from: "maison d'étude (je ne sais pas si c'était la prière du matin ou Moussaf du deuxième jour). Et"
        to: "maison d'étude ; je ne sais pas si c'était la prière du matin ou Moussaf du deuxième jour. Et"

  - n: 179
