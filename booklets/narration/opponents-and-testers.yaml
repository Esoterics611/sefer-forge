# A narration for video: booklet 14, opponents and testers (stories 48, 87, 99, 188, 189, 190; 14 is in Opponents Who Drew Close), from the English booklets
# (shivchei-habesht-simple-en.md). Rules: prompts/narration-rules.md.
#
# Built by: python scripts/build-narration.py booklets/narration/opponents-and-testers.yaml
#   -> output/narration/opponents-and-testers/  (video.mp4, thumbnail.jpg, narration.mp3/.wav,
#      narration.srt, chapters.txt, script.txt)
#
# cut: paragraphs left out, by their opening words. drop: brackets that
# explain a word, by their opening words. edits: `from` -> `to`, each `from`
# found once in the story; the other brackets become part of the sentence.
# Respellings for the voice: booklets/narration/say-en.yaml. Summaries are not read.

title: "Opponents and Testers"
lang: en
voice: am_michael
speed: 1.0

# The picture for the whole video: two wagons facing each other in a forest clearing, the robbers' shadows fleeing among the trees. An original drawing
# (booklets/narration/images/draw.py), rendered by headless Chrome at build time.
image: booklets/narration/images/opponents-and-testers.svg

intro: >
  In Praise of the Baal Shem Tov, retold in modern English.

outro: >
  Here end these stories from In Praise of the Baal Shem Tov.

stories:
  - n: 48
    drop:
      - "(to test him)"

  - n: 87
    drop:
      - "(a Lithuanian Jew)"

  - n: 99
    drop:
      - "(the cloth cutter)"
    edits:
      - from: "(That was the custom there: when a deal is closed, they exchange hats, and that is the sign that the deal is closed.)"
        to: "That was the custom there: when a deal is closed, they exchange hats, and that is the sign that the deal is closed."

  - n: 188
    drop:
      # a narrator's note inside the Baal Shem Tov's words
      - "(as is known, there is a mystical intention"
    edits:
      - from: "(And I heard that the Baal Shem Tov was of the soul of King David, and Rabbi Nachman of the soul of King Saul, and so he was David's enemy all his days.)"
        to: "And I heard that the Baal Shem Tov was of the soul of King David, and Rabbi Nachman of the soul of King Saul, and so he was David's enemy all his days."

  - n: 189

  - n: 190
    edits:
      - from: "Rabbi Nachman (of Kosov) heard"
        to: "Rabbi Nachman of Kosov heard"
