# How the narration voice says a word: shared by every plan in this folder
# (a plan's own `say:` adds to it, or overrides an entry). Applied to what
# is read only; the script and the subtitles keep the spelling.
#
# Check a respelling before adding it:
#   python scripts/build-narration.py --say Gershon Ghershon
# The voice reads espeak-ng's English phonemes: "kh" comes out as k, "ch" as
# in "church", so the Hebrew ח/כ is written h or k. Write a respelling as one
# word: a hyphen makes the voice stress every syllable, slow and foreign
# (smoothed 2026-11-03, at Ronnie's request); --say should show one stress
# mark (ˈ) per word. Add a name the first time a story uses it.

