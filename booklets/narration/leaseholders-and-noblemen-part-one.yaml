# A narration for video: booklet 18, leaseholders and noblemen, part one (stories 67, 110, 159; part two has 172, 173), from the English booklets
# (shivchei-habesht-simple-en.md). Rules: prompts/narration-rules.md.
#
# Built by: python scripts/build-narration.py booklets/narration/leaseholders-and-noblemen-part-one.yaml
#   -> output/narration/leaseholders-and-noblemen-part-one/  (video.mp4, thumbnail.jpg, narration.mp3/.wav,
#      narration.srt, chapters.txt, script.txt)
#
# cut: paragraphs left out, by their opening words. drop: brackets that
# explain a word, by their opening words. edits: `from` -> `to`, each `from`
# found once in the story; the other brackets become part of the sentence.
# Respellings for the voice: booklets/narration/say-en.yaml. Summaries are not read.

title: "Leaseholders and Noblemen, Part One"
lang: en
voice: am_michael
speed: 1.0

# The picture for the whole video: a nobleman's castle on a hill above a village, its tower lit, a river below. An original drawing
# (booklets/narration/images/draw.py), rendered by headless Chrome at build time.
image: booklets/narration/images/leaseholders-and-noblemen-part-one.svg

intro: >
  In Praise of the Baal Shem Tov, retold in modern English.

outro: >
  Here end these stories from In Praise of the Baal Shem Tov.

stories:
  - n: 67

  - n: 110
    drop:
      - "(the lease)"

  - n: 159
    drop:
      # a gloss inside the Baal Shem Tov's words
      - "(in prison)"
