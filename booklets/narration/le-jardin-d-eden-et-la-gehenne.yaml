    edits:
      - from: (Car il disait qu'une seule bougie fait du mal aux yeux, et trois aussi, mais que deux sont bonnes pour les yeux.)
        to: Car il disait qu'une seule bougie fait du mal aux yeux, et trois aussi, mais que deux sont bonnes pour les yeux.

  - n: 127

