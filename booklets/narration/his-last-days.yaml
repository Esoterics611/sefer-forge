# A narration for video: booklet 29, his last days (stories 77, 90, 105, 106, 107; 207 and 208 are in The Passing of the Baal Shem Tov or MATURE): the last episode, from the English booklets
# (shivchei-habesht-simple-en.md). Rules: prompts/narration-rules.md.
#
# Built by: python scripts/build-narration.py booklets/narration/his-last-days.yaml
#   -> output/narration/his-last-days/  (video.mp4, thumbnail.jpg, narration.mp3/.wav,
#      narration.srt, chapters.txt, script.txt)
#
# cut: paragraphs left out, by their opening words. drop: brackets that
# explain a word, by their opening words. edits: `from` -> `to`, each `from`
# found once in the story; the other brackets become part of the sentence.
# Respellings for the voice: booklets/narration/say-en.yaml. Summaries are not read.

title: "His Last Days"
lang: en
voice: am_michael
speed: 1.0

# The picture for the whole video: a bell on a string in a quiet house at dusk, the string running out through the door to a small house. An original drawing
# (booklets/narration/images/draw.py), rendered by headless Chrome at build time.
image: booklets/narration/images/his-last-days.svg

intro: >
  In Praise of the Baal Shem Tov, retold in modern English.

outro: >
  Here end these stories from In Praise of the Baal Shem Tov.

stories:
  - n: 77
    drop:
      - "(a fiery law for them)"
    edits:
      - from: "(From a man from Bar I heard that the question was how to pray for a sick person, with stories.)"
        to: "From a man from Bar I heard that the question was how to pray for a sick person, with stories."

  - n: 90

  - n: 105
    drop:
      # a gloss inside the Baal Shem Tov's words
      - "(for my wife has died)"

  - n: 106

  - n: 107
    edits:
      - from: "And the rabbi of our community said"
        to: "The rabbi of our community said"
