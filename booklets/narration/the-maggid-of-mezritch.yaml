# A narration for video: booklet 9, the Maggid of Mezritch (stories 34, 45, 47, 130, 200), from the English booklets
# (shivchei-habesht-simple-en.md). Rules: prompts/narration-rules.md.
#
# Built by: python scripts/build-narration.py booklets/narration/the-maggid-of-mezritch.yaml
#   -> output/narration/the-maggid-of-mezritch/  (video.mp4, thumbnail.jpg, narration.mp3/.wav,
#      narration.srt, chapters.txt, script.txt)
#
# cut: paragraphs left out, by their opening words. drop: brackets that
# explain a word, by their opening words. edits: `from` -> `to`, each `from`
# found once in the story; the other brackets become part of the sentence.
# Respellings for the voice: booklets/narration/say-en.yaml. Summaries are not read.

title: "The Maggid of Mezritch"
lang: en
voice: am_michael
speed: 1.0

# The picture for the whole video: a night of thunder and lightning over a small house, one window lit. An original drawing
# (booklets/narration/images/draw.py), rendered by headless Chrome at build time.
image: booklets/narration/images/the-maggid-of-mezritch.svg

intro: >
  In Praise of the Baal Shem Tov, retold in modern English.

outro: >
  Here end these stories from In Praise of the Baal Shem Tov.

stories:
  - n: 34
    drop:
      - "(a melancholy man)"

  - n: 45
    drop:
      - "(when the contracts were signed)"

  - n: 47

  - n: 130

  - n: 200
