# A narration for video: booklet 21, fit and unfit (stories 39, 100, 108, 139, 140, 151; 206 is MATURE): a short booklet standing alone, as neither neighbour shares its theme, from the English booklets
# (shivchei-habesht-simple-en.md). Rules: prompts/narration-rules.md.
#
# Built by: python scripts/build-narration.py booklets/narration/fit-and-unfit.yaml
#   -> output/narration/fit-and-unfit/  (video.mp4, thumbnail.jpg, narration.mp3/.wav,
#      narration.srt, chapters.txt, script.txt)
#
# cut: paragraphs left out, by their opening words. drop: brackets that
# explain a word, by their opening words. edits: `from` -> `to`, each `from`
# found once in the story; the other brackets become part of the sentence.
