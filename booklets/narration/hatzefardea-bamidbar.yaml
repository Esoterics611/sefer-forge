title: הצפרדע במדבר
lang: he
voice: he-IL-Chirp3-HD-Charon
speed: 1.0

intro: >
  שבחי הבעל שם טוב, בעברית של ימינו.

outro: >
  כאן מסתיימים הסיפורים האלה משבחי הבעל שם טוב.

stories:
