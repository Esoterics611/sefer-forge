      - (לולקע)

  - n: 3
    cut:
      - (פעם אחת באו
    edits:
      - from: '(אמר לו הבעל שם טוב: "תלמיד חכם אתה!", ובדיבור הזה העלה אותו הרבה.)'
        to: 'אמר לו הבעל שם טוב: "תלמיד חכם אתה!", ובדיבור הזה העלה אותו הרבה.'
      - from: ' (אלישע בן אבויה)'
