    drop:
      - (זעקסער)
      - (זופיצא)
    edits:
      - from: עורות של מארדער (סוג של חיית פרווה)
        to: עורות של מארדער, סוג של חיית פרווה
      - from: (בחורף היה לבעל שם טוב בית התבודדות בכפר, אצל גוי ששכר ממנו שם בית.)
        to: בחורף היה לבעל שם טוב בית התבודדות בכפר, אצל גוי ששכר ממנו שם בית.


  - n: 11
